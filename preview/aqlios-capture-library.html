, \"You do not have permission to update this role.\"\n\n## 4. Create New Role \u2014 `/verticals/public/roles/create`\n- Breadcrumb `Roles & Permissions / Create New Role`. Title **Create New Role** / \"Create new role by entering the information below.\"\n- Buttons: **Cancel** (outlined) and **Save Changes** (cyan, enabled).\n- Fields:\n  - `Role Name *`: placeholder \"Enter role name (must be unique)\"\n  - `Role Description`: placeholder \"Brief description of your role...\", counter `0 / 100`\n- Permissions: same accordion as Edit, all unchecked.\n- Validation (on blur): `Role name is required.` Note the trailing full stop, which the practice form messages don't have.\n- Permission search with no results: centred grey text `No results matching \"zzzz\"`.\n\n## Permission catalog (Public Primary Care, 103 permissions in 18 modules)\nNames are stored as `Module:Parent:Child`; the UI indents children under parents and shows the description text.\n\n| Module | Count | Permissions (indent = child) |\n|---|---|---|\n| Activity Tracker | 1 | View Activity Tracker |\n| Appointment | 12 | View Alternative Appointment Approval Requests \u203a Approve/Reject\u2026 \u00b7 View Appointments List/Calendar View \u203a Schedule/Request Follow-up \u00b7 View Appointment Detail \u203a (Join and Complete, Reschedule and Cancel) \u00b7 View Open/Available and Booked Slots \u203a (Book Appointments for Patients \u203a Book Slots for Other Staff \u00b7 Open Slots for Patients \u00b7 Request Slots for Other Staff) |\n| Billing | 1 | Billing |\n| Dashboard | 1 | View All Insights |\n| Exit Interview Management | 2 | View Exit Interviews \u203a Manage Exit Interviews |\n| HR Analytics | 1 | View Analytics |\n| HR Policies | 2 | View Policies \u203a Manage Policies |\n| Leave Management | 5 | Apply for Leave \u00b7 Approve/Reject Leaves \u00b7 View Leave Balance Summary \u00b7 View Leaves Requests \u00b7 View Staff Leave History |\n| Org Chart Management | 2 | View Org Chart \u203a Manage Org Chart |\n| Patient Consultation Requests | 16 | Access All Inboxes \u203a Assign/Reassign \u00b7 Change Status \u00b7 Chat with Patient \u00b7 Close/Reopen \u00b7 Copy into Clinical System \u00b7 Fetch/View Medical History \u00b7 Fetch from Clinical System \u00b7 Forward a Case \u00b7 Mark Urgent/Routine \u00b7 Open in Clinical System \u00b7 Prescribe Medicine \u00b7 Request a Test \u00b7 Request Documents/Info \u00b7 View/Add/Delete Clinical Notes \u00b7 View/Add/Edit/Delete Snomed Codes |\n| Patients | 6 | View List of Patients \u203a Archive/Unarchive \u00b7 Send/Resend Invites \u00b7 View Patient Details \u203a View List of Requests \u203a View Request Details |\n| Performance Management | 11 | Manage Configuration \u00b7 View/Manage 360 Feedback \u00b7 View/Manage Bonus Points \u00b7 View/Manage Key Results \u00b7 View/Manage Meetings \u00b7 View/Manage Objectives |\n| Recruitment Management | 9 | Approve Requisitions \u00b7 Manage Configuration \u00b7 Request Job Openings \u00b7 View/Manage Candidates \u00b7 View/Manage Interviews \u00b7 View/Manage Job Openings |\n| Role Permission Management | 4 | Assign/Reassign Roles of User \u00b7 List All Roles \u203a View Associated Users to a Role \u00b7 View Permissions for a Role |\n| ROTA Management | 10 | Access Practice and Staff View \u203a Create and Apply ROTA Template \u00b7 Create ROTA Assignment \u00b7 Download ROTA \u00b7 Edit and Delete ROTA Assignment \u00b7 Reassign Staff or Practice \u00b7 View List of ROTA Groups \u203a (Add/Edit/Assign ROTA Groups \u00b7 Publish Slot, Accept or Reject Bidding) \u00b7 Bid for a ROTA Slot |\n| Settings | 9 | View Appointment Configurations \u203a Edit \u00b7 View Roles and Permissions \u00b7 View Standard and Staff-created Templates \u203a Add/Edit Staff-created \u00b7 Add/Edit Standard \u00b7 Delete Staff-created \u00b7 Delete Standard \u00b7 Move Staff-created to Standard |\n| Skills Management | 2 | View Skills \u203a Manage Skills |\n| Staff Management | 9 | View Staff List \u203a Approve/Reject User \u00b7 Archive/Unarchive \u00b7 Lock/Unlock \u00b7 Send/Resend Invite \u00b7 View Staff Details \u203a (Update Contract, Operating Hours and Leave Entitlement \u00b7 Update Staff Details \u00b7 Verify/Approve/Reject/Download Compliance Documents) |\n\nNurse role currently has 3/4 in Role Permission Management (all except \"View associated users to a role\") and nothing else.\n\n## Issues found\n- Dates are **MM/DD/YYYY** here but **DD/MM/YYYY** in Practice Management.\n- Pagination text formats differ between modules.\n- Primary action colours differ: Edit and Save on role pages are cyan `#5CE1E6`, while Practice pages use teal `#2C7A7B`.\n- Character counters use two formats (`40 / 100` vs `0/500 characters`), and error messages are inconsistent about the trailing full stop.\n- No unsaved-changes confirmation when cancelling an edit.\n- The roles API path lacks `/v1/` (`users/sub-apps/...`), unlike `users/v1/...`.\n- HR's Role Name cell has no accessible text node (it was missing from the accessibility tree, though it's visible).\n\n## To capture\n- [x] Delete Role dialog on screen. See `docs/practice/09-confirmation-popups.md`\n- [ ] Create or save success toasts and the duplicate-name error (would change data)\n- [ ] Staff detail page from Associated Users \ud83d\udc41\n- [ ] Practice filter dropdown values on Associated Users\n"}, {"id": "super-admin/06-rota-management", "title": "ROTA Management (HUB)", "md": "# Super-admin \u00b7 ROTA Management (HUB)\n\nCaptured 2026-10-27 (week 26 Oct \u2013 1 Nov 2026). Nothing was created, assigned or saved.\nRoute: `/verticals/public/rota`. The three tabs switch **in place with no URL change**.\n\n## Page shell\n- No breadcrumb on this module.\n- **Top tab bar**: a white pill container with three pill tabs, each with an icon. The active tab is teal filled with white text; inactive tabs are grey text.\n  1. \ud83d\udcc5 **Rota Management**\n  2. \ud83d\udc65 **Rota Groups**\n  3. \ud83d\udcc8 **Activity Tracker**\n- The tab bar stays fixed at the top while the calendar scrolls.\n\n---\n\n## Tab 1 \u00b7 Rota Management\n\n### Header\n- Calendar-grid icon, **Hub ROTA Management** (bold), subtitle showing the current view (\"Practice View\" / \"Staff View\").\n- **View switch**: a large pill toggle, `Practice View` | `Staff View` (active is teal filled).\n- Action row:\n  | Button | Style | State |\n  |---|---|---|\n  | \u2b07 Download Rota | outlined pill | **disabled** (greyed) until something is selected |\n  | \u29c9 Apply Rota Template | outlined teal pill | enabled (not opened) |\n  | \uff0b Create Rota Template | filled teal pill | enabled (not opened) |\n\n### Toolbar (white card)\n- Week navigator: `\u2039` \u00b7 **26 Oct - 1 Nov 2026** (pill) \u00b7 `\u203a`.\n- Range toggle: `Day` | **`Week`** (default Week).\n- Filters: small outlined selects, 13px / 500, 12px radius, label 12px `neutral.500`, focus border teal, menu max-height 240px.\n\n| Filter | Options | Notes |\n|---|---|---|\n| Staff | All + staff list (loads more on scroll) | `GET rota/v1/.../available-staff?date=` |\n| Staff Type | All, Salaried, Locum | |\n| Duty Type | All + 10 duty types (below) | |\n| Roles | All, Care navigator, Clinician, HR, Nurse, Practice Manager | `GET users/.../roles?is_paginated=false` |\n| Practice | All + practices | only shown at hub level |\n| Rota Group | All, Primary Rota Group, Duty Rosters, Croft Hall Rota Group | `GET public/v1/.../rota-groups/?status=active` |\n| Show | All, Holidays, Leaves, Published Slots | **multi-select** with checkboxes; choosing All clears the others |\n| Date | Date picker `DD/MM/YYYY`, default today | |\n\n### Legend\nSmall 10px squares with 3px radius, uppercase grey group labels.\n| Group | Item | Colour |\n|---|---|---|\n| SESSION TYPE | AM | `#0EA5E9` |\n| | PM | `#16A34A` |\n| DUTY TYPE | On Call | `#FB3748` |\n| | Care-home / Ward Round | `#7D52F4` |\n| | Extended Access | `#FBD249` |\n| | Nursing | `#717784` |\n| | Admin Session | `#22D3BB` |\n| | Neighbourhood Shift | `#FF936C` |\n| | Remote Working | `#95C3FF` |\n| | PPT / PLT / CPD | `#FFD5C0` |\n| | AM Session | `#03A9F4` |\n| | PM Session | `#1FC16B` |\n| GAPS (2px dashed outline) | Leave-created | `#F97316` |\n| | Published | `#06B6D4` |\n| | Holidays | `#22C55E` |\n| | Unallocated | `#D1D5DB` |\n\nDuty type enum (code): `ON_CALL, CARE_HOME_WARD_ROUND, EXTENDED_ACCESS, NURSING, ADMIN_SESSION, NEIGHBOURHOOD_SHIFT, REMOTE_WORK, PPT_PLT_CPD, AM_SESSION, PM_SESSION`.\n\n### Calendar body\nTwo columns:\n- **Left side panel** (~190px, collapsible with `\u2039` \"Collapse Sidebar\"):\n  - **Practice View**: header \"Select Practice\". The first card is **All Practices** / \"Show all locations\" (teal-tint selected state). Then one card per practice:\n    - building icon, **name** (truncated), opening hours (`08:00 - 20:00`)\n    - `Weekly Capacity` \u00b7 **`72h remaining`** (bold)\n    - a thin progress bar\n    - `0h assigned` \u00b7 `72h total`\n  - **Staff View**: header \"Select Staff\". Collapsible groups by role with counts: **Practice Managers(8)**, Care navigators(1), Clinicians(16), HRs(1), **s(1)** \u26a0, Furqan Practice Managers(1). Each staff card has the name, a role chip (outlined teal pill, e.g. \"Practice Manager\"), working hours and the same capacity block.\n- **Week grid**:\n  - Columns Mon\u2013Sun with header `Mon \u2026 26 Oct`. **Today's column** has a light teal tint and a teal underline on its header.\n  - Rows every 30 minutes from 00:00 to 23:30. Hour labels are bold and half-hours faint.\n  - **Current time line**: a dashed teal line across the week with a \u25b6 marker on the left.\n  - Every empty slot has an \"Assign Staff\" target (shows on hover); clicking it starts an assignment, which wasn't captured.\n- Loading: a thin `LinearProgress` bar above the grid, and the side panel fades while staff and practices load.\n- This week had no assigned shifts, so the shift block design is **not yet captured**.\n\n### APIs\n- `GET /api/crm/api/rota/v1/sub-apps/{subAppId}/available-practices?week_start=YYYY-MM-DD`\n- `GET /api/crm/api/rota/v1/sub-apps/{subAppId}/available-staff?date=YYYY-MM-DD`\n- `GET /api/crm/api/public/v1/sub-apps/{subAppId}/rota-groups/?status=active`\n- `GET /api/crm/api/users/sub-apps/{subAppId}/roles?is_paginated=false`\n\n---\n\n## Tab 2 \u00b7 Rota Groups\n- Title **ROTA Groups** (bold) / \"Manage and assign rota groups\". On the right, **\uff0b Create Rota Group** (teal pill).\n- Filter card: `\u2630 Filters:` \u00b7 `Role` select (All Roles + roles) \u00b7 `Status` select (All Statuses, Active, Inactive) \u00b7 on the right, search \"Search rota groups by name...\" with a \ud83d\udd0d icon.\n- Table:\n  | Column | Content |\n  |---|---|\n  | Group Name | bold |\n  | Role | comma-separated role names |\n  | No of Practices | \"15 sites\" |\n  | No. of Staff | integer |\n  | Status | **Active** chip (light green bg, green border and text, small) |\n  | Actions | \u270e edit (teal pencil) |\n- Data: Primary Rota Group (Public Super Admin, Clinician, Practice Manager, Nurse \u00b7 15 sites \u00b7 10), Duty Rosters (\u2026 Receptionist \u00b7 5 sites \u00b7 0), Croft Hall Rota Group (Clinician, HR \u00b7 2 sites \u00b7 3).\n- Pagination `1\u20133 of 3`.\n\n### Create Rota Group modal \u2b50 (reference for modals)\n- MUI Dialog, **600px wide, 16px radius**, shadow `0 12px 40px rgba(0,0,0,0.12)`, backdrop `rgba(0,0,0,0.5)`, 12px padding.\n- Header: **Create Rota Group** (20px / 600) with a \u2715 close button on the right.\n- Intro: \"Add basic information and select practices and staff to create a rota group.\"\n- Fields:\n  | Field | Required | Notes |\n  |---|---|---|\n  | Group Name | \u2713 | placeholder \"e.g. North London Emergency Pool\" |\n  | Description (Optional) | | helper \"Only alphanumeric text and standard punctuation are accepted.\" \u00b7 counter `0/300` |\n  | Select Practices | \u2713 | autocomplete |\n  | Select Roles | \u2713 | **disabled until a practice is chosen**: \"Select practice first\" |\n  | Select Staff | \u2713 | **disabled until a role is chosen**: \"Select role first\" |\n  | Active Status | | switch in a tinted box (bg `#FAFDFD`, border `rgba(44,122,123,0.12)`, 8px radius), \"Set this rota group as active or inactive\", on by default |\n- Footer: **Cancel** (outlined, `#CCCCCC` border, `#666` text, 100px radius, 48px high) and **\ud83d\udcc5 Create Group** (`type=submit`, disabled grey `#E5E7EB` until valid).\n- Cancel closes with no confirmation.\n\n---\n\n## Tab 3 \u00b7 Activity Tracker\n- Title **Activity Tracker** (24px / **400**, not bold like other titles) / \"Manage and view staff activities here.\"\n- Filters: `\u23f7 Filters:` \u00b7 Staff (All Staff) \u00b7 Practice (All Practices) \u00b7 Status (All Statuses, Active, Inactive) \u00b7 Date (today) \u00b7 Search \"Search by staff name...\" (\ud83d\udd0d).\n- **Stats strip** (grey `#F5F7FA` panel), three stats each with a coloured left bar:\n  | Stat | Colour | Value |\n  |---|---|---|\n  | Active Now | `#2E7D32` | 00 |\n  | Inactive | `#FFB400` | 02 |\n  | On Leave | `#9C27B0` | 00 |\n  Values are zero-padded, ~34px.\n- **Staff activity cards** (bordered list, one per staff member):\n  - **Name - ID** (e.g. \"Appointments Example - 6500\") and the date. Status chip on the right (**Inactive**: amber outline `#FFB400`, bg `rgba(255,180,0,0.04)`).\n  - Label/value rows: Practice Name \u00b7 Duty Type (\u25a0 swatch + \"Standard\") \u00b7 Login Time (`5:43 AM` or `-`) \u00b7 Logout Time \u00b7 Allocated Hours (`8h`).\n- Pagination `1-2` (hyphen, not an en dash).\n\n## Issues found\n- **\"s(1)\"** staff group in Staff View: a role with an empty name, pluralised with \"s\".\n- Session-type AM colour `#0EA5E9` differs from the duty-type \"AM Session\" colour `#03A9F4`. PM is `#16A34A` vs `#1FC16B`.\n- Activity Tracker shows **\"Standard\"** duty type, which isn't among the 10 duty types.\n- Activity Tracker uses **12-hour time** (`5:43 AM`); the rest of the app uses 24-hour.\n- The Status filter lacks **On Leave** even though On Leave is a stat.\n- Title weights differ: Activity Tracker is 400, other module titles are 600\u2013700.\n- Column headers are inconsistent: \"No of Practices\" vs \"No. of Staff\".\n- Pagination dash style is inconsistent (`1\u20133` vs `1-2`).\n- Tabs don't change the URL, so you can't link to or refresh into Rota Groups or Activity Tracker.\n- Modal buttons (Cancel `#666`, 100px radius) use different values from page buttons (999px, teal).\n\n## To capture\n- [ ] A week with real shifts (shift block design, hover tooltip, click detail)\n- [ ] Day view\n- [ ] Assign Staff flow (click an empty slot)\n- [ ] Create Rota Template and Apply Rota Template screens\n- [ ] Download Rota (enabled state and file format)\n- [ ] Edit Rota Group (\u270e)\n- [ ] Rota Group modal validation messages\n"}, {"id": "super-admin/07-payroll", "title": "Payroll (FINANCE)", "md": "# Super-admin \u00b7 Payroll (FINANCE)\n\nCaptured 2026-10-27. **Status: not built.** Route: `/verticals/public/coming-soon/payroll`.\n\n## What's on screen: the shared \"Coming soon\" placeholder\nThe same layout is used by all 7 unbuilt modules (Leaves Management, Notification Management, Reports, Payroll, Workforce Validation, Vacancy Management, Application Tracking). Only the name and icon change.\n\n- Vertical shell header (\u2630, Back to Verticals, logo with \"Public Practice\", \ud83d\udd14, user pill). **No breadcrumb.**\n- Grey rounded page panel.\n- `ModulePageHeader`: white circle tile with a teal **briefcase** icon \u00b7 **Payroll** (32px / 700, `rgba(0,0,0,0.87)`) \u00b7 \"Coming soon\" (16px, `rgba(0,0,0,0.6)`).\n- Centred empty state, vertically centred in the panel:\n  - ~72px circle, `surface.tealLight` `#E0F2F1`, teal briefcase icon\n  - **Payroll** (28px / 700, `rgba(0,0,0,0.78)`)\n  - \"We are currently building Payroll. It will be available here soon.\" (16px, `rgba(0,0,0,0.55)`)\n  - **COMING SOON** pill: 13px / 600, uppercase, text `#2DD4BF` (`accent.teal`) on `#E0F2F1`, 99px radius\n- No buttons and no \"Go back\" link. The sidebar is the only way out.\n\n### All coming-soon modules (checked 2026-10-27)\nEvery one of these routes renders the same template, with only the name changing. Copy: \"We are currently building {Module}. It will be available here soon.\"\n| Module | Route | Section |\n|---|---|---|\n| Leaves Management | `/coming-soon/leaves-management` | HUB |\n| Notification Management | `/coming-soon/notification-management` | COMMS |\n| Reports | `/coming-soon/reports` | ANALYTICS & REPORTING |\n| Payroll | `/coming-soon/payroll` | FINANCE |\n| Workforce Validation | `/coming-soon/workforce-validation` | FINANCE |\n| Vacancy Management | `/coming-soon/vacancy-management` | RECRUITMENT |\n| Application Tracking | `/coming-soon/application-tracking` | RECRUITMENT |\n\n**Loading state:** before the page renders, every protected route first shows a blank white page with only the text **\"Verifying session...\"** while the session is checked. There's no logo or spinner.\n\nNote: the permission catalog already has permission groups for several of these (Leave Management: 5, Recruitment Management: 9, HR Analytics: 1), so backend work exists for them even though the UI says \"coming soon\".\n\n## What exists in the code for Payroll\n- **Menu entry:** FINANCE section \u2192 `{ id: \"payroll\", label: \"Payroll\", icon: briefcase }`, next to Workforce Validation (`userFollow` icon).\n- **Status colour tokens** `payrollStatus`, suggesting a document or timesheet verification flow:\n  | Status | Colour |\n  |---|---|\n  | verified | `#2E7D32` |\n  | pendingUpload | `#F59E0B` |\n  | pendingVerification | `#0288D1` |\n  | rejected | `#D32F2F` |\n  | expired | `#78716C` |\n- **No permissions:** the permission catalog has no Payroll module. The \"Billing\" module has a single permission, \"Billing management module of practice\".\n- **No payroll API calls, components or copy** in the bundles loaded so far.\n\n## Implications for building Payroll\n- This is a new feature. Under `CLAUDE.md` rule 6, it needs a plan and your approval first, starting with the **requirements** (what payroll covers: timesheets from ROTA hours, locum invoices, salaried pay runs, document verification?).\n- Likely data sources already in the app:\n  - ROTA allocated and assigned hours, and the Staff Type filter (Salaried / Locum)\n  - Activity Tracker login and logout times\n  - Workforce Allocation config on the practice profile\n- New permissions will be needed (for example \"Payroll: View / Manage / Approve\") in the same `Module:Parent:Child` format as the existing catalog.\n- Reuse: `ModulePageHeader`, `FilterBar`, `DataTable`, `StatusChip` (with the `payrollStatus` colours), `StatsStrip`, `FormModal`.\n\n## Issues found\n- The menu config is defined **three times** in the bundle, with section labels in different cases (\"FINANCE\" vs \"Finance\").\n- Header title styles differ: 32px at 0.87 opacity here, against 24\u201326px at 0.78 on built modules. The empty-state title is 28px.\n- The placeholder has no Go Back or link to the dashboard.\n"}, {"id": "super-admin/08-cqc-compliance", "title": "CQC Compliance (COMPLIANCE)", "md": "# Super-admin \u00b7 CQC Compliance (COMPLIANCE)\n\nCaptured 2026-10-27. Route: `/verticals/public/compliance-dashboard`. Icon: `/layout/compliance_dashboard_icon.svg`.\n\n> \u26a0 **Not seen rendered.** For super-admin the page's data call returns **401**, and the app then **logs the user out** (`POST /api/auth/logout`) and redirects to `/auth/login`. This happened on 2 of 2 tries, both times straight after profile and practice calls that returned 200, so it isn't an expired session.\n> Everything below is read from the page's own code (`app/verticals/[verticalId]/compliance-dashboard/page-*.js`). Colours and text are exact; exact layout and spacing still need a visual capture with a role that has access, such as Practice Manager.\n\n## Bug: a 401 from one endpoint logs the whole user out\n- `GET /api/crm/api/public/v1/sub-apps/{subAppId}/staff/dashboard/?page=1&page_size=10` \u2192 **401**\n- The app's API client treats any 401 as \"session expired\" and calls logout.\n- Expected: a 403-style \"You don't have access to this module\" state (the app already has copy like this elsewhere, e.g. \"You do not have permission to view this role.\"), or the menu item hidden for this role.\n- Also check the backend: super-admin probably *should* have access. If so, the endpoint wrongly returns 401.\n\n## Screen (from code)\n\n### Guard\nIf the vertical isn't Public: \"Compliance Dashboard is available for Public practices only\".\n\n### Stat cards (6)\n| Label | Caption | API field |\n|---|---|---|\n| Total Staff | Across All Practices | `total_staff` |\n| Compliant | \u2014 | `compliant` |\n| Pending Upload | Waiting on action | `pending_upload` |\n| Awaiting Verification | Uploaded but not verified | `awaiting_verification` |\n| Re-verification Due | \u2014 | \u2014 |\n| Expired | Require re-upload | `expired` |\n\nThe response also has `rejected`, which has no card.\n\n### Filters\n`Filters:` label, then:\n| Filter | Options |\n|---|---|\n| Practice | All Practices + practice list (`GET .../practices?page_size=1000`) |\n| Compliance Status | All Statuses, Compliant (`ACTIVE`), Pending Upload (`PENDING_UPLOAD`), Awaiting Verification (`PENDING_VERIFICATION`), Re-verification Due (`REVERIFICATION_DUE`), Expired (`EXPIRED`) |\n| Search | label \"Search\", placeholder \"Search by name, role or skill...\", \ud83d\udd0d end icon, **400ms debounce** |\n\nQuery params: `page`, `page_size`, `practice_id`, `search`, `user_name`, `verification_status`.\n\n### Table (min-width 720px; all columns centred except Staff Name)\n| Column | Content |\n|---|---|\n| Staff Name | `first_name last_name`, falls back to email |\n| Practice | `practice_name` |\n| Compliance Status | status chip |\n| Waiting Since | date, or `-` |\n| Last Updated | date |\n\n- Rows highlight on hover (MUI `hover`).\n- Loading: one full-width row, \"Loading compliance data\u2026\"\n- Empty: \"No staff found. Adjust your filters or search term.\"\n- Error: \"Failed to load compliance dashboard\"; on timeout, \"Request timed out. Please check your connection and try again.\"\n- Pagination: **\"Records per page:\"** with options **10, 20, 30, 40, 50**. The label reads `1\u201310 of N (X Users)`.\n\n### Status chips (text colour, 4%-tint background)\n| Status (incl. aliases) | Shown as | Colour | Bg |\n|---|---|---|---|\n| Active / Verified / Compliant | Compliant | `#2E7D32` | `rgba(46,125,50,0.04)` |\n| Pending Upload | Pending Upload | `#EF6C00` | `rgba(239,108,0,0.04)` |\n| Reverification Due / Re-verification Due | Re-verification Due | `#EF6C00` | same |\n| Pending Verification / Awaiting Verification | Awaiting Verification | `#0288D1` | `rgba(2,136,209,0.04)` |\n| Expired | Expired | `#D32F2F` | `rgba(211,47,47,0.04)` |\n| Rejected | Rejected | `status.rejected` `#EF4444` | `rgba(239,68,68,0.05)` |\n| anything else | as-is | `neutral.500` | `neutral.100` |\n\n## Issues found\n- **No role tried can see the built CQC dashboard.** The module is effectively unreachable in dev.\n- A failed (blocked) request on practice open surfaces as a raw red alert with the bare error message on the practice grid, with no friendly copy.\n- **Logout on 401** (above). This is the most serious bug found so far.\n- The API field is misspelled: **`complaince_status`**.\n- The same status has two spellings (\"Reverification Due\" / \"Re-verification Due\") and two names (\"Pending Verification\" / \"Awaiting Verification\"). The UI papers over this with an alias map.\n- `rejected` is counted but never shown.\n- The pagination label is \"Records per page:\" with 10\u201350 options, while other tables use \"Rows per page:\" with fewer options.\n- The chips use CSS variables with hex fallbacks (`var(--success-main, #2E7D32)`) instead of theme tokens like the rest of the app.\n\n## Second attempt: non-admin practice user (2026-10-27)\nSigned in as a non-admin user (`isAdmin: false`, empty `role` in `/api/auth/me`) linked to 2 practices (Abbey Medical Centre, Main Practice - Surgery).\n- `/verticals/public/compliance-dashboard` **redirects** to `/verticals` \u2192 `/verticals/public/practices`. Hub routes aren't available to non-admins.\n- This role's practice grid has **no \u2630 hub menu**; the user pill subtitle reads **\"Actions\"** instead of a role name.\n- Inside the practice, **CQC Compliance \u2192 `coming-soon/cqc-compliance`** (the same placeholder super-admin sees).\n- So the built CQC dashboard can't be seen by **either** role tried: super-admin gets logged out by the 401, and practice users can't reach the hub route.\n- Opening a practice as this role sends `PATCH \u2026/users/{userId}/user-businesses/{practiceId}/select` (records the current practice) and `POST \u2026/activity/v1/\u2026/user-sessions` (activity tracking). Super-admin doesn't send these.\n- Differences in this role's practice sidebar compared with super-admin: an extra **Profile** item (`/profile`, also linked from the user card), and **no HR Policies**.\n\n## To capture (needs a role with access)\n- [ ] Visual layout: stat-card design, filter bar, table. Needs a hub-level role other than super-admin, or a backend fix for the 401.\n- [ ] Row click (is there a staff compliance detail page?)\n- [ ] Populated data and the real dates format\n"}, {"id": "super-admin/09-settings", "title": "Settings", "md": "# Super-admin \u00b7 Settings\n\nCaptured 2026-10-27. Nothing was saved, and no table switch was clicked.\nRoute: `/verticals/public/settings?section=<section>`. Unlike ROTA tabs, sections **are** in the URL.\n\n## Layout (settings shell)\n- Breadcrumb: `Settings` (underlined link) `/ <Section name>`.\n- Header: white circle tile with a \u2699 icon and **Settings** (bold, ~32px). No subtitle.\n- Two columns:\n  - **Left nav card** (~210px, white, rounded): 4 links. The active one is a bold pill with a light border.\n    | Section | `?section=` |\n    |---|---|\n    | Global Practice Configuration | `practice-configuration` (default) |\n    | Global Appointment Configuration | `appointment-configuration` |\n    | Competency | `competency` |\n    | Pathway Configuration | `pathway-configuration` |\n  - **Content card** (white, rounded): section title (bold) + subtitle, then the content.\n- Config sections have **Cancel** (outlined) and **Save Changes** (filled grey) **top-left under the title**, both disabled until something changes. Other forms put these buttons top-right.\n\n---\n\n## 1. Global Practice Configuration\n\"Manage global practice configurations here.\" These are the defaults behind each practice's own Additional Configuration (see `04-practice-profile.md`).\n\n| Section | Contents |\n|---|---|\n| Appointment Type Configuration **(Mandatory)** | Warning alert (same copy as the practice profile). Rows: \u2610 **Face-to-Face** [Set as Default] \u00b7 \u2611 **Call** [**Default** cyan chip] |\n| Slot Duration Configuration (Optional) | Header button **\uff0b Add Another Slot** (cyan filled pill). Helper: \"Configure slot durations per Practice + Role + Appointment Type combination\". Sub-card **Slot Duration 1** (sliders icon, red \ud83d\uddd1): Role* `Clinician` \u00b7 Appointment Type* `Face-to-Face` \u00b7 Duration (Mins)* `30` |\n| Appointment Booking Configuration | Urgent* `Both` \u00b7 Routine* `Both` |\n| Operating Hours | **Mon \u2192 Sun** order. Each day is a grey rounded box: day \u00b7 cyan switch \u00b7 Open/Closed \u00b7 from-time \u00b7 \"to\" \u00b7 to-time. Mon\u2013Fri Open 09:00\u201318:00; Sat and Sun Closed (times greyed out but visible: 09:00\u201317:00) |\n| Custom practice closed messages | \"These are messages you can set to appear when practice is closed for clinical and non-clinical requests.\" Two blocks, one for **clinical** requests and one for **non-clinical**: bold heading, recommendation text (\"We recommend including guidance\u2026 call 111.\"), `Message *` textarea, \"Character limit: 300\" |\n\n## 2. Global Appointment Configuration\n\"Manage global appointment configurations here\" (no full stop).\n\n| Section | Fields |\n|---|---|\n| Opened Slot Configuration | `Allow patient to select offered slots` with a **Hrs.** suffix (value 799). Live helper: \"Patients can book their appointments within 799 hours.\" |\n| Appointment Reminder Settings | `Send SMS Reminder` and `Send Email Reminder` selects, each with a live helper \"Send SMS reminder to patient for their appointments before 48 hours.\" Options: **No reminder, Before 48 Hours, Before 24 Hours, Before 12 Hours, Before 6 Hours, Before 2 Hours** |\n| Cancellation & Rescheduled Policy | `Minimum Cancellation Notice` (hours) \u00b7 `Minimum Reschedule Notice` (hours), with helpers. Checkboxes (all \u2611): Enable Video Appointments \u00b7 Notify staff when a client cancels \u00b7 Show clinician name to patients \u00b7 Re-open cancelled slot for immediate booking |\n| Appointment Booking Configuration | `Max Advance Booking Period *` (Days suffix, 799) \u00b7 **Same Day Booking** switch (\"Not Allowed\") \u00b7 Urgent* `Admin Staff` \u00b7 Routine* `Admin Staff` \u00b7 \u2611 Require Manager Approval for alternative appointments |\n| Urgent Capacity Threshold | Day rows (Mon\u2013Sun) as in Operating Hours \u00b7 `Extra Appointments *` select (`Creating additional same-day appointments`) |\n| Additional Slot Duration N | Repeating, header button **Add Another Slot**. Fields: Role* \u00b7 Appointment Type* \u00b7 **Staff*** \u00b7 Start Time* \u00b7 End Time*. Values: Clinician / Telephone/Audio / \"Ali Emis - 201\"; Clinician / Online (Video) / \"Ali Ali\" |\n\nAppointment types seen here: **Telephone/Audio, Online (Video)**.\n\n## 3. Competency\n\"Manage clinical competency categories and sub-types used for staff assignment and task routing.\"\n- **\uff0b Add Competency** (cyan filled pill, top-left).\n- Table with a **teal-tint header row** (unlike the white headers elsewhere):\n  | Competency Type | Role | Sub Types | Slot Duration | Staff Assigned | Date Added | Actions |\n  |---|---|---|---|---|---|---|\n  | Only new | Nurse | Only new one | 30 mins | 0 | 05/10/2026 | |\n  | Furqan Clinician Multiple Type | HR, Nurse, Clinician | Sub1, Sub2, Sub3 | 30 mins | 1 | 02/10/2026 | |\n  | ENT | Furqan Practice Manager | Throat, Nose, Ear | 30 mins | 4 | 11/08/2026 | |\n- Sub Types wrap into tall rows. The table is **wider than its card**, so Date Added and Actions are cut off and scroll sideways.\n- Pagination `1\u20133 of 3`.\n\n### Add Competency drawer \u2b50 (reference for side drawers)\n- MUI **Drawer from the right, 480px**, 18px radius, MUI elevation-16 shadow, page dimmed behind.\n- Header: **Add Competency** (bold) + \u2715, divider. Intro: \"Define a competency type and its associated sub-types.\"\n- **Labels above the fields** (bold 14px, red `*`), not floating labels:\n  | Field | Required | Placeholder |\n  |---|---|---|\n  | Competency Type Name | \u2713 | e.g. Respiratory |\n  | Description (optional) | | Describe this competency type... (grey textarea) |\n  | Roles | \u2713 | Select Roles (multi-select) |\n  | Slot Duration | \u2713 | e.g. 30 + unit select (**only \"Mins\"**) |\n  | Sub Types | \u2713 | Sub-type 1 \u2026 plus **\uff0b Add Sub-type** (cyan pill, right-aligned) |\n- Sticky footer: **Cancel** (outlined, cyan text) \u00b7 **\u2713 Save Competency** (cyan filled).\n\n## 4. Pathway Configuration\n\"Manage practices-wide pathway configuration settings here.\" Title is **regular weight**, not bold like the other sections.\n- `\u23f7 Filters:` Type (All, **Clinical, Administrative**) \u00b7 Status \u00b7 Channel \u00b7 Routing (2nd row) \u00b7 full-width Search (\"Search here..\").\n- Table columns: Pathway \u00b7 Type \u00b7 Status \u00b7 **Mobile App \u00b7 Web App \u00b7 Voice Agent \u00b7 Website \u00b7 Care Navigator** (inline cyan switches per channel) \u00b7 Routing (Hub / Practice) \u00b7 Actions. This table is also wider than its card.\n- Rows are **grouped by specialty**, each with a header row \"N of M active\":\n  Administrative and Non-Clinical (2/5) \u00b7 Cardiovascular and Metabolic (0/7) \u00b7 Dermatology (1/3) \u00b7 Ear, Nose and Throat (1/5) \u00b7 Gastrointestinal (0/6) \u00b7 Long-Term Conditions, Frailty and Complex Care (0/1) \u00b7 Men's Health (0/1) \u00b7 Mental Health and Neurology (1/4) \u00b7 Musculoskeletal (0/6) \u00b7 Ophthalmology (0/1) \u00b7 Paediatric and Child Health (0/1) \u00b7 Respiratory (1/4) \u00b7 Women's Health (1/5)\n- Status chips: **Active** (green outline and tint) \u00b7 **Draft** (outlined grey) \u00b7 **Archived** (grey filled). Draft rows show `\u2014` instead of switches.\n- Example rows (Administrative): Ongoing or Longstanding Issue Follow-up with a Specific Clinician Assessment (Draft) \u00b7 Medication Query Assessment (Active, Hub; Mobile App switch grey/off) \u00b7 Covid Vaccine (Archived, Practice) \u00b7 Death Process (Draft, Hub) \u00b7 Home Visit Request (Active, Practice).\n- \u26a0 The channel switches look like they **save immediately**; they weren't clicked.\n\n## Issues found\n- **Appointment type names disagree across the app:** \"Face-to-Face / Call\" (global), \"Face To Face Surgery / Telephone Or Audio / Face To Face Home Visit / Written Including Online / Admin Work\" (practice), \"Telephone/Audio / Online (Video)\" (additional slots).\n- **Urgent/Routine options:** the global page shows \"Admin Staff\" for both. Given the value/label mix-up found on the practice profile (`URGENT` labelled \"Admin Staff\"), these saved values may be wrong.\n- **Operating Hours layout breaks:** the \"to\" time wraps onto its own line in each day box.\n- **Saved closed messages are cut off** mid-word (\"\u2026e.g. te\"), even though the limit is 300 characters, so text is being lost on save or load.\n- **Day order differs:** Mon\u2192Sun here, Sun\u2192Sat on the practice forms.\n- **Test-looking values** in dev data (799 hours/days) suggest the number fields have no max limit.\n- **Three form styles across the app:** floating-label MUI fields (most forms), labels above the fields (drawer), and suffix adornments.\n- **Button colours mixed:** cyan (`#5CE1E6`) for Add Competency, Add Another Slot and Save Competency; teal elsewhere.\n- **Tables overflow their cards** (Competency and Pathway); there's no responsive column handling.\n- **Header mismatches:** \"Cancellation & Rescheduled Policy\" (mixed tense); Global Appointment's subtitle lacks the full stop that the others have.\n- **Inconsistent table header styling:** a teal tint here, white elsewhere.\n\n## To capture\n- [ ] Each section's Save success and validation\n- [x] Competency delete confirm (see `docs/practice/09-confirmation-popups.md`); edit drawer is in this doc\n- [ ] Pathway detail page (row action is only \"Configure\"; no confirmations)\n- [ ] What toggling a channel switch does (needs your OK; probably saves immediately)\n"}, {"id": "super-admin/10-template-library", "title": "Template Library (HUB)", "md": "# Super-admin \u00b7 Template Library (HUB)\n\nCaptured 2026-10-27. I didn't create, edit, deactivate, move or delete any template.\nRoute: `/verticals/public/templates`. The tabs don't change the URL.\n\n## Layout\n- No breadcrumb. Header: white circle tile with a document icon and **Templates Library** (bold, ~30px). No subtitle.\n- One white bordered card holds everything:\n  - **Communication Templates (27)** (bold, 18px).\n  - **Pill tab switch**: `Standard Templates` | `Staff Created Templates`. The active tab is **cyan `#5CE1E6`** with dark teal text `#255A5C`; inactive tabs are grey text. Pill radius 72px, 38px high, 12px / 500.\n  - Sub-header: \ud83d\udc64 icon and **Standard Templates (16)** / **Staff Created Templates (11)**. On the right, **\u2295 Add Template** (cyan pill, 47px high, 90px radius, Standard tab only).\n  - Filter row (labelled outlined fields), with `\u2715 Clear filters` (greyed until a filter is set).\n  - Full-width **Template Categories** select (no label; it filters which category groups show).\n  - **Category groups**: a bordered rounded box (18px radius) titled **Category (n)**, holding a **2-column grid of template cards**.\n\n## Filters\n| Tab | Filters |\n|---|---|\n| Standard | Search (\"Search templates by name...\", \ud83d\udd0d start icon) \u00b7 Type \u00b7 Status |\n| Staff Created | Search \u00b7 Type \u00b7 **Created By** \u00b7 Status |\n\n- Type: Message, Email, Note (the type chips).\n- Status: Active, Inactive, Draft.\n- Template Categories (also the Category field in the form): **Appointments, Prescription, Medicine, Payment, Consultation / Requests, Diet & Lifestyle, Documents, Blood Tests, Measurements & Vitals, Medical History**.\n\n## Template card\n- Light grey `#FAFAFA` card, rounded.\n- Top row: **type chip** and **status chip** (both 22px high, 16px radius, 11px text), with a \u22ee menu on the right.\n  | Chip | Text | Bg |\n  |---|---|---|\n  | Message | `#0288D1` | `rgba(2,136,209,0.04)` |\n  | Note | `#0288D1` (same as Message) | same |\n  | Email | `#9C27B0` | `rgba(156,39,176,0.04)` |\n  | Active | `#16A34A` | `rgba(76,175,80,0.15)` |\n  | Inactive | default text | `#F1F1F1` |\n- **Template name** (bold).\n- Email only: \"Subject: \u2026\" (small grey).\n- Body preview, about 2 lines with \"\u2026\". **Placeholders like `{{patient_name}}` are shown in blue `#0288D1`.**\n- Footer: \"Created by {name}\" (small grey) on the left and the date `DD/MM/YYYY` on the right.\n- Staff Created only: an extra italic line \"Business: Main Practice - Surgery\".\n\n### \u22ee menu\n| Standard template | Staff created template |\n|---|---|\n| \ud83d\udc41 View Details | \ud83d\udc41 View Details |\n| \u270e Edit Template | \u21ea Move to Standard |\n| \u2b24 **Mark as Inactive** (orange text) | \ud83d\uddd1 **Delete Template** (red) |\n| \ud83d\uddd1 **Delete Template** (red) | |\n\nFor an inactive template the third item is probably \"Mark as Active\" (not checked).\n\n## Data (dev)\n- **Standard (16):** Appointments 5 \u00b7 Prescription 2 \u00b7 Medicine 1 \u00b7 Payment 1 \u00b7 Consultation / Requests 1 \u00b7 Diet & Lifestyle 1 \u00b7 Documents 1 \u00b7 Blood Tests 1 \u00b7 Measurements & Vitals 1 \u00b7 Medical History 1. Seeded email templates are \"Created by Aqlios Public Vertical Admin\", dated 22/07/2026 (e.g. Appointment Reminder, Prescription Update, Medication Reminder, Payment Reminder, Blood Test Results).\n- **Staff Created (11):** Appointments 1 \u00b7 Prescription 3 \u00b7 Medicine 1 \u00b7 Payment 1 \u00b7 Consultation / Requests 2 \u00b7 Blood Tests 1 (\u2026), by \"Ali Emis - 201\" and \"Ali Emis Manager\".\n\n## Create Template / Template Details popup \u2b50 (large form popup)\nThe same popup is used for create, view and probably edit.\n- MUI Dialog, **almost full width (~1030px at a 1063px viewport)**, 18px radius, MUI elevation-24 shadow.\n- Header: green document icon tile, **Create Template** / **Template Details** (bold), a small teal chip **Standard Template**, a subtitle and \u2715.\n  - Create subtitle: \"Save reusable patient communication templates.\"\n  - View subtitle: \"View reusable patient communication template.\"\n- **Template Details** card:\n  - Subtitle \"Create a reusable message template.\" (shown in **view mode too** \u26a0)\n  - Top right: a **status select** (outlined pill). Default **Draft**; options Active, Inactive, Draft.\n  - `Template Name *` | `Category *` (two columns)\n  - `Template Type *` radios: **Message (SMS / In-app)** (default) \u00b7 **Email** \u00b7 **Notes**. Email adds a Subject field.\n  - `Template Message *`: a **rich-text editor**\n    - Toolbar: Bold \u00b7 Italic \u00b7 Underline \u00b7 Strikethrough | Link | Align left / center / right / justify | Bulleted / Numbered list | Decrease / Increase indent | Undo / Redo\n    - On the right: **\u2295 Insert Placeholder** (teal text) and **Ask AI** (white pill with a **rainbow gradient border**)\n    - Placeholder: \"Write your template message...\"\n    - Counter: \"Character limit: 0/300\"\n  - **Insert Placeholder** menu: `{{patient_name}}`, `{{patient_dob}}`, `{{appointment_date}}`, `{{appointment_time}}`, `{{practice_name}}`, `{{service_name}}`, `{{doctor_name}}`, `{{clinic_name}}`, `{{clinic_phone}}`, `{{payment_amount}}`, `{{prescription_details}}`, `{{test_name}}`, `{{result_summary}}`\n- **Preview** card: \"See how your template will appear with sample data.\"\n  - A phone-style mock: grey notch bar, practice avatar with \"15 Sefton Road\", and the message in a grey chat bubble.\n  - Empty state: \"Start typing to generate a preview.\"\n- **Sticky footer**:\n  - **Cancel** (outlined, left)\n  - **Save as Draft** (outlined, right)\n  - **Create Template** (filled, **disabled** until the form is valid)\n- View mode: all fields are disabled and greyed, and the editor toolbar is hidden.\n- Cancel closes immediately, with no \"discard?\" confirmation.\n\n## Issues found\n- **Message and Note chips are the same colour**, so you can't tell the types apart at a glance.\n- The view-mode subtitle says \"Create a reusable message template.\"\n- **Dialogs show the browser's default focus ring** (`outline: auto` in amber/gold) around the whole popup when it opens. Focus styling hasn't been handled.\n- Type is \"Notes\" in the radio but \"Note\" on the chip.\n- The tab switch and Add Template button use cyan; the rest of HUB uses teal.\n- This is a third popup size (near full width), alongside the 600px Rota Group popup and the 480px Competency drawer.\n- The page title has no subtitle or breadcrumb, unlike Practice Management and Roles.\n- Test data like \"kk / jjo\", \"Test1212\" and \"Vitamin / t1\" is mixed into the dev seed.\n- No pagination: all groups render at once.\n\n## To capture\n- [ ] Ask AI behaviour (popup? inline generation?)\n- [ ] Email type form (Subject field placement)\n- [ ] Validation messages (name and category required, message over 300)\n- [x] Mark as Inactive / Activate / Delete / Move to Standard confirmations. See `docs/practice/09-confirmation-popups.md`\n- [ ] Edit mode\n- [ ] Empty state for a category or search with no results\n"}, {"id": "super-admin/11-system-feed-and-notifications", "title": "System Feed (SUPPORT) and Notifications", "md": "# Super-admin \u00b7 System Feed (SUPPORT) and Notifications\n\nCaptured 2026-10-27. **Status: neither is built**, although the menu doesn't mark them \"coming soon\" (their routes aren't under `/coming-soon/`).\n\n## Second placeholder style (\"hub placeholder\")\nBoth pages use a placeholder that **differs** from the shared `/coming-soon/*` template (`07-payroll.md`):\n\n| | `/coming-soon/*` template | Hub placeholder (these two) |\n|---|---|---|\n| Header title | module name | **section name** (\"Support\") or page name |\n| Header subtitle | \"Coming soon\" | **\"Practice List\"** \u26a0 copied by mistake |\n| Body | centred directly on the page panel | inside an **inner grey rounded box** (`#F3F4F6`-ish, ~16px radius) filling the panel |\n| Icon circle | ~72px, teal-light, outline icon | ~90px, teal-light, **filled** teal icon |\n| Message | one generic sentence | specific 2\u20133 line copy |\n| Pill | COMING SOON | COMING SOON (same) |\n\n## System Feed \u2014 `/verticals/public/system-feed`\n- Header: \ud83c\udfa7 headset icon tile \u00b7 **Support** / \"Practice List\".\n- Body: filled document icon \u00b7 **System Feed** \u00b7 \"We are currently building the hub-level activity feed management. Soon you will be able to manage your vertical-wide activity feed here.\" \u00b7 COMING SOON.\n\n## Notifications \u2014 `/verticals/public/notifications`\nReached from the sidebar footer and the header \ud83d\udd14.\n- Header: \ud83d\udd14 icon tile \u00b7 **Notifications** / \"Practice List\".\n- Body: filled bell icon \u00b7 **Hub Notifications** \u00b7 \"Stay informed about your vertical's activity. Soon this page will centralize all hub-level alerts, system announcements, and practice/business activity logs.\" \u00b7 COMING SOON.\n- Icon asset: `/layout/notification_icon.svg`.\n\n### Header bell \ud83d\udd14\n- A circular outlined icon button (`link \"Notifications\"`, href `/verticals/public/notifications`).\n- **No unread badge and no dropdown**; it just navigates.\n\n### What exists in the code and API\n- A practice-level notifications endpoint already exists and is called when a practice is opened:\n  `GET /api/crm/api/public/v1/sub-apps/{subAppId}/practices/{practiceId}/notifications/?page=1&page_size=10`\n  So practice notifications have backend support; the hub-level page doesn't use it yet.\n- The COMMS \u2192 **Notification Management** module (`/coming-soon/notification-management`) is a separate, also-unbuilt feature (probably for configuring notifications, as opposed to viewing them).\n\n## Issues found\n- Two different \"coming soon\" designs exist; they should share one `ComingSoonPlaceholder` component.\n- Both pages show the subtitle **\"Practice List\"**, copied by mistake.\n- The menu doesn't tell users these are unbuilt: System Feed and Notifications look like live links.\n- The header bell has no unread indicator.\n\n## Corrected build status (super-admin, Public)\n| Status | Modules |\n|---|---|\n| **Built** (7) | Dashboard (practice grid), Practice Onboarding (list, onboard form, profile), Template Library, Role and Permissions, ROTA Management (3 tabs), Settings (4 sections), CQC Compliance (built, but blocked for super-admin) |\n| **Placeholder** (9) | Leaves Management, Notification Management, Reports, Payroll, Workforce Validation, Vacancy Management, Application Tracking, **System Feed**, **Notifications** |\n"}, {"id": "practice/00-practice-shell-and-module-map", "title": "Practice level \u00b7 Shell and module map", "md": "# Practice level \u00b7 Shell and module map\n\nCaptured 2026-10-27 as super-admin (= Vertical Admin) in **Public Primary Care**, practice **Croft Hall Medical Practice**.\n\n## How you get here\n1. `/verticals` \u2192 **Public Primary Care** card\n2. `/verticals/public/practices` (dashboard grid) \u2192 click a practice card or its \u2197 button\n   - Card hover: the inner pill gets a light teal tint; the \u2197 circle stays navy.\n3. \u2192 **`/verticals/public/practices/{practice-slug}/dashboard`**\n   - The practice is identified by a **slug from its name** (`croft-hall-medical-practice`), not by ID.\n\n## Practice shell (different from the vertical shell)\n| | Vertical level | Practice level |\n|---|---|---|\n| Sidebar | Hidden drawer opened with \u2630 | **Persistent left sidebar** (~195px), collapsible with a `\u2039` circle button on its edge |\n| Top bar | Floating pill: \u2630, Back to Verticals, centred logo, \ud83d\udd14, user pill | Flat white bar: page icon + **page title** / \"Welcome back Aqlios Admin \ud83d\udc4b\"; on the right \ud83d\udd0d, \ud83d\udd14 and the **practice switcher** |\n| Logo | Centred in the header | Top of the sidebar (\"aqlios\" wordmark) |\n| Back to Verticals | Button in the header | **None**; use the practice switcher |\n\n### Top bar (right side)\n- \ud83d\udd0d **Search**: a square outlined icon button (~30px, 8px radius, soft shadow). **Clicking does nothing** (not built).\n- \ud83d\udd14 **Notifications**: the same style of icon button.\n- **Practice switcher**: a white pill button with a soft shadow, **bold practice name** and a \u2304 chevron (\u2303 when open). Menu items:\n  1. **Croft Hall Medical Practice** (current, highlighted with a grey background)\n  2. **Switch Practice**\n  3. **Logout**\n- No user avatar in the top bar; the user card sits at the bottom of the sidebar.\n\n### Sidebar\nSame visual language as the vertical drawer: \"Overview\" label, active item as a mint pill with a teal border, uppercase teal section headers with a left bar and \u2303 collapse. Items are an outline icon plus label. Hover shows a light mint background (e.g. \"Staff off-boarding\").\nPinned footer: \ud83d\udd14 Notifications, \u2699 Settings, teal user card \"AA \u00b7 Aqlios Admin \u00b7 super-admin\".\n\n### Practice dashboard \u2014 `/dashboard`\n- Only a **welcome banner**: a dark-teal gradient card (~100px tall, 18px radius), **\"Welcome, Aqlios!\"** (white, bold, ~26px) and \"You are in **Public Primary Care**\" (vertical name in light blue, bold).\n- Nothing else; no widgets or KPIs yet.\n\n## Practice module map\nBase route: `/verticals/public/practices/{slug}/\u2026`\n\n| # | Section | Item | Route | Status |\n|---|---|---|---|---|\n| 1 | Overview | Dashboard | `dashboard` | Built (banner only) |\n| 2 | EHR | Patients | `patient-management` | Built |\n| 3 | EHR | Tickets | `consultations-review` | Built |\n| 4 | EHR | Appointment | `appointment` | Built |\n| 5 | EHR | Documents | `documents` | Built |\n| 6 | EHR | Call Recall | `coming-soon/call-recall` | Coming soon |\n| 7 | HRM | Staff on-boarding | `staff` | Built |\n| 8 | HRM | Staff off-boarding | `coming-soon/staff-off-boarding` | Coming soon |\n| 9 | HRM | ROTA Management | `rota` | Built |\n| 10 | HRM | Activity Tracker | `rota` (same route as ROTA; probably opens its tab) | Built |\n| 11 | HRM | Leaves | `leave-management` | Built |\n| 12 | HRM | Leaves and ROTA | `leave-and-rota` | Built |\n| 13 | HRM | Compliance | `coming-soon/compliance` | Coming soon |\n| 14 | HRM | Recruitment | `recruitment` | Built |\n| 15 | HRM | Performance | `performance` | Built |\n| 16 | HRM | HR Policies | `hr-policies` | Built |\n| 17 | COMMS | Patient Comms | `coming-soon/patient-comms` | Coming soon |\n| 18 | COMMS | Colleagues Comms | `coming-soon/colleagues-comms` | Coming soon |\n| 19 | COMMS | Notification Management | `coming-soon/notification-management` | Coming soon |\n| 20 | FINANCE | Payroll | `coming-soon/payroll` | Coming soon |\n| 21 | FINANCE | Workforce Validation | `coming-soon/workforce-validation` | Coming soon |\n| 22 | COMPLIANCE | CQC Compliance | `coming-soon/cqc-compliance` | Coming soon (built at vertical level) |\n| 23 | SUPPORT | Survey | `coming-soon/survey` | Coming soon |\n| 24 | SUPPORT | Feedback | `coming-soon/feedback` | Coming soon |\n| 25 | SUPPORT | Colleague Survey | `coming-soon/colleague-survey` | Coming soon |\n| 26 | SUPPORT | Support | `support` | To check |\n| 27 | Footer | Notifications | `notifications` | To check |\n| 28 | Footer | Settings | `settings` | To check |\n\n**Real routes: 16** \u00b7 **Coming soon: 12**\n\n### Verified status (2026-10-27, every real route opened)\n| Status | Modules |\n|---|---|\n| **Built (9)** | Dashboard (banner only), Patients, Tickets, Appointment, Staff on-boarding (`staff`: Staff List / Sent Invitations / Archived Users, Bulk Import, Invite Staff), ROTA Management (tabs **Staff Rota \u00b7 Shift Bidding \u00b7 Activity Tracker**), Leaves (`leave-management`: Leave Requests / Leaves History), Leaves and ROTA (`leave-and-rota`: personal leave balances), HR Policies (`hr-policies/ask`: Ask HR \u00b7 Policy library), Settings (sections: Appointment Configuration, Competency, Pathway Configuration, Practice Profile, Templates) |\n| **Placeholder despite a real route (5)** | Documents, Recruitment, Performance, Support, Notifications. See `04-documents-and-placeholders.md` |\n| **Coming soon (12)** | Call Recall, Staff off-boarding, Compliance, Patient Comms, Colleagues Comms, Notification Management, Payroll, Workforce Validation, CQC Compliance, Survey, Feedback, Colleague Survey |\n\nPractice level: **9 built / 17 not built** (excluding footer duplicates).\n\n### Capture status (all built practice modules done, 2026-10-27)\n| Module | Doc |\n|---|---|\n| Patients | `01-patients.md` |\n| Tickets | `02-tickets.md` |\n| Appointment | `03-appointment.md` |\n| Documents + all placeholders + 12 coming-soon | `04-documents-and-placeholders.md` |\n| Staff on-boarding | `05-staff-onboarding.md` |\n| ROTA Management + Activity Tracker | `06-rota-management.md` |\n| Leaves, Leaves and ROTA | `07-leaves-and-leaves-rota.md` |\n| HR Policies, Settings | `08-hr-policies-and-settings.md` (Settings \u2192 Practice Profile is also a placeholder) |\n| Confirmation popups (all levels) | `09-confirmation-popups.md` |\n\n### Modules new at practice level (not in the vertical menu)\nPatients, Tickets, Appointment, Documents, Call Recall, Staff on/off-boarding, Leaves, Leaves and ROTA, Compliance (HRM), Recruitment, Performance, HR Policies, Patient Comms, Colleagues Comms, Survey, Feedback, Colleague Survey, Support.\n\n### Modules that leave the menu at practice level\nPractice Onboarding, Template Library, Role and Permissions (vertical HUB items), Reports, Vacancy Management, Application Tracking, System Feed.\n\n## Issues found\n- The \ud83d\udd0d search button has no behaviour.\n- Activity Tracker and ROTA Management point to the **same URL**, so the sidebar can't highlight Activity Tracker as active.\n- CQC Compliance is \"coming soon\" at practice level but built at vertical level.\n- \"Staff on-boarding\" goes to `/staff`, which probably holds the whole staff list, not just onboarding.\n- The practice URL uses a name slug, so renaming a practice would break bookmarks, and duplicate names (e.g. \"Abbey Medical Centre\" vs \"Abbey Medical Centre (4)\") need unique slugs.\n- The welcome banner says \"Welcome, Aqlios!\" (first word of the name), while the top bar says \"Welcome back Aqlios Admin \ud83d\udc4b\".\n"}, {"id": "practice/01-patients", "title": "EHR \u2192 Patients", "md": "# Practice \u00b7 EHR \u2192 Patients\n\nCaptured 2026-10-27 as super-admin. Nothing was saved, archived, deregistered or edited.\n- Croft Hall Medical Practice has **no patients** (empty state).\n- **Main Practice - Surgery** has 1 test patient (\"Aqlios Test\", dev data), used for the screenshots below.\n\n## Navigating between practices\n- **Switch Practice** (practice switcher menu) goes back to `/verticals/public/practices` (the grid). It doesn't open a picker.\n- The URL slug is generated from the name: \"Main Practice - Surgery\" \u2192 `main-practice---surgery` (**triple dash**). The API's `slug` field is `null` for this practice.\n- An **unknown slug or a practice ID** in the URL silently redirects to the practice grid, with no \"not found\" message.\n\n## Practice-level page anatomy (differs from vertical pages)\n- The top bar shows a **breadcrumb** instead of the page title: `Dashboard \u203a Patient Management` (and `\u203a Patient Details`). Earlier crumbs are grey, the current one is dark.\n- No grey page panel and no icon tile. The title sits directly on the page: **Patient Management** (24px / **400**, `rgba(0,0,0,0.87)`) and \"Manage Patients registration.\" (grey).\n\n## 1. Patient list \u2014 `/patient-management`\n- `\u23f7 Filters:` with two outlined selects:\n  - `Registration Type`: All, Emergency, Immediately Necessary, Private, Regular, Temporary, Dummy, Other, Contraceptive Services, Maternity Services, Child Health Services, Walk-In, Gynaecology, Rheumatology, Dermatology\n  - `Registration Date`: \"Select date\" date picker\n- `Search`: full-width field, \"Search by Name, NHS #, Phone No or email ID\", \ud83d\udd0d on the right.\n- Table (scrolls sideways; header row bg `#F5F5F5`, bold small headers, centred):\n  | Column | Content |\n  |---|---|\n  | # | row number |\n  | Patient Name | name, plus a second line \"NHS: 123 456 7890\" (grey, small) |\n  | Status | icon only: \u2705 green check-circle. Tooltip: **\"Patient Registered and Carer Correct\"** (dark tooltip) |\n  | Phone Number | `+447\u2026` |\n  | Email | |\n  | Registration Type | small grey chip, e.g. **Private** |\n  | Carer | carer name + blue \u24d8 icon. **Hover shows a rich tooltip \"Carer Information\"**: Name, NHS No, DOB, Age, Sex, Ethnicity, Email, Phone, Address, Relationship |\n  | Postcode | |\n  | Date of Birth | `DD/MM/YYYY` |\n  | Sex at Birth | |\n  | Actions | \ud83d\udc41 view \u00b7 \ud83d\uddc4 **Archive** (`aria-label \"Archive {name}\"`) |\n- Pagination: `Rows per page: 10` \u00b7 **`1 of 1 (1 Patients)`**, a fourth pagination format in the app.\n- Empty state (Croft Hall): a single centred row, **\"No registered patients yet.\"**\n- The patient name isn't clickable; the record opens only from \ud83d\udc41.\n\n## 2. Patient Details \u2014 `/patient-management/{patientId}`\nBreadcrumb: `Dashboard \u203a Patient Management \u203a Patient Details`.\n\n### Header\n- `\u2039 Back` (white pill with shadow) \u00b7 **Patient Details** \u00b7 chips **Private** (grey) and **Carer Verified** (purple text, light purple bg).\n- Action row:\n  - \ud83d\udc41 **Open in Clinical Systems** (greyed out, disabled)\n  - \ud83d\udc64\u2715 **Deregister Patient** (outlined **red** pill)\n  - \u270e **Edit Details** (cyan filled pill)\n\n### Cards (all collapsible, \u2303 on the right, white with shadow)\n1. **Manage Registration**\n   - `Registration Type` select (Private), `Registration Status` select, `NHS Number`.\n   - Registration Status options: **Patient Registered and Carer Correct** \u2713 \u00b7 Patient Registered but Carer Incorrect \u00b7 Not Known \u00b7 Patient Not Registered.\n   - \ud83d\udcbe **Save Status** (cyan pill, right).\n2. **Additional Notes**\n   - \u2295 **Add Note** (cyan pill) in the header.\n   - Notes are **pale-yellow cards** with the full text, a red \ud83d\uddd1 on the right, and a footer \"Added By: {name}\" (left) and \"7 October 2026 at 13:37\" (right). The dates use a **long format**, unlike `DD/MM/YYYY` elsewhere.\n3. **Patient Information**\n   - Badge **\"Not Sync with Clinical System\"** (sic).\n   - Read-only outlined fields (3 per row): First / Middle / Last Name \u00b7 Date of Birth \u00b7 Sex at Birth \u00b7 Ethnicity \u00b7 Phone Number \u00b7 Email Address \u00b7 Spoken Language \u00b7 Do you need an interpreter? \u00b7 Interpreter \u00b7 Do you need transport assistance?\n   - **Address** sub-group: Street Address \u00b7 Address Line 2 \u00b7 City \u00b7 Post Code.\n   - Empty values show `-`.\n4. **Carer Information** (badge \"Carer Verified\")\n   - Read-only fields: First / Middle / Last Name \u00b7 Date of Birth \u00b7 Sex at Birth \u00b7 Ethnicity \u00b7 NHS Number \u00b7 Address \u00b7 Relationship to Patient \u00b7 Phone Number \u00b7 Email Address.\n5. **Contact Patient**\n   - Tab strip (folder-style tabs; active white, inactive grey): \ud83d\udcde **Call** \u00b7 \ud83d\udcac **Message** \u00b7 \u2709 **Email**.\n   - Call tab: `Phone Number` (read-only) with a **Copy Phone Number** outlined pill inside the field \u00b7 `After Call Feedback` textarea (\"Record the outcome of the call.\", `0/1000 characters`) \u00b7 **Save Feedback** (cyan pill).\n6. **Medical Requests**\n   - Tabs: **Health Records** | **Consultations**.\n   - Health Records: a list of file rows (red document icon, filename truncated with \"\u2026\", \"Date Added: 15/09/2026\", \ud83d\udc41 view on the right).\n\n## Issues found\n- **Copy:** \"Not Sync with Clinical System\" should be \"Not synced with clinical system\".\n- **Copy:** \"Manage Patients registration.\" has odd capitalisation.\n- **Date formats are mixed** on one page: `DD/MM/YYYY` in fields, \"7 October 2026 at 13:37\" on notes.\n- **Pagination text** (\"1 of 1 (1 Patients)\") differs from the other tables, and \"1 Patients\" isn't singular.\n- The carer's NHS number shows as `1234567894` in the card but `123 456 7894` in the tooltip.\n- The patient's Street Address and City contain \"Na\" (test data stored as a value, not empty).\n- Title weight is 400 here, while vertical-level titles are bold.\n\n## Not opened (would change data or needs your OK)\n- Archive patient \u00b7 Deregister Patient \u00b7 Edit Details \u00b7 Save Status \u00b7 Add Note / delete note \u00b7 Save Feedback\n- Message and Email tabs in Contact Patient (opening a tab is safe; can be captured next)\n- Consultations tab and the \ud83d\udc41 file viewer\n"}, {"id": "practice/02-tickets", "title": "EHR \u2192 Tickets (consultations)", "md": "# Practice \u00b7 EHR \u2192 Tickets (consultations)\n\nCaptured 2026-10-27 in **Main Practice - Surgery** as super-admin. Nothing was assigned, approved, saved or closed.\nRoute: `/verticals/public/practices/{slug}/consultations-review`. Sidebar label \"Tickets\"; page breadcrumb `Dashboard \u203a Tickets`.\n\n> **Session note:** after signing in again, a direct link to a practice page redirects to the practice grid. The \"current practice\" is kept in client state and has to be re-selected from the grid. Deep links into practices don't survive a new login.\n\n## 1. Tickets list\n- White rounded page card. **Tickets** (bold, ~22px) / \"View and manage all tickets from department as a care navigator.\"\n- **Case switch** (pill toggle): \ud83d\udce5 **Open Cases** (cyan filled when active) | \ud83d\udce4 **Closed Cases**.\n- Right-side stacked filters:\n  - `Search` \"Search here...\" with \ud83d\udd0d\n  - `Status` select (Open Cases only)\n  - `Date Submitted` date picker (grey filled field, \ud83d\udcc5)\n\n### Status options (Open Cases)\nAll \u00b7 New \u00b7 More Info Required \u00b7 Appointment Pending \u00b7 Under Clinical Review \u00b7 Reopened \u00b7 Forwarded \u00b7 Follow Up Requested \u00b7 Appointment Booked \u00b7 DNA \u00b7 Appointment Cancelled\n\n### Open Cases table (147 rows; scrolls sideways with a visible scrollbar)\n| Column | Content |\n|---|---|\n| Severity | \ud83c\udff3 grey flag icon. Tooltip **\"Routine\"** (an urgent flag is probably red; token `tickets.flagUrgent #D32F2F`, routine `#BDBDBD`) |\n| Source | Voice Agent \u00b7 Web Triage |\n| Recommended Staff | `\u2014` none \u00b7 **name + \u24d8** (tooltip \"Recommended Staff\"; recommended but not approved) \u00b7 **green name + \u2705** (tooltip \"Assigned Staff\"; `#2E7D32`) |\n| Date & Time | `DD/MM/YYYY HH:mm` |\n| Complaint Type | e.g. \"Repeat Prescription Request\", \"Diabetes Concerns, Questions Or Problems Assessment\" (truncated with \u2026) |\n| Patient Name | name + \u29c9 copy icon |\n| Age & Gender | outlined chip `Male (32)` (grey `#BDBDBD` border) |\n| Status | **outlined pill** chips: **New** (blue outline and text) \u00b7 **Under Clinical Review** (orange outline and text) |\n| Actions | \ud83d\udc41 **View consultation** \u00b7 \u2713 **Approve recommended staff** (grey and disabled when nobody is recommended, green when available) \u00b7 \ud83d\udc64+ **Assign to Alternative Staff**. Assigned rows show only \ud83d\udc41 |\n\nPagination `1\u201310 of 147`.\n\n### Closed Cases table (6 rows)\n| Patient Name (\u29c9) | Source | Case Type | **Date Closed** (blue header, sortable) | Closed By | Reason for Closure | Actions |\nReasons in dev data: \"Completed.\", \"Close.\", \"tEST\", \"mnm\" (free text). Pagination `1\u20136 of 6`.\n\n## 2. Consultation Details \u2014 `/consultations-review/{consultationId}`\nBreadcrumb `Dashboard \u203a Tickets \u203a Consultation Details`.\n\n### Header\n- `\u2039 Back` pill \u00b7 **Consultation Details** \u00b7 outlined chip **\"Current Viewer: Aqlios Admin\"**. Opening a ticket **registers you as its viewer**, so other users see who has it open.\n- Clinical system bar:\n  - **Fetch from Clinical System** (outlined teal, with icon)\n  - **Send data to Clinical System** (disabled)\n  - **Open in Clinical System \u2197** (disabled text link)\n- Patient: **Aqlios Test** \u29c9\n- Row:\n  - `\u2039 Previous Consultations` link\n  - **View Logs** (outlined pill, history icon)\n  - **Update Status** (disabled)\n  - Status chip **Under Clinical Review** (orange outline)\n- **Info alert** (light blue): \"This consultation is unassigned and read-only. Assign a staff member to enable actions. Use the Assign Staff Member panel to assign it.\"\n\n### Cards (top to bottom)\n1. **Summary tabs** (pill tabs; active is cyan): **Consultation Summary** \u00b7 **SNOMED codes** \u00b7 **Requested Tests & Documents** \u00b7 **Medication**\n   - Summary: grey rounded rows with a label and value: Presenting Complaint (\"Repeat prescription: ibuprofen\"), Current Condition History, Timeframe, Symptoms (missing values in *italic \"Not provided\"*). Then **Red Flags** in a **light red box** with red text (\"No red flags identified\").\n   - SNOMED codes: **Add SNOMED code** with `Search codes` (\"Type at least 3 characters\"), `Comment (Optional)`, buttons **Add and Save to Clinical System** / **Add and Save to Aqlios**. Then a **Saved SNOMED codes** table (Saved SNOMED codes \u00b7 Comment \u00b7 Date & Time).\n   - Requested Tests & Documents: empty state *\"No requested tests or documents\"*.\n   - Medication: empty state *\"No medication prescribed\"*.\n   - Note: the **Voice Agent Recommendations** card shows only while the Summary tab is active.\n2. **Chat with Patient**\n   - Outlined chip \"Preferred Method: Aqlios App\". Header icons: \u21bb refresh, \u2922 expand.\n   - **Use Message Template** bar: \"Browse categorised templates and instantly apply them to the patient conversation.\" with a **Browse Templates** button (disabled while unassigned).\n   - Empty state \"No messages yet\".\n3. **Voice Agent Recommendations**\n   - \"How clinically urgent is this consultation?\" with radio cards **Urgent \u00b7 Routine (1 Week) \u00b7 Routine (2 Weeks)**. Helper: \"This urgency level is selected by voice agent \u2014 change it if you disagree.\"\n   - \"What actions are required to solve this consultation?\" \"No actions recommended.\" Helper: \"These actions are prescribed by voice agent change if you disagree.\"\n4. **Assign Staff Member**: `Select Staff *` select (\"Select here\") and **Assign Task** (disabled until a staff member is chosen).\n5. **Details**: label/value rows: Request date & time \u00b7 Status \u00b7 Request Name \u00b7 Submitted by.\n6. **Clinical Notes** (\u2922 expand)\n   - Use Note Template + Browse Templates\n   - textarea \"Clinical notes and observations...\" (`0/700`)\n   - \u2610 Share this note with the patient\n   - **Save Notes to Aqlios** (full-width, filled)\n   - **Save Notes to Clinical System** (full-width, outlined); both disabled\n7. **Voice Consultation Transcript** (\u2922 expand)\n   - Header \"26 October 2026 \u00b7 16:57 \u2013 16:57 \u00b7 42s\".\n   - Chat bubbles: **AI Assistant** on the left (robot icon, light grey bubble with a **cyan left border**); **patient** on the right (cyan filled bubble, name above). The area scrolls internally.\n\n### Consultation Logs drawer (View Logs)\n- **Right drawer with a cyan `#7ADDE2`-ish header**: \"Consultation Logs\" / \"Full activity log for Aqlios Test's consultation\", \u2715.\n- Timeline entries: green dot \u00b7 **actor** (bold) + event (\"Consultation Started\", \"Patient Symptoms Recorded\") \u00b7 \"User: Aqlios Voice Agent (Voice Agent)\" \u00b7 on the right a role chip (light cyan \"Voice Agent\") and a timestamp \"26 October 2026 at 16:57\".\n\n## Issues found\n- **Voice-agent urgency wording vs data:** the helper says the agent selected a level, but no radio is selected.\n- **Missing comma** in \"These actions are prescribed by voice agent change if you disagree.\"\n- **Two drawer styles:** Competency (white header, 480px) and Consultation Logs (cyan header, ~470px).\n- **Status chips differ by module:** outlined pills here, filled-tint chips in Roles and Templates.\n- **Closed Cases isn't sorted** by Date Closed, although its header looks active (blue).\n- **Mixed date formats:** `DD/MM/YYYY HH:mm` (list, details) vs \"26 October 2026 at 16:57\" (logs, transcript).\n- **Free-text closure reasons** allow junk (\"tEST\", \"mnm\"); there's no predefined reason list.\n- **Viewer tracking:** simply viewing a ticket registers \"Current Viewer\". Worth knowing when testing.\n\n## Not opened (change data or need your OK)\nApprove recommended staff \u00b7 Assign to Alternative Staff \u00b7 Assign Task \u00b7 Update Status \u00b7 Fetch from / Send to Clinical System \u00b7 Add SNOMED code \u00b7 Save Notes \u00b7 sending chat messages \u00b7 Browse Templates popup (disabled while unassigned) \u00b7 Previous Consultations \u00b7 a Closed case's detail.\n"}, {"id": "practice/03-appointment", "title": "EHR \u2192 Appointment", "md": "# Practice \u00b7 EHR \u2192 Appointment\n\nCaptured 2026-10-27 in **Main Practice - Surgery** as super-admin. Nothing was booked, joined, rescheduled, cancelled, approved or rejected.\nRoute: `/verticals/public/practices/{slug}/appointment`. Tabs and views **don't change the URL**.\nTop bar shows the page title \"\ud83d\udcc5 Appointment\" (no breadcrumb on this page, unlike Patients and Tickets).\n\n## Page structure\n- **Top tab switch** (pill container): \ud83d\udce5 **Appointment** | \ud83d\udce4 **Appointment Requests**. Active is cyan filled.\n- **Appointment** (24px / 400) / \"Manage and schedule patient appointments\" (on both tabs; the Requests tab reuses the same title).\n\n---\n\n## Tab 1 \u00b7 Appointment\n\n### View switch (top right)\n`\ud83d\udcc5 Calendar View` | `\u25a6 Table View`. Active is **dark teal `#2C7A7B` filled** with white text, unlike the cyan top tabs.\n\n### Calendar View (default)\n- Week navigator `\u2039 26 Oct - 1 Nov 2026 \u203a` (outlined pill) \u00b7 `Day` | **`Week`** toggle.\n- Filters (see below) plus a `Date` field showing \"This week\".\n- Week grid: `Time` column, day headers \"Mon / 26 Oct\". **Today is in a teal colour with a teal top border.** Rows every 30 minutes, 00:00\u201323:30.\n- Current-time line: solid dark-teal line with a \u25cf dot on the left, **only across today's column** (ROTA draws a dashed line across the whole week).\n- Empty week: \"No appointments for this period\".\n\n### Table View\n- **5 stat cards** (2-column grid; rounded, tinted bg, icon in a white circle, label, big number on the right):\n  | Card | Tint / colour | Value |\n  |---|---|---|\n  | Upcoming Appointments | orange | 00 |\n  | In Progress Appointments | blue | 00 |\n  | DNA | purple | 04 |\n  | Completed Appointments | green | 27 |\n  | Cancelled Appointments | red | 14 |\n- Filters: same set as Calendar, but `Date` shows \"Today\".\n- Table:\n  | Column | Content |\n  |---|---|\n  | Patient Name | **underlined link** |\n  | Request Name | centred, wraps |\n  | Appointment Time | `DD/MM/YYYY HH:mm` |\n  | Type | \"Online (Video)\", \"Face to Face\" |\n  | Status | tinted chip: **Completed** (green text `#166534` on light green) \u00b7 **DNA** (purple `#6D28D9` on light purple) |\n  | Duration | e.g. \"20 min\", **\"1259 min\"** \u26a0 |\n  | Actions | \ud83d\udc41 \"View appointment for {patient}\" |\n- Pagination `1\u201310 of 56`.\n\n### Filters (both views)\n| Filter | Options |\n|---|---|\n| Search | \"Search by name or email, p\u2026\" (placeholder cut off) with \ud83d\udd0d |\n| Appointment Type | All Types, Face To Face Surgery, Telephone Or Audio, Face To Face Home Visit, Written Including Online |\n| Severity | **disabled until a type is chosen** (\"Select type first\") |\n| Staff | All Staff + staff list (21 entries, **with duplicate names** such as \"Muhammad Ali\" \u00d72 and \"Furqan Daud\" \u00d72, plus test names) |\n| Status | All Status, Upcoming, In Progress, DNA, Completed, Cancelled by Patient, Cancelled by Staff |\n| Date | date picker |\n| \u2715 Clear filters | text button, greyed until a filter is set |\n\n### Appointment popup (\ud83d\udc41 View)\nCentred card (~450px, 18px radius); the page dims behind it.\n- Header: **request name in Title Case** (\"New Non-Blanching Rash\") and \u2715.\n- **Summary card** (light teal tint):\n  - Date tile: \"Oct\" (teal), **23**, \"Fri\".\n  - **Patient name** and assigned staff (\"Appointments Example Two - 1413\").\n  - \ud83c\udfa5 \"Online Appointment\".\n  - Status chip **Completed** (top right).\n  - Action buttons (disabled for a past appointment): \ud83c\udfa5 **Join Appointment** (filled grey) \u00b7 \ud83d\udcc5 **Reschedule** (outlined) \u00b7 \ud83d\uddd1 **Cancel Appointment** (outlined).\n- **View Request Details \u203a** (bordered cyan link card): \"See full request history, messages and clinician updates\".\n- **Appointment Information** (label/value rows): Date \"Friday, 23 October 2026\" \u00b7 Time **\"03:00 AM (1259 mins)\"** \u00b7 Request Type \u00b7 Appointment Type \"Video Appointment\" \u00b7 Meeting Link \"Link here\" (blue underlined).\n- **Patient Information** + **View Full Profile \u203a** (outlined pill): Patient Name \u00b7 Pronouns (\u2014) \u00b7 Phone \u00b7 Email.\n- Footer: **Cancel** (outlined pill; closes the popup).\n\n---\n\n## Tab 2 \u00b7 Appointment Requests\nRequests to book a staff member other than the one the system recommended.\n- **3 stat cards** in one row:\n  | Card | Colour | Value |\n  |---|---|---|\n  | Pending Approval Appointments | orange | 0 |\n  | Approved Today Appointments | green | 5 |\n  | Rejected Today Appointments | red | 1 |\n- Filters: `Requested By` (All Staff) \u00b7 `Status` (**All Status, Pending Approval, Approved, Rejected, Expired**) \u00b7 `Date Range` (\"All dates\") \u00b7 \u2715 Clear filters.\n- Table:\n  | Patient Name (link) | Original Recommendation | Requested Alternative | Reason | Requested By | Expires in | Status | Actions |\n  - \"Expires in\" shows `---` for resolved requests.\n  - Status: Approved / Rejected.\n  - Actions are empty for resolved rows; pending rows probably show Approve / Reject (none pending in dev).\n- Pagination `1\u20136 of 6`.\n- Permission link: \"Appointment: View Alternative Appointment Approval Requests \u203a Approve/Reject\u2026\".\n\n## Issues found\n- **Duration bug:** past appointments show durations like 1259 / 1200 / 1160 min (about 20 hours), apparently the time elapsed since the appointment, not its length. The popup repeats it (\"03:00 AM (1259 mins)\").\n- **Appointment type names differ:** the filter lists \"Face To Face Surgery / Telephone Or Audio\u2026\", the table shows \"Online (Video) / Face to Face\", and the popup shows \"Video Appointment\" / \"Online Appointment\". Filtering by type probably can't match the \"Online (Video)\" rows.\n- **12-hour time in the popup** (\"03:00 AM\"); the rest of the app uses 24-hour.\n- **Two different active-toggle colours** on one page: cyan (top tabs) vs dark teal (Calendar/Table).\n- **The Requests tab reuses the \"Appointment / Manage and schedule\u2026\" header.**\n- **Duplicate staff names** in the Staff filter.\n- **Search placeholder cut off** (\"Search by name or email, p\u2026\").\n- **Stat labels:** \"Approved Today Appointments\" reads oddly.\n- **Two current-time line styles:** solid with a dot (Appointment) vs dashed with an arrow (ROTA).\n\n## Not opened (change data or need your OK)\nJoin / Reschedule / Cancel Appointment \u00b7 View Request Details \u00b7 View Full Profile \u00b7 Day view \u00b7 clicking an empty calendar slot (may start booking) \u00b7 Approve / Reject on pending requests (none pending).\n"}, {"id": "practice/04-documents-and-placeholders", "title": "Documents and other placeholder modules", "md": "# Practice \u00b7 Documents and other placeholder modules\n\nCaptured 2026-10-27 in **Main Practice - Surgery** as super-admin.\n\n## Third placeholder style (\"practice placeholder\")\nFive practice modules have real routes (not under `/coming-soon/`) but render a placeholder:\n\n- The top bar shows the page icon and title (e.g. \"\ud83d\udcc4 Documents\").\n- **No page header, card or breadcrumb.** The message sits directly on the grey `#F5F5F5` page background, centred vertically.\n- Teal-light circle (~72px) with a **filled teal icon**, **title** (bold ~22px), 2\u20133 lines of grey copy, and a **COMING SOON** pill (teal text on teal-light).\n\n| Module | Route | Copy |\n|---|---|---|\n| Documents | `documents` | \"We are currently building the public practice document management center. Soon you will be able to store, manage, and share practice documents here.\" |\n| Recruitment | `recruitment` | \"We are currently building the recruitment module. Soon you will be able to manage job openings, candidates, and interviews here.\" |\n| Performance | `performance` | \"We are currently building the performance module. Soon you will be able to track objectives, key results, and team performance here.\" |\n| Support | `support` | \"We are currently building the public practice support center. Soon you will be able to access help resources and contact dedicated support here.\" |\n| Notifications | `notifications` | \"We are currently building the public practice notification system. Soon you will be able to configure alerts, reminders, and messaging preferences here.\" |\n\nSo the app has **three different placeholder designs**:\n1. `/coming-soon/*` (vertical): page header with \"Coming soon\" subtitle, then the body.\n2. Hub placeholder (System Feed and Notifications, vertical): header with a wrong \"Practice List\" subtitle and an inner grey box.\n3. Practice placeholder (this page): no header, centred on the background.\n\n## Practice `/coming-soon/*` pages (all 12 checked 2026-10-27)\nAll use the same template as the vertical `/coming-soon/*` pages (header with module name / \"Coming soon\", centred icon, \"We are currently building {Module}. It will be available here soon.\", COMING SOON pill).\n\n| Section | Module | Route |\n|---|---|---|\n| EHR | Call Recall | `coming-soon/call-recall` |\n| HRM | Staff off-boarding | `coming-soon/staff-off-boarding` |\n| HRM | Compliance | `coming-soon/compliance` |\n| COMMS | Patient Comms | `coming-soon/patient-comms` |\n| COMMS | Colleagues Comms | `coming-soon/colleagues-comms` |\n| COMMS | Notification Management | `coming-soon/notification-management` |\n| FINANCE | Payroll | `coming-soon/payroll` (a per-staff Payroll tab is built; see `05-staff-onboarding.md`) |\n| FINANCE | Workforce Validation | `coming-soon/workforce-validation` |\n| COMPLIANCE | CQC Compliance | `coming-soon/cqc-compliance` (built at vertical level) |\n| SUPPORT | Survey | `coming-soon/survey` |\n| SUPPORT | Feedback | `coming-soon/feedback` |\n| SUPPORT | Colleague Survey | `coming-soon/colleague-survey` |\n\nNote: HRM \u2192 Compliance is \"coming soon\", but each staff record already has a full **Compliance** tab with 38 documents.\n\n## Session behaviour noticed\nThe selected practice is lost occasionally (even without signing out), and any practice URL then redirects to the practice grid. You have to re-select the practice from the grid. The rebuild should keep the practice in the URL as the source of truth.\n"}, {"id": "practice/05-staff-onboarding", "title": "HRM \u2192 Staff on-boarding (Staff Management)", "md": "# Practice \u00b7 HRM \u2192 Staff on-boarding (Staff Management)\n\nCaptured 2026-10-27 in **Main Practice - Surgery** as super-admin. No one was invited, imported, archived, locked or edited; both popups were cancelled.\nRoute: `/verticals/public/practices/{slug}/staff` (sidebar label \"Staff on-boarding\"; top bar shows \"\ud83d\udc65 Staff\").\n\n## Page structure\n- Breadcrumb: `Staff Management` (underlined link) `/ Staff List` (changes per tab: \"Sent invitations\", \"Archived Staff\").\n- **Tab pills** (white container): \ud83d\udc65 **Staff List** \u00b7 \ud83d\udd58 **Sent Invitations** \u00b7 \ud83d\uddc4 **Archived Users**. The active tab is **dark teal filled** with white text. Tabs don't change the URL.\n- White page card: **Staff List** (bold 20px). On the right, **\u21e7 Bulk Import Staff** (outlined teal pill) and **\u2295 Invite Staff** (dark teal filled pill).\n\n## 1. Staff List tab\n### Stat cards (3 grey pills: icon circle, label, big number)\n| Label (shown truncated \u26a0) | Value | Colour |\n|---|---|---|\n| Total Staff | 55 | cyan/teal |\n| Active St\u2026 (Active Staff) | 20

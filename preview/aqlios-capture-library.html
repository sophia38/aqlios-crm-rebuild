<script id="docs" type="application/json">[{"id": "REBUILD-PLAN", "title": "Rebuild plan: Aqlios Public Primary Care", "md": "# Rebuild plan: Aqlios Public Primary Care\n\n**Status: approved 2026-10-27; hosting changed from Netlify to GitHub Pages at your request.** No app code exists yet. Once you approve, phases 0\u20132 start. Each module in phases 3\u20135 still gets its own short view plan for approval before it's built (CLAUDE.md rule 6).\n\n**Goal:** a working copy of the built Public Primary Care app (vertical and practice level, super-admin and practice-user roles). It should look and behave like the dev app, run on **mock data shaped exactly like the real API**, be **shareable at a dev URL**, and give you a clean base for new modules.\n\n**Inputs:** the 27 capture docs, `docs/design-tokens.md`, `COMPONENTS.md` and `CLAUDE.md`. These are the spec, and nothing is built from memory.\n\n## 1. Stack\nMatch the live app (CLAUDE.md \u2192 Stack):\n\n| Concern | Choice |\n|---|---|\n| Framework | Next.js (App Router) + React + TypeScript (strict) |\n| UI | MUI (`@mui/material`, `@mui/x-date-pickers`) with Emotion; styling with `sx` and theme overrides only |\n| Fonts | Poppins (default) + Inter via `next/font` |\n| Forms | Formik + Yup |\n| State | Redux Toolkit + redux-persist (session, user, current practice) |\n| Toasts | notistack, bottom-left |\n| Dates | dayjs; displayed as `DD/MM/YYYY` |\n| Quality | ESLint + Prettier + `tsc --noEmit` on every change |\n| Visual check | Playwright screenshots of each rebuilt screen at 1280px and 390px |\n\n## 2. Mock data that is shaped like the real API\nThe app makes **the same calls it will make in production**, to the same paths, and gets mock answers.\n\n```\nBrowser \u2500\u2500fetch('/api/crm/api/\u2026')\u2500\u2500\u25b6 Mock Service Worker (in the browser)\n                                         \u2502\n             NEXT_PUBLIC_API_MODE=mock \u2500\u2500\u2524\u2500\u2500\u25b6 src/mocks/handlers/<service>.ts  (in-browser store, seeded from fixtures)\n             NEXT_PUBLIC_API_MODE=live \u2500\u2500\u2518\u2500\u2500\u25b6 worker off; requests go to the real backend (later; needs CORS/auth from your team)\n```\nGitHub Pages only serves static files, so the app is built as a static export (`output: 'export'`) and the mocks run in the browser with **MSW (Mock Service Worker)**. There's no server code.\n\n- **Paths mirror the captured API exactly:** `practice-management/v1`, `users/v1`, `users/sub-apps/{id}/roles`, `public/v1`, `rota/v1`, `leave/v1`, `inbox/v1`, `activity/v1`. Sub-app id `3b668066-\u2026` (Public Primary Care), the `{status, data, errors}` envelope, `page`/`page_size` pagination, `ordering` and filter query params, and field names (including oddities such as `complaince_status`, kept until the backend changes them).\n- **Mocks run in each visitor's browser** (MSW), so the GitHub Pages URL works with no backend. Switching to the real backend later changes one environment variable, not the screens.\n- **Writes behave realistically.** Create, edit, delete, approve and archive change the store, which is kept in the browser's `localStorage` per visitor. A \"Reset demo data\" action restores the fixtures. Each reviewer has their own copy, and changes aren't shared between people. Validation errors (400), not-found (404) and permission errors (403) are returned in the real error format, so error toasts and states can be shown.\n- **Fixtures are fictional.** Practice names, staff, patients and policies are generated, and no data is copied from the dev app (the dev seed contains real-looking emails and phone numbers). Volumes match the dev app: 155 practices, 56 staff, 5 roles, 27 templates, 103 permissions, 8 leave types, etc.\n- **Mock auth:**\n  - `/api/auth/me` and `/api/auth/logout` are mocked in the worker. The login page accepts any email with the password `demo`.\n  - A **dev-only role switcher** in the user menu toggles **Super-admin** and **Practice user (Aliii Emis-style)**, so reviewers can see both roles' menus and permissions.\n  - The 31G auth service is not contacted.\n\n## 3. Shareable dev URL\n- **Code on GitHub, site on GitHub Pages.** A GitHub Actions workflow (`.github/workflows/deploy.yml`) builds the static export on every push to `main` and publishes it to `https://<your-account>.github.io/<repo>/`. Next.js `basePath` is set to the repo name.\n- Dynamic routes (`[vertical]`, `[practiceSlug]`, `[roleId]` \u2026) are pre-generated from the fixtures with `generateStaticParams`. A `404.html` fallback handles deep links.\n- The **first deploy happens at the end of phase 1**. Creating the repo and the first push need **your OK**; after that, pushes happen when you ask.\n- **Privacy:** GitHub Pages sites are public on free and Pro plans, even from a private repo. Private Pages needs GitHub Enterprise Cloud. All data is fictional, so a public URL is safe, but anyone with the link can see the UI.\n- **Project folder:** this session currently lives in a temporary folder that is deleted with the session. Before phase 0, the work moves to a folder you choose, and a Git repo is created there and pushed to GitHub.\n\n## 4. Folder structure\nFollows CLAUDE.md \u2192 Conventions:\n```\nsrc/\n  app/\n    auth/login/                                  login\n    verticals/                                   vertical picker\n    verticals/[vertical]/                        vertical shell (super-admin)\n      practices/                                 practice grid\n      hub-management/practices/\u2026                 Practice Management list, onboard, complete-profile\n      roles/ \u00b7 rota/ \u00b7 settings/ \u00b7 templates/ \u00b7 compliance-dashboard/ \u00b7 system-feed/ \u00b7 notifications/\n      coming-soon/[module]/\n      practices/[practiceSlug]/                  practice shell\n        dashboard/ \u00b7 profile/ \u00b7 patient-management/ \u00b7 consultations-review/ \u00b7 appointment/\n        staff/ \u00b7 rota/ \u00b7 leave-management/ \u00b7 leave-and-rota/ \u00b7 hr-policies/{ask,library}/\n        settings/{appointment-configuration,competency,pathway-configuration,practice-profile,templates}/\n        documents/ \u00b7 recruitment/ \u00b7 performance/ \u00b7 support/ \u00b7 notifications/ \u00b7 coming-soon/[module]/\n  components/{primitives,forms,data,navigation,modals,feedback,layout}/\n  features/<module>/components/                  module-only components (rota, tickets, templates\u2026)\n  lib/api/<service>.ts                           typed API client per backend service\n  mocks/{fixtures,handlers,store}/               MSW handlers (mock API + mock auth), browser store\npublic/mockServiceWorker.js                      MSW worker\n.github/workflows/deploy.yml                     build + publish to GitHub Pages\n  store/                                         Redux slices (session, practice context)\n  theme/{tokens,typography,theme}.ts\n```\n**The practice is identified by the URL** (`[practiceSlug]`), not only by client state. This fixes the live app's \"practice context lost \u2192 redirect to grid\" problem.\n\n## 5. Phases and order\nEach phase ends with a deploy and a short \"what to check\" note. A screen is done when it meets the definition of done in section 7.\n\n| Phase | What gets built | Shareable result |\n|---|---|---|\n| **0. Setup** | Folder + Git, Next.js/MUI/TS scaffold, `tokens.ts`/`typography.ts`/`theme.ts` from `design-tokens.md`, fonts, lint/typecheck, Playwright | Blank themed app, running locally |\n| **1. API and auth foundation** | MSW setup, mock store, fixtures for practices/users/roles, typed `lib/api` clients, mock auth, role switcher, GitHub repo + Pages workflow | **First GitHub Pages URL:** login \u2192 verticals |\n| **2. Shells and shared components** | `VerticalShell`, `AppSidebar` (vertical drawer), practice shell (persistent sidebar, top bar, practice switcher), `ModulePageHeader`, breadcrumbs, `DataTable`, `PillTabs`/`SegmentedTabs`, `FilterBar`, `FormModal`, `FormDrawer`, `ConfirmDialog`, `StatusChip`, `ComingSoonPlaceholder`, loading/error boundaries | Every menu item navigates; unbuilt items show placeholders |\n| **3. Reference screens** | Verticals; practice grid (`HubCard`, `ViewModeToggle`, list view); **Practice Management list**; **Onboard New Practice** (all sections, validation); practice profile / complete-profile | The three reference screens, pixel-checked |\n| **4. Vertical modules** | Roles & Permissions (list, create/edit with `PermissionTree`, associated users, Delete Role); vertical ROTA (week grid, rota groups); Settings (Global Practice/Appointment config, Competency, Pathway Configuration); Template Library (cards, editor, Ask AI placeholder, all confirms); CQC Compliance (from code capture, with a proper \"no access\" state); System Feed / Notifications / coming-soon | Whole super-admin hub |\n| **5. Practice modules** | Dashboard; Patients; Tickets (list + consultation detail); Appointment (calendar + table + detail + cancel/reschedule); Staff on-boarding (list, invitations, archived, invite, bulk import, staff detail tabs); ROTA (staff rota, shift bidding, activity tracker, templates, Edit Assignment drawer); Leaves; Leaves and ROTA (+ Apply For Leave); HR Policies; practice Settings; Profile (+ Security) | Full practice level for both roles |\n| **6. Hardening** | Accessibility pass (CLAUDE.md \u00a77), mobile widths, empty/loading/error states everywhere, issue list cross-check | Rebuild \"1.0\" |\n| **7. New modules** | Your new features and improvements, each with its own view plan, built only from the shared components | \u2014 |\n\nInside phases 4 and 5 I'll follow the order above unless you want a module first, for example the one your new features touch.\n\n## 6. Components\n**Reused as specified in COMPONENTS.md:** all primitives, composed components and layouts listed there.\n\n**New components to approve now** (not in COMPONENTS.md, needed by phase 2):\n\n| Component | Why nothing existing fits |\n|---|---|\n| `PracticeShell` | The practice level has a different frame from `VerticalShell`: persistent sidebar, flat top bar with page title, no Back to Verticals |\n| `PracticeSidebar` | Same visual language as `AppSidebar`, but persistent, collapsible with the `\u2039` edge button, role-aware items and a footer user card. Built as an `AppSidebar` variant if the code shares enough; otherwise as its own component |\n| `PracticeSwitcher` | Top-bar pill menu (current practice, Switch Practice, Logout); nothing similar exists |\n| `DevRoleSwitcher` | Dev-only menu to swap mock roles; it never ships to production |\n\n`ConfirmDialog` is already listed. It replaces the live app's five confirm designs (see `docs/practice/09-confirmation-popups.md`), with **focus starting on Cancel**.\n\n## 7. Definition of done for each screen\n1. **Layout and look:**\n   - Matches the capture doc: route, layout, copy, dropdown values, hover and focus states.\n   - Screenshots side by side with the live app at 1280px, plus a 390px mobile check.\n2. **Tokens only:** no hardcoded colours, sizes, radii or shadows.\n3. **States:** loading, empty, error, validation and success are all present and reachable with the mock data. The mocks can be told to fail so error states can be demoed.\n4. **API:** calls go through `lib/api` to the real path shapes, and the mock handler covers them.\n5. **Accessibility:** labelled icon buttons, keyboard and Esc work, visible focus.\n6. **Checks pass:** typecheck and lint.\n7. **Capture docs:** a note in the capture doc's \"Rebuilt\" line, plus `COMPONENTS.md` updated for any new component.\n\n## 8. Live-app bugs: default handling\nCLAUDE.md says don't copy known bugs. Proposed defaults (you can override any):\n\n| Live behaviour | Rebuild |\n|---|---|\n| A 401 from one endpoint logs the user out | Only an expired session logs out. A 403 shows a \"You don't have access\" state |\n| Practice lost from client state, deep links fail | Practice comes from the URL slug |\n| Five confirm designs, focus on the destructive button, Enter confirms | One `ConfirmDialog`, focus on Cancel |\n| Wrong values: \"16 Hrs\" for 7 days, \"1259 min\" durations, Edit Assignment opening on 5 Oct | Correct values |\n| Urgent dropdown labels mapped wrongly; \"Sync with Clinical System\" on Send Invite | Correct labels |\n| Mixed date formats (MM/DD vs DD/MM) | `DD/MM/YYYY` everywhere |\n| Practice user can edit or delete hub templates | **Kept as in the live app** until you decide on permissions. It's flagged in the UI with a dev note |\n| `page_size=1000` capped at 100 | Paginated or server-searched selects |\n| Secrets in the practice payload (`secret_key`, SMTP and Stripe keys) | Never present in mock responses |\n\n## 9. Risks and limits\n- **Some screens come from code only, not visual capture:** CQC Compliance, Archive Practice, Mark as Completed/DNA, Shift Bidding with data, Delete policy. Their spacing is a best match and should be confirmed when they can be seen live.\n- **Live mode later** needs your backend team to allow the new origin (CORS) and agree on how the 31G auth token is passed. Nothing in phases 0\u20136 depends on it.\n- **Mock data lives in each visitor's browser**, so it isn't shared between reviewers or kept anywhere central. It isn't a place to keep real work.\n- **Static hosting limits:** no server-side code on GitHub Pages. Anything that needs a server (real auth, file uploads to storage) works only in live mode against your backend.\n- **Other roles** (Practice Manager, Nurse, HR, Care navigator) haven't been captured. Their menus are inferred from permissions until captured.\n\n## 10. Decisions needed before phase 0\n1. **Approve this plan**, including the 4 new components in section 6 and the bug defaults in section 8.\n2. **Project folder** for the code (and whether to push to a GitHub repo).\n3. **Host:** GitHub Pages (decided). Still needed: your GitHub account or organisation, the repo name, and whether the repo is public or private (the Pages site is public either way).\n4. **Module priority:** keep the order in section 5, or start with the module your first new feature extends.\n"}, {"id": "CLAUDE", "title": "Aqlios CRM: project rules", "md": "# Aqlios CRM: project rules\n\nAqlios is a CRM for UK primary care, covering Public Primary Care, Private Business and Everyclinic verticals. About 60% is built. **There is no original source code.** This project is a rebuild from the live dev app at `https://crm.dev.aqlios.31g.co.uk`. Captures of each screen are in `docs/super-admin/`, tokens in `docs/design-tokens.md`, components in `COMPONENTS.md`.\n\n## Stack (match the live app)\n- **Framework:** Next.js App Router, React, TypeScript\n- **UI:** MUI (`@mui/material`, `@mui/x-date-pickers`). Styling uses the `sx` prop and theme overrides. There is no Tailwind and no CSS modules. Global CSS only loads fonts.\n- **Fonts:** Poppins (`--font-poppins`, default), Inter (`--font-inter`), via `next/font`\n- **Forms:** Formik + Yup\n- **State:** Redux (with persisted state) for session and user. Server data comes from fetch calls to `/api/crm/api/...`.\n- **Toasts:** notistack, anchored bottom-left\n- **Dates:** dayjs\n- **Icons:** MUI icons plus app SVGs in `/public` (`/practice/*.svg`, `/business_logos/*.svg`)\n- **Auth:** shared 31G auth service; the session is read from `/api/auth/me`\n\n## 1. Reuse before you build\n- Before creating any component, search the codebase **and** `COMPONENTS.md` for an existing one.\n- Prefer, in this order: reuse it as-is \u2192 extend it with a prop or variant \u2192 propose a new component.\n- **Propose new components and wait for approval** before building them. Say why nothing existing fits.\n- When an approved component is built, add it to `COMPONENTS.md` in the right group (primitive, composed or layout) with purpose, props, path and an example.\n\n## 2. Tokens only\n- Never hardcode colours, spacing, font sizes, radii or shadows.\n- Use `theme.palette.*`, `theme.spacing()`, typography variants (`<Typography variant=\"h6\">`), `theme.shape.borderRadius` and the token module `src/theme/tokens.ts`. All values are listed in `docs/design-tokens.md`.\n- Use the radius tokens defined there: inputs 12px, cards and paper 18px, pill buttons 999px.\n- If a value you need doesn't exist as a token, propose adding one. Don't inline it.\n- Keep feature-scoped token groups (`dutyType`, `calendar.status`, `medicalAlert` and so on) in `tokens.ts`. Don't scatter them in components.\n\n## 3. Reference screens\nNew views must match the layout, spacing and patterns of these screens:\n1. **Practice Management list:** `/verticals/public/hub-management/practices` (`docs/super-admin/02-practice-onboarding.md`). Reference for **list and table pages**.\n2. **Onboard New Practice form:** `/verticals/public/hub-management/practices/practice-management/onboard` (`docs/super-admin/03-onboard-new-practice.md`). Reference for **create and edit forms**.\n3. **Dashboard practice grid:** `/verticals/public/practices` (`docs/super-admin/01-verticals-and-practice-list.md`). Reference for **card-grid pages**.\n\nThe page anatomy is `VerticalShell` \u2192 breadcrumbs \u2192 grey rounded page panel \u2192 `ModulePageHeader` (icon tile, title and subtitle, primary action on the right) \u2192 content.\n\n## 4. Use the existing patterns\n| Need | Use |\n|---|---|\n| Page shell and navigation | `VerticalShell`, `AppSidebar`, `HubManagementLayout`, `ModulePageHeader` |\n| Loading | `LoadingSpinner` (inline or `fullScreen`); route-level `loading.tsx` |\n| Empty | A short sentence of secondary text inside the table or list area, in the form \"No {things} found. Try another search.\" |\n| Error (route) | `error.tsx` with \"Something went wrong\" and a Try again button |\n| Error (data load or action) | `enqueueSnackbar('Failed to load \u2026', { variant: 'error' })` |\n| Success | `enqueueSnackbar(msg, { variant: 'success' })` |\n| Forms | Formik + Yup. `FormSectionCard` per section with `hasError`. Outlined `TextField`s in a Grid (`xs:12`, `md:6` pairs). Red `*` on required labels. Messages as \"{Field} is required\" and \"Enter a valid email\". Validate on blur and on submit. **Save Changes** goes top right. |\n| Modals | `FormModal`, matching the **Create Rota Group** modal (`docs/super-admin/06-rota-management.md`): 600px, 16px radius, title with \u2715, Cancel and a submit button that stays disabled until the form is valid. For destructive confirms, follow `ArchiveConfirmModal` / Delete Role. |\n| Tables | `DataTable` with sortable headers driven by API `ordering`, the eye-icon View action, `TablePagination` (10 rows), and incomplete rows tinted with an orange left border and icon |\n| Grids | `HubCard` in 3 columns with 12 per page, plus `ViewModeToggle` |\n| Tabs | `PillTabs` |\n\n## 5. Conventions\n- **Routes:** `src/app/verticals/[vertical]/<module>/...`, with kebab-case segments that match the live URLs (`hub-management/practices`, `compliance-dashboard`, `system-feed`). Unbuilt modules route to `coming-soon/<module>`.\n- **Components:** PascalCase `.tsx`, one per file, in `src/components/{primitives,forms,data,navigation,modals,feedback,layout,practice,...}`. Put feature-specific components under `src/features/<module>/components/`.\n- **Theme:** `src/theme/{tokens,typography,theme}.ts`\n- **API:** `src/lib/api/<service>.ts`, mirroring backend paths (`practice-management/v1`, `users/v1`, `public/v1`). Query params use snake_case (`page_size`, `ordering`).\n- **Copy:** Title Case for buttons and headings (\"Onboard New Practice\", \"Save Changes\"). Sentence case for helper and error text.\n- **Dates:** display as `DD/MM/YYYY`.\n\n## 6. Plan before every new view\nBefore writing code for a new view, send a plan and **wait for approval**. The plan must include:\n1. The route and the layout (which reference screen it follows).\n2. The existing components it will use, from `COMPONENTS.md`.\n3. Any new components needed, with a justification for each.\n4. Its states: loading, empty, error, validation and success.\n5. The APIs it calls, or mock data if the API is unknown.\n\n## 7. Accessibility (match existing behaviour)\n- Icon-only buttons have an `aria-label`, e.g. \"Open menu\", \"Notifications\", \"View\", \"Open business\", \"Expand sidebar\" / \"Collapse sidebar\".\n- Navigation uses `<nav aria-label=\"Main navigation\">`, and the active link has `aria-current=\"page\"`.\n- Breadcrumbs sit in a `<nav>` with a list.\n- View toggles use `role=\"tablist\"` / `role=\"tab\"` (e.g. \"View as list or grid\").\n- Focus: inputs show a 1px `primary.main` border. Keep MUI's default focus-visible ring on buttons and never remove outlines.\n- Use only native or MUI interactive elements so keyboard support comes for free. Esc closes dialogs, drawers and dropdowns.\n- Pair every input with a visible label; don't rely on placeholder-only fields.\n\n## Don't\n- Write feature code without an approved plan.\n- Copy known bugs from the live app unless asked to. They are listed in the audit report, e.g. the \"PDG\" typo and the Forgot Password link pointing to the login page.\n"}, {"id": "COMPONENTS", "title": "Aqlios component inventory", "md": "# Aqlios component inventory\n\n**Source:** the live app's compiled bundles and DOM (`crm.dev.aqlios.31g.co.uk`), captured 2026-10-27. There is no original source code. Component names below are **ours**, because the originals are minified. Props are the real prop names recovered from the bundles. **Paths are the planned locations in the rebuild**, and nothing exists there yet.\n\nCoverage: only routes visited so far (Verticals, Dashboard grid, Practice Management list, Onboard form, Login). Template Library, Roles, ROTA, CQC, System Feed, Notifications and Settings are **not yet inventoried**, so expect additions.\n\nStatus: `observed` = seen rendered on a page \u00b7 `bundle-only` = found in the bundle, not yet seen on screen.\n\nAll components use MUI (`@mui/material`) with `sx` styling and the theme in `src/theme/`. See `docs/design-tokens.md`.\n\n---\n\n## Primitives\nThin wrappers or theme overrides around MUI. Prefer the MUI component with the theme over a new wrapper.\n\n| Component | Purpose | Key props / variants | Path | Status |\n|---|---|---|---|---|\n| `Button` (MUI, themed) | All buttons | `variant=\"contained\"` = teal pill (primary) \u00b7 `variant=\"outlined\"` = outlined pill (Browse File, Refresh, Add Another POC) \u00b7 `startIcon` | MUI + `src/theme/theme.ts` | observed |\n| `TextField` (MUI, themed) | Text inputs | always outlined, fullWidth, 12px radius, floating label, `required`, `error`, `helperText` | MUI + theme | observed |\n| `Switch` (themed) | On/off toggles (operating hours) | iOS style, teal track when on | `src/components/primitives/AppSwitch.tsx` | observed |\n| `AppIcon` | Renders an SVG icon by name or src | `icon`, `color`, `size` | `src/components/primitives/AppIcon.tsx` | bundle-only |\n| `BrandLogo` | Aqlios logo; also used for \"QuantumLoopAI\" | `src`, `size`, `width`, `height`, `color`, `sx` | `src/components/primitives/BrandLogo.tsx` | observed |\n| `EntityAvatar` | Practice logo or initials circle | `name`, `logoSrc`, `size`, `borderRadius`, `framed`, `sx` | `src/components/primitives/EntityAvatar.tsx` | observed |\n| `LoadingSpinner` | Spinner with optional message | `message` (default \"Loading...\"), `fullScreen`, `size`, `thickness`, `color` | `src/components/feedback/LoadingSpinner.tsx` | bundle-only |\n| `StepIndicator` | Numbered step dot | `index`, `isCompleted`, `isUpcoming`, `size` | `src/components/primitives/StepIndicator.tsx` | bundle-only |\n| `GoBackLink` | \"\u2039 Go Back\" text button | `onClick`, `children` | `src/components/primitives/GoBackLink.tsx` | observed |\n\n```tsx\n<Button variant=\"contained\" startIcon={<AddCircleOutline />}>Onboard New Practice<\/Button>\n<Button variant=\"outlined\" startIcon={<Refresh />}>Refresh<\/Button>\n<EntityAvatar name=\"Ashcroft Surgery\" logoSrc={practice.logo} size={44} />\n<LoadingSpinner message=\"Loading practices...\" />\n```\n\n## Composed components\n\n| Component | Purpose | Key props / variants | Path | Status |\n|---|---|---|---|---|\n| `FormSectionCard` | Collapsible white card for one form section, with a red border on error | `title`, `iconSrc`, `hasError`, `sx`, `children` (header can hold actions such as \"Add Another POC\") | `src/components/forms/FormSectionCard.tsx` | observed |\n| `CollapsibleAccordion` | Styled MUI Accordion used inside sections | `minHeight`, `py`, `size`, `sx` | `src/components/forms/CollapsibleAccordion.tsx` | observed |\n| `LogoUploadDropzone` | Dashed drag-and-drop logo upload with Browse File | `variant`, `uploadedLogo`, `setUploadedLogo`, `setFileError`, `onRemoveLogo`, `subAppId`. Error: \"Logo upload failed. Please try again.\" | `src/components/forms/LogoUploadDropzone.tsx` | observed |\n| `PracticeManagerSelect` | Autocomplete of managers (name and email), paged 10 at a time | `value`, `onChange`, `onBlur`, `label`, `placeholder`, `disabled`, `error`, `helperText`, `sx`. Empty: \"No managers found\" | `src/components/forms/PracticeManagerSelect.tsx` | observed |\n| `OdsPracticeSearch` | Type-ahead over NHS ODS practices that autofills the form | Formik field. Empty: \"No practices found. Try another search.\" | `src/components/forms/OdsPracticeSearch.tsx` | observed |\n| `PhoneField` | Phone input with country picker (UK only, searchable) | Formik field. Empty: \"No countries found\" | `src/components/forms/PhoneField.tsx` | observed |\n| `OperatingHoursRow` | One day: switch, Open/Closed and from/to HH:mm | `dayKey`, `label`, `hours`, `dayError`, `dayTouched`, `submitCount`, `hoursFrozen`, `toggleDay`, `dayTimeDrafts`, `handleDayTimeTextChange`, `handleDayTimeTextBlur`, `adjustDayTimeByHours`. Error: \"Start time cannot be after end time\" | `src/components/forms/OperatingHoursRow.tsx` | observed |\n| `DateField` | Formik-bound date input (YYYY-MM-DD) | `name`, `label`, `formFieldStyles`, `submitCount` | `src/components/forms/DateField.tsx` | bundle-only |\n| `ToggleOptionRow` | Enable/disable an option, set default, optionally locked | `label`, `enabled`, `onEnabledChange`, `isDefault`, `onSetDefault`, `locked` (\"Default\" / \"Set as Default\") | `src/components/forms/ToggleOptionRow.tsx` | bundle-only |\n| `RotaGroupSelect` | Select a rota group for a practice | `subAppId`, `currentPracticeId`, `staffPracticeId`, `value`, `onChange` (\"Loading...\", \"No rota groups available.\") | `src/components/forms/RotaGroupSelect.tsx` | bundle-only |\n| `PracticeListToolbar` | Title row, Onboard button and name search above the table | `search`, `onSearchChange`, `onOnboardNewPractice`, `title`, `subtitle`, `onboardButtonLabel`, `searchFieldLabel`, `searchFieldFullWidth`, `hideTitleRow`, `embeddedOnGreySurface`, `managerFilter` | `src/components/practice/PracticeListToolbar.tsx` | observed |\n| `PillTabs` | Pill-button tab row (active is teal filled, others outlined) | `activeTab`, `onChange`, `showArchivedTab` \u2192 \"Practice List\" / \"Archived Practice\" (business variant: \"Business List\") | `src/components/navigation/PillTabs.tsx` | observed |\n| `ViewModeToggle` | List/Grid icon toggle (`role=tablist`) | `value`, `onChange` | `src/components/navigation/ViewModeToggle.tsx` | observed |\n| `HubCard` | Grid card: avatar, divider, name and \u2197 button | `hub`, `label`, `onSelect`, `disabled` (aria \"Open business\") | `src/components/practice/HubCard.tsx` | observed |\n| `VerticalCard` | Lightbulb card on `/verticals` | `label`, `onClick`, `logoSrc`; disabled = faded | `src/components/practice/VerticalCard.tsx` | observed |\n| `DataTable` | MUI Table with sortable headers, row states and `TablePagination` | columns, rows, `ordering`, `onSortChange`, `page`, `rowsPerPage`, `totalCount`, `onPageChange`, `onRowsPerPageChange`, `getRowState` (e.g. incomplete) | `src/components/data/DataTable.tsx` | observed |\n| `ResultListWithPagination` | List with pagination and a \"Go to Dashboard\" action | `items`, `onGoToDashboard`, `actionLabel`, `page`, `rowsPerPage`, `totalCount`, `onPageChange`, `onRowsPerPageChange` | `src/components/data/ResultListWithPagination.tsx` | bundle-only |\n| `ArchiveConfirmModal` | Confirm archive with a reason | `open`, `practiceName`, `entityLabelSingular`, `onClose`, `onConfirm` (\"Reason Of Archiving\") | `src/components/modals/ArchiveConfirmModal.tsx` | bundle-only (not reachable on screen; see `docs/practice/09-confirmation-popups.md`) |\n| `ConfirmDialog` | The one confirm for delete, archive, claim and status changes (replaces the 5 live variants) | `open`, `title`, `message`, `warning?`, `alternative?`, `subtitle?`, `confirmButtonText`, `cancelButtonText`, `confirmButtonVariant` (`error`, `warning`, `success`, `primary`), `confirmButtonLoading`, `confirmButtonDisabled`, `onClose`, `onConfirm` | `src/components/modals/ConfirmDialog.tsx` | live (practice level, design A) |\n| `OnboardHubModal` | Choose how to onboard a hub (Public/Private) | `open`, `onClose`, `hubType` | `src/components/modals/OnboardHubModal.tsx` | bundle-only |\n| `UserMenu` | Header user pill (avatar, name, role, chevron) | user, role | `src/components/layout/UserMenu.tsx` | observed |\n| `TemplateCard` | Template card: type and status chips, \u22ee menu, name, subject, body preview with blue placeholders, created-by and date | `template`, `onAction`, `actions` | `src/features/templates/components/TemplateCard.tsx` | observed |\n| `RichTextEditor` | Message editor: formatting toolbar, Insert Placeholder menu, Ask AI, character counter | `value`, `onChange`, `placeholders`, `maxLength`, `onAskAi`, `readOnly` | `src/components/forms/RichTextEditor.tsx` | observed |\n| `MessagePreview` | Phone-style preview of a message with sample data | `practiceName`, `body`, `emptyText` | `src/features/templates/components/MessagePreview.tsx` | observed |\n| `ActionMenu` | \u22ee icon button opening a menu of icon and label items; destructive items in red, warning items in orange | `items: {label, icon, tone, onClick}[]` | `src/components/navigation/ActionMenu.tsx` | observed |\n| `FormDrawer` | Right-side drawer form: 480px, labels above fields, sticky Cancel and Save footer. Reference: Add Competency | `open`, `title`, `subtitle`, `onClose`, `onSubmit`, `submitLabel`, `children` | `src/components/modals/FormDrawer.tsx` | observed |\n| `SettingsShell` | Settings layout: left section nav (via `?section=`) and content card | `sections`, `active`, `children` | `src/components/layout/SettingsShell.tsx` | observed |\n| `GroupedDataTable` | Table with collapsible group header rows (\"N of M active\") and inline switch columns | `groups`, `columns`, `onToggle` | `src/components/data/GroupedDataTable.tsx` | observed |\n| `FormModal` | Standard dialog: 600px, 16px radius, title with \u2715, intro text, fields, Cancel and submit footer. Reference: Create Rota Group | `open`, `title`, `subtitle`, `onClose`, `onSubmit`, `submitLabel`, `submitIcon`, `submitDisabled`, `children` | `src/components/modals/FormModal.tsx` | observed |\n| `PermissionTree` | Accordion per module with \"N / M permissions selected\", indented child permissions, \u2705/\u274c in view mode, \"Select all N\" in edit mode, and search | `catalog`, `selected`, `onChange`, `mode` (`view` / `edit`), `search` | `src/features/roles/components/PermissionTree.tsx` | observed |\n| `StatusChip` | Small pill status (Active, Inactive, Pending Invite, \u2014) | `status`, `variant` (`soft` / `outlined`) | `src/components/data/StatusChip.tsx` | observed |\n| `StatsStrip` | Grey strip of KPI numbers with coloured left bars | `items: {label, value, color}[]` | `src/components/data/StatsStrip.tsx` | observed |\n| `ActivityCard` | Staff activity summary: name, date, status chip, label/value rows | `staff`, `date`, `status`, `rows` | `src/features/rota/components/ActivityCard.tsx` | observed |\n| `CapacityCard` | Practice or staff card in the ROTA side panel: hours and weekly capacity bar | `title`, `subtitle`, `hours`, `assigned`, `total`, `chip`, `selected` | `src/features/rota/components/CapacityCard.tsx` | observed |\n| `RotaLegend` | Session, duty and gap legend with colour squares | `groups` | `src/features/rota/components/RotaLegend.tsx` | observed |\n| `WeekCalendarGrid` | Day/week grid in 30-minute rows, today tint, now-line, \"Assign Staff\" slots | `days`, `range` (`day` / `week`), `events`, `onSlotClick` | `src/features/rota/components/WeekCalendarGrid.tsx` | observed |\n| `FilterBar` | Row of small outlined selects (13px), Clear filters, Refresh and search | `filters`, `values`, `onChange`, `onClear`, `onRefresh`, `search` | `src/components/data/FilterBar.tsx` | observed |\n| `SegmentedTabs` | Pill container with icon tabs; active is teal filled (ROTA top tabs, Practice/Staff view, Day/Week) | `items`, `value`, `onChange`, `size` | `src/components/navigation/SegmentedTabs.tsx` | observed |\n\n```tsx\n<FormSectionCard title=\"Address\" iconSrc=\"/practice/location_practice_icon.svg\" hasError={!!errors.address}>\n  <Grid container spacing={2}>\n    <Grid size={{ xs: 12, md: 6 }}><TextField name=\"address_line_1\" label=\"Address Line 1\" required /><\/Grid>\n  <\/Grid>\n<\/FormSectionCard>\n\n<DataTable\n  columns={practiceColumns}\n  rows={practices}\n  ordering=\"-created_at\"\n  page={page} rowsPerPage={10} totalCount={155}\n  getRowState={(r) => (r.isIncomplete ? 'incomplete' : undefined)}\n/>\n```\n\n## Layouts\n\n| Component | Purpose | Key props | Path | Status |\n|---|---|---|---|---|\n| `AppSidebar` | Navigation drawer: sections, items, footer, user card. Collapsible. | `variant` (public/private), `sections`, `footer`, `activeItemId`, `isSectionOpen`, `onToggleSection`, `collapsed`, `onToggleCollapsed`, `user`, `logoSrc`, `onNavigate`, `belowHeader` | `src/components/layout/AppSidebar.tsx` | observed |\n| `VerticalShell` | Page shell: floating header (\u2630, Back to Verticals, logo with vertical label, \ud83d\udd14, UserMenu), sidebar drawer, content | `children` | `src/components/layout/VerticalShell.tsx` | observed |\n| `HubManagementLayout` | Breadcrumbs plus grey rounded page panel | `hubManagementBreadcrumbs`, `children` | `src/components/layout/HubManagementLayout.tsx` | observed |\n| `ModulePageHeader` | Icon tile, title and subtitle, right-side actions | `icon`, `title`, `subtitle`, `actions` | `src/components/layout/ModulePageHeader.tsx` | observed |\n| `ComingSoonPlaceholder` | Placeholder for unbuilt modules: header plus a centred icon circle, title, message and \"COMING SOON\" pill | `title`, `icon`, `message` | `src/app/verticals/[vertical]/coming-soon/[module]/page.tsx` | observed |\n| `RouteErrorBoundary` | Next.js `error.tsx`: \"Something went wrong\" + Try again | `error`, `reset` | `src/app/**/error.tsx` | bundle-only |\n| `LoadingBoundary` | Suspense wrapper | `loading`, `children` | `src/app/**/loading.tsx` | bundle-only |\n\n```tsx\n// src/app/verticals/[vertical]/hub-management/practices/page.tsx\n<HubManagementLayout hubManagementBreadcrumbs={[{ label: 'Practice Management' }, { label: 'Practice List' }]}>\n  <ModulePageHeader icon={<FolderShared />} title=\"Practice Management\" subtitle=\"Practice List\"\n    actions={<Button variant=\"contained\">Onboard New Practice<\/Button>} />\n  <PillTabs activeTab=\"list\" onChange={setTab} />\n  <PracticeListToolbar search={q} onSearchChange={setQ} hideTitleRow />\n  <DataTable ... />\n<\/HubManagementLayout>\n```\n\n## Feedback patterns (no dedicated component yet)\n- **Toasts:** `notistack` `enqueueSnackbar(msg, { variant: 'success' | 'error' | 'warning' })`, bottom-left.\n- **Field errors:** Formik with Yup. Messages appear on blur and on submit, as MUI `helperText` in `error.main`.\n- **Section errors:** `FormSectionCard hasError`.\n- **Empty states:** a plain text line, for example \"No practices found. Try another search.\" No illustrated empty-state component found.\n- **Load errors:** \"Failed to load \u2026\" messages shown as error toasts.\n"}, {"id": "design-tokens", "title": "Aqlios design tokens", "md": "# Aqlios design tokens\n\nExtracted 2026-10-27 from the live app's compiled theme (`crm.dev.aqlios.31g.co.uk`, Next.js bundles, webpack modules `50400` tokens, `42548` typography, `45718` MUI theme, `99927` brand theme).\nIn the rebuild these live in `src/theme/tokens.ts`, `src/theme/typography.ts`, `src/theme/theme.ts`, and are exposed through the MUI theme. Values are verbatim.\n\n## Palette\n\n### Core\n| Token | Value | Use |\n|---|---|---|\n| `primary.main` / `light` | `#2C7A7B` | Primary buttons, active tabs, switches, focus border, links |\n| `primary.dark` | `#255A5C` | Primary hover |\n| `primary.contrastText` | `#FFFFFF` | |\n| `secondary.main` / `light` / `dark` | `#0EA5E9` / `#38BDF8` / `#0369A1` | Sky blue \u2014 checkbox checked in base theme |\n| `success.main` / `light` / `dark` | `#16A34A` / `#22C55E` / `#166534` | |\n| `error.main` / `light` / `dark` | `#DC2626` / `#F97373` / `#991B1B` | Field errors, error section borders |\n| `warning.main` / `light` / `dark` | `#F97316` / `#FDBA74` / `#C2410C` | |\n| `brand.main` / `light` / `dark` | `#5CE1E6` / `#8CEFF2` / `#3FCDD3` | Login button, brand theme (`99927`) |\n| `brand.contrastText` | `#255A5C` | |\n| `brand.soft` | `rgba(92,225,230,0.16)` | Brand hover fill |\n\n### Neutral scale\n`50 #F9FAFB` \u00b7 `75 #F5F5F5` \u00b7 `100 #F3F4F6` \u00b7 `150 #EAEAEA` \u00b7 `200 #E5E7EB` \u00b7 `300 #D1D5DB` \u00b7 `350 #BDBDBD` \u00b7 `400 #9CA3AF` \u00b7 `500 #6B7280` \u00b7 `600 #4B5563` \u00b7 `700 #374151` \u00b7 `800 #1F2933` \u00b7 `900 #111827`\n\n### Surfaces and text\n| Token | Value |\n|---|---|\n| `background.default/paper/elevated` | `#FFFFFF` |\n| `surface.tealLight` | `#E0F2F1` (hover on teal controls) |\n| `surface.canvas` | `#FCFCFC` |\n| `ds.canvas` | `#F5F5F5` (grey page panel) |\n| `ds.subtleFill` | `#FAFAFA` |\n| `textOnSurface.primary` | `rgba(0,0,0,0.78)` |\n| `textOnSurface.secondary` | `rgba(0,0,0,0.55)` |\n| `textOnSurface.disabled` | `rgba(0,0,0,0.38)` |\n| `modulePage.title` / `subtitle` | `rgba(0,0,0,0.78)` / `rgba(0,0,0,0.55)` |\n| `icon.dark` / sidebar wordmark | `#112744` |\n| `form.asterisk` | `#D32F2F` |\n\n### Borders\n`border.subtle rgba(0,0,0,0.06)` \u00b7 `border.bold rgba(0,0,0,0.2)` \u00b7 `border.dark rgba(148,163,184,0.2)` \u00b7 `border.light #F0F0F0` \u00b7 `border.medium #EEEEEE` \u00b7 `border.infoLight #DDEBFF` \u00b7 `muiSpec.divider rgba(0,0,0,0.12)` \u00b7 `muiSpec.fieldBorder rgba(0,0,0,0.23)`\n\n### Status (documents, payroll, verification)\n| Status | Text | Bg |\n|---|---|---|\n| rejected | `#EF4444` | `rgba(239,68,68,0.05)` |\n| pendingVerification | `#0284C7` | `rgba(2,132,199,0.05)` |\n| expired | `#78716C` | `rgba(120,113,108,0.05)` |\n| verified / success | `#16A34A` | `rgba(22,163,74,0.05)` |\n| moreInfoRequired | `#2C7A7B` | \u2014 |\n\n### Tones (chips and alerts, `ds.tone`)\n| Tone | main | strongBg | strongInk |\n|---|---|---|---|\n| success | `#2E7D32` | `#EDF7ED` | `#2E7D32` |\n| warning | `#EF6C00` | `#FFF4E5` | `#663C00` |\n| error | `#D32F2F` | \u2014 | \u2014 |\n| info | `#0288D1` | `#E8F1FB` | `#1976D2` |\n| secondary | `#9C27B0` | `#F1ECFA` | `#5E35B1` |\n\n### Sidebar\n| Token | Value |\n|---|---|\n| surface | `#FFFFFF` |\n| itemHoverBg | `#EFFCFC` |\n| item text | `#424242` (private) / `rgba(0,0,0,0.87)` (public) |\n| openSectionBg / openSectionHeaderBg | `#F5F5F5` / `#EEEEEE` |\n| shadow | `0px 1px 8px 0px rgba(0,0,0,0.15)` |\n| active item | bg `alpha(primary,0.12)` + `inset 0 0 0 1px primary` |\n| footer profileCardBg / avatarBg / avatarText | `#DEF9FA` / `#4AB4B8` / `#EFFCFC` |\n\n### Domain colour maps (keep as-is, used by ROTA and clinical modules)\n`dutyType`: ON_CALL `#FB3748`, CARE_HOME_WARD_ROUND `#7D52F4`, EXTENDED_ACCESS `#FBD249`, NURSING `#717784`, ADMIN_SESSION `#22D3BB`, NEIGHBOURHOOD_SHIFT `#FF936C`, REMOTE_WORK `#95C3FF`, PPT_PLT_CPD `#FFD5C0`, AM_SESSION `#03A9F4`, PM_SESSION `#1FC16B`.\n`calendar.status` (available, break, unavailable, dna, cancelled, reserved), `medicalAlert`, `patientManagement`, `patientDashboard`, `pathwayConfiguration`, `payrollStatus` and `tickets` also exist as feature-scoped groups. Copy them verbatim into `tokens.ts` when those modules are built.\n\n## Typography (`42548`)\nFont families: `--font-poppins` (default), `--font-inter` (secondary). Dancing Script is also loaded, probably for signatures.\n\n| Variant | Size | Weight | Line height | Letter spacing |\n|---|---|---|---|---|\n| h1 | 3.5rem | 600 | 1.1 | -0.04em |\n| h2 | 3rem | 600 | 1.15 | -0.04em |\n| h3 | 2.25rem | 600 | 1.2 | -0.03em |\n| h4 | 1.75rem | 600 | 1.25 | -0.02em |\n| h5 | 1.5rem | 600 | 1.3 | -0.01em |\n| h6 | 1.25rem | 600 | 1.35 | \u2014 |\n| subtitle1 | 1rem | 500 | 1.5 | -0.01em |\n| subtitle2 | 0.875rem | 500 | 1.5 | \u2014 |\n| body1 | 1rem | 400 | 1.6 | color `textOnSurface.primary` |\n| body2 | 0.875rem | 400 | 1.6 | color `textOnSurface.secondary` |\n| button | \u2014 | 500 | \u2014 | 0.04em, `textTransform: none` |\n| caption | 0.75rem | 400 | 1.4 | color secondary |\n| overline | 0.7rem | 500 | \u2014 | 0.16em, uppercase |\n\nObserved on pages: page title 24px / 700, section heading 20px / 700, input text 14px, helper/error text 12px.\n\n## Shape and radii\n| Use | Radius |\n|---|---|\n| `theme.shape.borderRadius` (Paper, Button default, pickers) | **18px** |\n| Outlined inputs | **12px** |\n| Pill buttons / chips / scrollbar thumb | **999px** |\n| Picker day, clock item, arrow buttons | 10px |\n| Login button | 16px |\n| Switch track | 13px |\n| Page panel | ~24px \u00b7 cards ~20px (observed) |\n\n## Shadows\n| Token | Value |\n|---|---|\n| `shadow.sm` | `0 10px 22px rgba(15,23,42,0.06)` |\n| `shadow.md` | `0 20px 45px rgba(15,23,42,0.08)` (popovers, pickers) |\n| `shadow.card` | `0 10px 30px rgba(15,23,42,0.08)` |\n| `shadow.cardLarge` | `0 16px 34px rgba(15,23,42,0.06)` |\n| `formModal.shadow` | `0 10px 40px rgba(15,23,42,0.25)` |\n| `ds.menuShadow` | `0 8px 24px rgba(15,23,41,0.10)` |\n| `ds.dragShadow` | `0 8px 18px rgba(15,23,41,0.14)` |\n| Buttons | `disableElevation: true` (flat) |\n\n## Spacing\nMUI default 8px unit (`theme.spacing`). Observed paddings: buttons `0.7rem 1.25rem`, inputs `14px`, helper text margin `3px 14px 0`.\n\n## Breakpoints\nMUI defaults (xs 0, sm 600, md 900, lg 1200, xl 1536). Grid usage is mostly `xs:12` \u2192 `md:6` / `md:4` / `md:3`; `breakpoints.up(\"sm\")` and `down(\"lg\")` are used sparingly.\n\n## Component overrides (`45718`)\n- `MuiButton`: radius 18, padding `0.7rem 1.25rem`, `disableElevation`. Pages also use 999px pills via `sx`.\n- `MuiTextField`: `variant=\"outlined\"`, `fullWidth`.\n- `MuiOutlinedInput`: radius 12. Border `border.subtle`, hover `border.dark`, focus `primary.main` 1px. Disabled bg `neutral.100` at opacity .7. Read-only bg `neutral.50`. Autofill is forced to a white background.\n- `MuiInputLabel` (outlined): colour secondary. When shrunk, a white background with 4px inline padding.\n- `MuiCheckbox`: unchecked `border.subtle`, checked `secondary.main`.\n- `MuiPaper`: radius 18, border `1px border.dark`.\n- `MuiInputBase`: `autoComplete=\"off\"`.\n- Date/time pickers: teal selected state, `surface.tealLight` hover, 10px items, Poppins.\n- Toasts: notistack, anchored **bottom-left**, enter 225ms and exit 195ms, variants success, error and warning.\n"}, {"id": "super-admin/00-login", "title": "Login \u2014 `/auth/login`", "md": "# Login \u2014 `/auth/login`\n\nCaptured 2026-10-27 (seen after the session expired and the app redirected here).\n\n## Layout\n- Light grey page with a large faint \"auth\" watermark shape (rounded shield outline with the word \"auth\") behind the card.\n- Centred white card, rounded, soft drop shadow, two columns:\n  - **Left**: Aqlios logo (served from the shared auth service: `media-auth31.31g.co.uk/apps/{appId}/logo/...svg`), **Portal Login** (34px / 600), subtitle \"Sign in with your credentials to access your dashboard.\" (16px, `rgba(0,0,0,0.6)`).\n  - **Right**: Email field, Password field with \ud83d\udc41 show/hide toggle, right-aligned **Forgot Password?** link, full-width **Log In** button.\n\n## Tokens\n| Element | Value |\n|---|---|\n| Log In button | bg **`#5CE1E6`** (light cyan \u2014 differs from the in-app teal `#2C7A7B`), dark text, 48px high, **16px radius** (not pill), 15px / 500, full width (370px) |\n| Forgot Password? | 14px, `#5CE1E6` |\n| Font | Poppins |\n\n## Behaviour / notes\n- Session expiry redirects any route to `/auth/login` (no \"session expired\" message shown).\n- **Forgot Password? link points to `/auth/login`** (same page) \u2014 appears unimplemented.\n- Login is a shared 31G auth service (\"auth31\"); the CRM gets the session via `/api/auth/me`.\n\n## To capture\n- [ ] Empty-submit and wrong-credential errors\n- [ ] Password show/hide toggle state\n- [ ] Redirect after login (to `/verticals`)\n"}, {"id": "super-admin/00-module-map", "title": "Module map (Public Primary Care)", "md": "# Super-admin \u00b7 Module map (Public Primary Care)\n\nCaptured 2026-10-27 from the hamburger side menu on `/verticals/public/practices`.\n\n## Side menu (drawer) design\n- Opens from the \u2630 button as a left drawer (~245px wide at 1063px viewport) over a dark semi-transparent backdrop (MUI-style `presentation` > `dialog`).\n- White background, full height, `navigation \"Main navigation\"`.\n- Top: Aqlios wordmark, then a horizontal divider.\n- \"Overview\" label (small, grey) above **Dashboard**.\n- **Active item** (Dashboard): light teal/mint pill background with teal border, full width with side margin.\n- **Section headers**: UPPERCASE, small, teal text, with a short teal vertical bar on the left and a \u2303 chevron on the right \u2014 each is a collapsible `button` (all expanded by default).\n- **Items**: outline icon + label (dark grey, ~14px), indented under the section.\n- Body scrolls; footer is pinned with a top divider:\n  - \ud83d\udd14 Notifications, \u2699 Settings\n  - User card: light teal rounded box, teal circle avatar `AA` (white initials), \"Aqlios Admin\" / \"super-admin\".\n\n## Modules\n\nStatus is taken from the link target: routes under `/coming-soon/` are placeholders (not built).\n\n| # | Section | Item | Icon | Route | Status |\n|---|---|---|---|---|---|\n| 1 | Overview | Dashboard | grid | `/verticals/public/practices` | Built (practice list) |\n| 2 | HUB | Practice Onboarding | person + | `/verticals/public/hub-management/practices` | Built |\n| 3 | HUB | Template Library | document | `/verticals/public/templates` | Built |\n| 4 | HUB | Role and Permissions | lock | `/verticals/public/roles` | Built |\n| 5 | HUB | Leaves Management | clock | `/verticals/public/coming-soon/leaves-management` | Coming soon |\n| 6 | HUB | ROTA Management | calendar | `/verticals/public/rota` | Built |\n| 7 | COMMS | Notification Management | chat bubble | `/verticals/public/coming-soon/notification-management` | Coming soon |\n| 8 | ANALYTICS & REPORTING | Reports | document | `/verticals/public/coming-soon/reports` | Coming soon |\n| 9 | COMPLIANCE | CQC Compliance | check badge | `/verticals/public/compliance-dashboard` | Built |\n| 10 | FINANCE | Payroll | briefcase | `/verticals/public/coming-soon/payroll` | Coming soon |\n| 11 | FINANCE | Workforce Validation | person \u2713 | `/verticals/public/coming-soon/workforce-validation` | Coming soon |\n| 12 | RECRUITMENT | Vacancy Management | ID card | `/verticals/public/coming-soon/vacancy-management` | Coming soon |\n| 13 | RECRUITMENT | Application Tracking | clock/target | `/verticals/public/coming-soon/application-tracking` | Coming soon |\n| 14 | SUPPORT | System Feed | headset | `/verticals/public/system-feed` | **Placeholder** (not under /coming-soon/) |\n| 15 | Footer | Notifications | bell | `/verticals/public/notifications` | **Placeholder** (not under /coming-soon/) |\n| 16 | Footer | Settings | gear | `/verticals/public/settings` | Built |\n\n**Corrected after visiting every page: Built 7 \u00b7 Placeholder 9.** CQC Compliance is built but logs super-admin out (see `08-cqc-compliance.md`). The \"60%\" estimate likely counts backend work as well, since the permission catalog covers modules whose UI isn't built.\n\n## Capture order (built modules)\n1. Dashboard / practice list \u2014 partly done (`01-verticals-and-practice-list.md`)\n2. Practice Onboarding\n3. Template Library\n4. Role and Permissions\n5. ROTA Management\n6. CQC Compliance\n7. System Feed\n8. Notifications\n9. Settings\n10. One \"coming soon\" page (shared placeholder layout)\n"}, {"id": "super-admin/01-verticals-and-practice-list", "title": "Verticals & Public Practice List", "md": "# Super-admin \u00b7 Verticals & Public Practice List\n\nCaptured 2026-10-27 from `crm.dev.aqlios.31g.co.uk` as **Aqlios Admin (super-admin)**.\nStack observed: Next.js (App Router, `_next/static/chunks/app/...`).\n\n---\n\n## 1. Verticals picker \u2014 `/verticals`\n\n### Layout\n- **Header** (no bar background, sits on page):\n  - Left: Aqlios logo (`/aqlios_logo.svg`).\n  - Right: user pill \u2014 circular avatar with initials `AA` (light lavender bg), name \"Aqlios Admin\", role \"super-admin\" + chevron (combobox, opens account menu \u2014 options not yet captured).\n- **Body**: centred greeting `Welcome back **Aqlios Admin** \ud83d\udc4b` (name bold).\n- **Three cards** in a row, rounded (~16px radius), thin light border, white bg with soft gradient, each with a lightbulb illustration and a two/three-line title:\n  | Card | State |\n  |---|---|\n  | Public Primary Care | Active \u2192 `/verticals/public/practices` |\n  | Private Business | Active (not yet captured) |\n  | Everyclinic Business | **Disabled** \u2014 title and icon faded/greyed |\n- **Footer**: top border, centred `Copyright \u00a9 2026 Aqlios. All rights reserved.`\n- Background: white fading to a very light blue/teal gradient toward the bottom.\n\n### APIs\n| Call | Purpose (inferred) |\n|---|---|\n| `GET /api/auth/me` (+ `?fresh=1`) | Session user + role |\n| `GET /api/crm/api/users/v1/profile` | Profile (name, avatar) |\n| `GET /api/auth/sub-apps` | Vertical cards list + enabled state |\n| `/business_logos/arrow_business_icon.svg`, `/business_logos/business_svg.svg` | Card icons |\n\n### To capture\n- [ ] User pill dropdown options\n- [ ] Card hover state\n- [ ] Disabled card tooltip/cursor (if any)\n- [ ] Private Business vertical\n\n---\n\n## 2. Public Practice list \u2014 `/verticals/public/practices`\n\n### Header (vertical shell)\nFloating rounded header bar (pill-shaped container, very light blue-tinted bg):\n- Left: hamburger button (`Open menu`, circular outline) \u2192 opens side menu (**not yet captured \u2014 this is the module list**).\n- `\u2039 Back to Verticals` pill button (outlined) \u2192 `/verticals`.\n- Centre: Aqlios logo | vertical divider | \"Public / Practice\" two-line label.\n- Right: bell icon button \u2192 `/verticals/public/notifications`; user pill (same as above).\n\n### Page card\nLarge rounded panel (light grey `#F5F5F5`-ish bg, ~24px radius):\n- Title row: square icon tile (grid icon, white bg, rounded) + **\"Public Practice\"** (bold, ~26px) / \"Practice List\" (grey, small).\n- Right: **Onboard New Practice** button \u2014 dark teal (`~#3F7F7A`), white text, pill shape, leading \u2295 icon.\n- View toggle (`tablist \"View as list or grid\"`): pill with two icon tabs \u2014 **List view** | **Grid view**; active tab = teal filled circle with white icon. Grid is default.\n\n### Grid view\n- 3 columns \u00d7 4 rows (page size 12).\n- Each item is a white rounded card (~20px radius, thin border) containing:\n  - Inner light-grey pill with: logo **or** initials avatar (circle, light teal bg, dark bold 2-letter initials) | thin vertical divider | practice name (centred, 2 lines, truncated with `\u2026`).\n  - Right: circular outline button with dark navy \u2197 arrow (`Open business`).\n- Names longer than 2 lines are ellipsised (e.g. \"Ashcroft Sur\u2026\", \"Hadrian Heal\u2026 Centre\").\n- Logo vs initials: practices with an uploaded logo show the image (e.g. Westcroft House \u2192 \"31G\" logo, Croft Hall/Linthorpe \u2192 Ripon Spa Surgery logo, St. Albans \u2192 screenshot-like logo); others show initials.\n\nSample data on page 1:\n| Initials | Practice |\n|---|---|\n| AS | Ashcroft Surgery |\n| WG | Westcotes Gp Surgery (Two) |\n| ET | Elm Tree Surgery |\n| HH | Hadrian Health Centre |\n| PM | Ponteland Medical Group |\n| logo | Westcroft House Surgery |\n| logo | Croft Hall Medical Practice |\n| logo | Linthorpe Surgery |\n| logo | St. Albans Medical Group |\n| FP | Fairfields Practice |\n| TS | Testvale Surgery |\n| KM | Kings Medical Centre |\n\n### Pagination (bottom, right-aligned, top divider)\n`Rows per page: [12 \u25be]` \u00b7 `1\u201312 of 155` \u00b7 `\u2039` (disabled on page 1) `\u203a`\n(MUI-style TablePagination.)\n\n### APIs\n`GET /api/crm/api/practice-management/v1/sub-apps/{subAppId}/practices?page=1&page_size=12`\n- Public Primary Care sub-app id: `3b668066-ab7e-4a11-ae82-01af30ff5cef`\n- Total: 155 practices.\n\n### To capture\n- [ ] **Hamburger side menu** (module list)\n- [ ] List view (table columns)\n- [ ] Rows-per-page dropdown values\n- [ ] Card hover + arrow hover states; truncated-name tooltip?\n- [ ] Onboard New Practice flow (form fields, validation, popups)\n- [ ] Practice detail (click \u2197)\n- [ ] Notifications page\n- [ ] Empty / loading / error states\n"}, {"id": "super-admin/02-practice-onboarding", "title": "Practice Onboarding (HUB)", "md": "# Super-admin \u00b7 Practice Onboarding (HUB)\n\nRoute: `/verticals/public/hub-management/practices` \u00b7 Captured 2026-10-27.\n\n## Layout\n- Same vertical shell header as the dashboard (\u2630, Back to Verticals, logo | Public Practice, \ud83d\udd14, user pill).\n- **Breadcrumb** (above the panel, left): `Practice Management / Practice List` \u2014 first crumb dark, second grey, `/` separator.\n- **Page panel** (light grey, rounded ~24px):\n  - Title row: white rounded icon tile (folder/ID icon) + **\"Practice Management\"** (bold ~26px) / \"Practice List\" (grey).\n  - Right: **Onboard New Practice** \u2014 dark teal pill button with \u2295 icon (same as dashboard).\n  - **Tab-style button row**:\n    - `Practice List` \u2014 active: teal filled pill, white text, list icon.\n    - `Refresh` \u2014 inactive: outlined pill (light teal border), teal text, \u21bb icon. Re-fetches the table.\n  - Section heading **\"Practices List\"** (bold ~18px).\n  - **Filter**: full-width outlined text field with floating label `Practice Name` (MUI outlined TextField, rounded ~10px). Filters the table by name.\n\n## Table\nWhite rounded container, header row on white, rows separated by thin dividers.\n\n| Column | Content | Sortable |\n|---|---|---|\n| Practice Name | Name (dark, ~14px) + second line: practice email, or `\u2014` if none | No |\n| Practice Manager | Manager name, or `\u2014` | No |\n| No. of Users | Integer | **Yes** (button header) |\n| Date Added | `DD/MM/YYYY` | **Yes** \u2014 default sort, descending (\u2193 arrow shown) |\n| Actions | \ud83d\udc41 eye icon button (`View`) | \u2014 |\n\n### Row states\n- **Incomplete profile** rows: pale peach/salmon background (`~#FDF1EC`), **orange left border** (~3px, `~#E8774A`), orange \u24d8/! circle icon before the name. Icon label: `Practice profile is incomplete` (likely a tooltip on hover \u2014 to confirm).\n- Normal rows: white background, no icon.\n- Incomplete seen on: Ashcroft Surgery, Westcotes Gp Surgery (Two), Elm Tree Surgery, Ponteland Medical Group, Fairfields Practice. Incomplete does not depend on having a manager (Ponteland has one).\n\n### Sample data (page 1, default sort)\n| Practice | Email | Manager | Users | Added | Incomplete |\n|---|---|---|---|---|---|\n| Ashcroft Surgery | \u2014 | \u2014 | 1 | 07/10/2026 | \u2713 |\n| Westcotes Gp Surgery (Two) | testexample1@nhs.net | \u2014 | 0 | 06/10/2026 | \u2713 |\n| Elm Tree Surgery | \u2014 | \u2014 | 0 | 05/10/2026 | \u2713 |\n| Hadrian Health Centre | testexample1@nhs.net | Manager Appointments | 0 | 04/10/2026 | |\n| Ponteland Medical Group | furqan.daud@aqliosssssss.com | Manager Appointments | 0 | 01/10/2026 | \u2713 |\n| Westcroft House Surgery | ali.emis@yopmail.com | Manager Appointments | 0 | 23/09/2026 | |\n| Croft Hall Medical Practice | sam@nhs.net | Manager Appointments | 1 | 18/09/2026 | |\n| Linthorpe Surgery | linthorpe@nhs.net | Manager Appointments | 0 | 18/09/2026 | |\n| St. Albans Medical Group | sfasfasf | \u2014 | \u2014 | 18/08/2026 | |\n| Fairfields Practice | test-practice-16@nhs.net | Manager Appointments | 0 | 17/08/2026 | \u2713 |\n\nEdge cases visible in data: missing email (`\u2014`), invalid email text (`sfasfasf`) is displayed as-is, missing manager (`\u2014`).\n\n### Pagination\n`Rows per page: [10 \u25be]` \u00b7 `1\u201310 of 155` \u00b7 \u2039 \u203a (note: default 10 here vs 12 on dashboard grid).\n\n## APIs\n- List: `GET /api/crm/api/practice-management/v1/sub-apps/{subAppId}/practices?ordering=-created_at&page=1&page_size=10`\n  - `ordering` drives the sortable columns (`-created_at` = Date Added desc).\n- Detail (seen when a practice was opened earlier): `GET .../practice-management/v1/sub-apps/{subAppId}/practices/{practiceId}?user_id={userId}`\n- Practice notifications: `GET /api/crm/api/public/v1/sub-apps/{subAppId}/practices/{practiceId}/notifications/?page=1&page_size=10`\n\n## To capture\n- [ ] Hover on incomplete \u24d8 icon (tooltip text)\n- [ ] Row hover state\n- [ ] Sort toggles: No. of Users asc/desc, Date Added asc\n- [ ] Practice Name filter: results + **no results** empty state\n- [ ] Rows-per-page dropdown values\n- [ ] **View (\ud83d\udc41)** \u2192 practice detail page\n- [ ] **Onboard New Practice** \u2192 form/stepper, all fields, dropdowns, validation errors, success/cancel popups\n- [ ] Refresh loading state\n"}, {"id": "super-admin/03-onboard-new-practice", "title": "Onboard New Practice (form)", "md": "# Super-admin \u00b7 Onboard New Practice (form)\n\nRoute: `/verticals/public/hub-management/practices/practice-management/onboard` \u00b7 Captured 2026-10-27.\nEntry: **Onboard New Practice** button (dashboard or Practice Management list).\n**Save Changes was not clicked** \u2014 submit result, server errors and success popup are still to capture.\n\n## Design tokens (measured from computed styles)\n| Token | Value |\n|---|---|\n| Font | **Poppins** (body 16px, weight 400); MUI also loads Roboto as fallback, a display font \"Bingo\" exists |\n| Body text | `rgba(0,0,0,0.78)` on `#FFFFFF` |\n| Primary (teal) | **`#2C7A7B`** \u2014 Save button, switch \"on\" track |\n| Required asterisk / error | `#D32F2F` (MUI error red), 12px |\n| Page title | 24px / 700 |\n| Section heading | 20px / 700 |\n| Primary button | pill (`border-radius: 999px`), 42px high, padding 8px 24px, 15px / 500, white text |\n| Outlined pill button (Browse File) | 1px `#1E1E1E` border, 999px radius, 14px / 500, padding 6px 20px |\n| Text input | MUI Outlined, **12px radius**, 52px high, input text 14px, border `rgba(0,0,0,0.23)` |\n| Disabled input | bg `#F5F5F5`, text `#9CA3AF` |\n| Switch track | 26px high, 13px radius; off `#E9E9EA`, on `#2C7A7B` (iOS-style switch) |\n| Dropdown popup | 18px radius, MUI elevation-1 shadow, list max-height 260px, option padding 6px 16px |\n| UI library | **MUI** (Material UI) |\n\n## Layout\n- Breadcrumb: `Practice Management / Add New Practice`.\n- Grey rounded page panel; inside, a centred column:\n  - `\u2039 Go Back` link (small, grey) \u2192 back to practice list.\n  - Header row: building icon + **Practice Information** / \"Enter your practice information manually to onboard your practice.\" \u00b7 right: **Save Changes** (teal pill, `type=submit`).\n- **Logo dropzone**: dashed-border rounded box; cloud-check icon; bold \"Choose a file or drag & drop your practice logo here\"; grey \"JPEG, PNG, PDG up to 10MB\" (sic \u2014 \"PDG\" typo in the live app); right: **Browse File** outlined pill.\n- Then four **collapsible section cards** (white, ~20px radius, thin border; header row with icon + bold title + \u2303 chevron; divider under the header; all expanded by default):\n\n### 1. Practice Details\n| Field | Type | Required | Placeholder / notes |\n|---|---|---|---|\n| Practice name or ODS code | Search autocomplete | \u2713 | \"Search by practice name or ODS code\" |\n| Practice Name | Text | \u2713 | \"Enter practice name (must be unique)\" \u2014 uniqueness checked via API |\n| Practice Manager | Autocomplete select | | \"Select practice manager\" |\n| Practice Type | Select, **disabled**, value `Public` | \u2713 | grey disabled style |\n| PCN Name | Text | \u2713 | \"PCN Name\" |\n| Phone number | Phone input w/ country flag | \u2713 | defaults to \ud83c\uddec\ud83c\udde7 `+44` |\n| Email Address | Text | | \"Email Address\" |\n| Website | Text | | \"test.co.uk\" |\n| Practice Description | Multiline textarea (grey bg) | | \"Brief description of your practice and services...\" \u00b7 counter `0/500 characters` |\n\nTwo-column rows: Practice Name | Practice Manager; Phone | Email. Others full width.\n\n### 2. Address\n| Field | Required | Placeholder |\n|---|---|---|\n| Address Line 1 | \u2713 | \"Enter Address Line 1\" |\n| Address Line 2 | | \"Enter Address Line 2 (optional)\" |\n| Postcode | \u2713 | \"Enter Postcode (e.g., SW1A 2HQ)\" |\n\n### 3. Point of contact\n- Header has an **\u2295 Add Another POC** outlined teal pill button beside the chevron.\n- Empty by default. Each click adds a **Person N** sub-card (light grey bg, rounded) with a person icon, title \"Person 1\", red \ud83d\uddd1 delete icon and its own \u2303 chevron.\n- Delete removes the person **immediately \u2014 no confirmation popup**.\n\n| POC field | Required | Notes |\n|---|---|---|\n| Name | \u2713 | |\n| Contact No | \u2713 | phone input, \ud83c\uddec\ud83c\udde7 +44 |\n| Email | \u2713 | |\n| Designation | \u2713 | |\n| Description | | textarea, `0/500 characters` (placeholder copy-pasted: \"Brief description of your practice and services...\") |\n\n### 4. Operating Hours\nOne row per day: day label \u00b7 switch \u00b7 \"Open\"/\"Closed\" \u00b7 `HH:mm` from-time \u00b7 teal \"to\" \u00b7 `HH:mm` to-time (time fields have up/down spinners; hidden when Closed).\n\nDefaults (blank form): Sun **Closed**, Mon\u2013Fri **Open 08:00 to 18:30**, Sat **Closed**.\n\n## Dropdowns\n- **Practice Manager**: two-line options (name, then grey email). Loaded 10 at a time from\n  `GET /api/crm/api/users/v1/sub-apps/{subAppId}/practice-managers/?page=1&page_size=10`.\n  First values: Access T Testing (saqib29@yopmail.com), alam khan, Ali Emis Manager, aziz khan, bakhti rehman, \u2026 (sorted A\u2192Z, case-insensitive).\n- **Phone country**: popup with a \ud83d\udd0d search box; only option **United Kingdom +44**.\n- **ODS search**: type-ahead; options show practice name (bold) + `ODS code | PCN code` in grey, e.g.\n  - The Leeds Road Practice \u2014 `B82012 | U91790`\n  - Leeds City Medical Practice \u2014 `B86012 | U16878`\n  - The North Leeds Medical Practice \u2014 `B86013 | U31228`\n  - Leeds Student Medical Practice \u2014 `B86110 | U96282`\n  - API: `GET /api/crm/api/practice-management/v1/public-practices?search=Leeds`\n\n## Behaviour\n- **Selecting an ODS result autofills**: Practice Name, PCN Name (PCN code, e.g. `U91790`), Phone (`+44 1423 566636`), Website, Address Line 1 (`49-51 Leeds Road`), Postcode (`HG28AY`) **and Operating Hours** (changed to 09:00\u201317:00 Mon\u2013Fri).\n- **Name availability** check fires after the name is set:\n  `GET .../practices/name-availability?practice_name=...&practice_type=PUBLIC` (and again with `&exclude_practice_id=...`).\n- **Section error state**: when a section contains an invalid field, the whole section card gets a **red border** (also shown when the section is collapsed).\n- Inline field errors (red outline + red helper text under the field), shown on blur:\n  | Field | Message |\n  |---|---|\n  | POC Name empty | `Name is required` |\n  | POC Email invalid (`abc`) | `Enter a valid email` |\n  | POC Designation empty | `Designation is required` |\n  | POC Contact No too short (`12`) | no error on blur \u2014 probably validated on submit |\n\n## Save Changes on an empty form\nCaptured 2026-10-27 on a freshly loaded (blank) form. **Validation is client-side only \u2014 no API request was sent.** No toast or popup; the page does not scroll to the first error.\n\n| Field | Error message |\n|---|---|\n| Practice name or ODS code | `Practice name or ODS code is required` |\n| Practice Name | `Practice name is required` |\n| PCN Name | `PCN name is required` |\n| Phone number (only `+44`) | `Phone number is required` |\n| Address Line 1 | `Address line 1 is required` |\n| Postcode | `Postcode is required` |\n\n- Error styling: field label and outline turn **`#DC2626`**; helper text 12px `#DC2626`, margin `3px 14px 0`.\n- Sections with errors (Practice Details, Address) get the **red card border**.\n- **Point of contact is optional** \u2014 no error when zero POCs are added. Operating Hours defaults pass.\n- Optional fields (Practice Manager, Email, Website, Description, Address Line 2) show no error.\n- Note: the error red here is `#DC2626`, while the required `*` is MUI's `#D32F2F` \u2014 two slightly different reds in the live app.\n\n## To capture\n- [x] Click **Save Changes** with empty form \u2192 all error messages\n- [ ] Successful submit \u2192 toast/popup + redirect\n- [ ] Duplicate name error (name-availability = taken)\n- [ ] Logo upload: preview, wrong type, > 10MB\n- [ ] Practice-level required errors (Practice name/ODS, PCN, Phone, Address Line 1, Postcode) and phone/postcode format rules\n- [ ] Time validation (to < from)\n- [ ] Description > 500 chars\n- [ ] Hover states: buttons, dropdown options, section chevrons\n"}, {"id": "super-admin/04-practice-profile", "title": "Practice View / Complete Practice Profile", "md": "# Super-admin \u00b7 Practice View / Complete Practice Profile\n\nCaptured 2026-10-27 using **Croft Hall Medical Practice**. Nothing was saved.\nEntry: \ud83d\udc41 **View** in the Practice Management table.\nRoute: `/verticals/public/hub-management/practices/practice-management/create/manual/complete-profile?practiceId={id}&subAppId={subAppId}`\n\n> \"View\" is not read-only. It opens the same editable form as onboarding, plus an **Additional Configuration** area. Every practice opens here, whether its profile is complete or not.\n\n## Table row hover (list page)\nHovering a row gives it a light grey background (`action.hoverLight` `rgba(0,0,0,0.04)`). Incomplete rows keep their peach tint.\n\n## Layout\n- Breadcrumb: `Practice Management / Practice Onboard Setup Method / Complete Practice Profile`. The middle crumb is dark, which suggests it's clickable; it points to a setup-method chooser page that hasn't been captured yet.\n- `\u2039 Go Back`. Header: building icon, **Practice Information**, \"Update practice information, upload your logo, and configure additional settings.\" On the right, **Save Changes**.\n- **Logo block** (dashed box, logo already uploaded): an 80px framed logo thumbnail, a green \u2713 **Saved** status, a **Change Logo** outlined pill and a \ud83d\uddd1 delete icon.\n- **Collapsed by default** (unlike the onboard form): Practice Details, Address, Point of contact (with \"Add Another POC\"), Operating Hours. Fields are the same as in `03-onboard-new-practice.md`. The ODS search field is **not shown** here; Practice Name is edited directly.\n- Divider with a centred grey pill label **\"Additional Configuration\"**.\n- **Expanded by default**: the configuration sections below.\n\n## Additional Configuration sections\n\n### Rota groups (Optional)\n- Helper: \"Select one or more rota groups to associate with.\"\n- Multi-select Autocomplete, label `Select Rota Group(s)`. Selected values are **teal-tint chips** with an \u24e7 remove icon. Value: `Croft Hall Rota Group`.\n- Data: rota groups for the sub-app. Empty: \"No rota groups available.\"\n\n### Linked Practices (Optional)\n- Helper: \"Select one or more practices from dropdown to link as a site.\"\n- Multi-select Autocomplete `Select Practice(s)`, with chips. Value: `Main Practice - Surgery`.\n- API: `POST .../public/v1/sub-apps/{subAppId}/practices/{id}/rota/same-rota-practices/` (a lookup that fires on load, not a save).\n\n### Practice Succession Date\n- `Start Date *` date picker (`DD/MM/YYYY`, \ud83d\udcc5 icon, half width). Value `01/09/2026`.\n- \u2611 **Ongoing** checkbox (checked, teal). Unchecking it probably shows an End Date field, which hasn't been captured yet.\n\n### Workforce Allocation Configuration (Optional)\n- Repeating sub-card **Workforce Allocation N** (grey header, \ud83d\uddd1 delete, chevron). Three fields in a row (`md:4` each):\n  | Field | Type | Options |\n  |---|---|---|\n  | Staff Type | Select | *Select staff type*, GP, ACP, FCP, Physiotherapist, ME, Nurse, NP, ANP, Pharmacist, Pharmacist technician, Prescription clerk, Reception, Administrative, MDT, Duty Team |\n  | Frequency | Select | *Select frequency*, Daily, Weekly, Monthly |\n  | Hours | Number | placeholder \"e.g. 8\", shown as `8.00` |\n- Link button below: \u2295 **Add hours for another staff type** (teal text button).\n- Value: GP \u00b7 Daily \u00b7 8.00.\n\n### Appointment Type Configuration (Mandatory)\n- \"(Mandatory)\" is in red; \"(Optional)\" elsewhere is grey.\n- **Warning alert** (peach bg `#FFF4E5`, \u26a0 orange icon, brown text): \"Only enabled appointment types will be available for booking. You must configure at least one appointment type as default.\"\n- One bordered row per type: checkbox (enabled), name, and on the right either a **Default** chip (filled cyan `#5CE1E6`, dark text) or a **Set as Default** outlined pill.\n  | Type | Enabled | Default |\n  |---|---|---|\n  | Face To Face Surgery | \u2713 | **Default** |\n  | Telephone Or Audio | | Set as Default |\n  | Face To Face Home Visit | | Set as Default |\n  | Written Including Online | | Set as Default |\n  | Admin Work | \u2713 (**locked**, faded checkbox) | none |\n- Component: `ToggleOptionRow` (`label`, `enabled`, `onEnabledChange`, `isDefault`, `onSetDefault`, `locked`).\n- API: `GET .../public/v1/sub-apps/{subAppId}/practices/{id}/clinical-system/appointment-configuration/`\n\n### Slot Duration Configuration\n- Repeating sub-card **Slot Duration N** (\ud83d\udd51 icon, chevron, no delete on the first one). Three fields:\n  | Field | Required | Options / rules |\n  |---|---|---|\n  | Role | \u2713 | *Select role*, Care navigator, Clinician, HR, Nurse, Practice Manager |\n  | Appointment Type | \u2713 | **Only the enabled appointment types** (here: Face To Face Surgery) |\n  | Duration (minutes) | \u2713 | number, placeholder \"e.g. 15\", helper \"In minutes\", digits only, max 5 digits, step 15, scroll wheel disabled |\n- Value: Clinician \u00b7 Face To Face Surgery \u00b7 30.\n- \u2295 **Add another slot duration configuration**.\n- Note: the Role label shows \"Role * *\" (double asterisk) in the accessibility tree.\n\n### Appointment Booking Configuration\nTwo selects side by side:\n| Field | Options (value \u2192 label) | Default |\n|---|---|---|\n| Urgent | `BOTH` \u2192 Both, `URGENT` \u2192 **Admin Staff**, `ROUTINE` \u2192 **AI Voice Agent** | Both |\n| Routine | `ADMIN_STAFF` \u2192 Admin Staff, `AI_VOICE_AGENT` \u2192 AI Voice Agent, `BOTH` \u2192 Both | Both |\n\n\u26a0 **Bug:** the Urgent list sends `URGENT`/`ROUTINE` values under the labels \"Admin Staff\"/\"AI Voice Agent\", while Routine uses `ADMIN_STAFF`/`AI_VOICE_AGENT`. The two lists also come in a different order.\n\n### Urgent Capacity Threshold\n- Inner bordered panel with a row per day, the same structure as Operating Hours. Sun Closed, Mon\u2013Fri Open 08:00 to 18:30, Sat Closed.\n- \u26a0 The switch here is a **different style**: a small MUI switch in cyan `#5CE1E6`, not the iOS-style teal switch in Operating Hours.\n- `Extra appointments` select (full width):\n  | Value | Label |\n  |---|---|\n  | SIGNPOST_TO_PHARMACY | Signposting to Pharmacy (selected) |\n  | REDIRECT_OOH_CLINIC | Redirecting to Out of Hours Clinic |\n  | REDIRECT_NHS_111 | Redirecting to NHS 111 |\n  | FORWARD_TO_AE | Forwarding patients to A&E |\n  | CREATE_SAME_DAY_APPOINTMENTS | Creating additional same-day appointments |\n- API: `GET .../practice-management/v1/sub-apps/{subAppId}/practice/{id}/sla-configuration` (note the singular `practice/` here, `practices/` elsewhere).\n\n## APIs on load\n- `GET .../practice-management/v1/sub-apps/{subAppId}/practices/{id}`: practice details\n- `GET .../public/v1/.../practices/{id}/clinical-system/appointment-configuration/`\n- `GET .../practice-management/v1/.../practice/{id}/sla-configuration`\n- `POST .../public/v1/.../practices/{id}/rota/same-rota-practices/` (\u00d72, lookup)\n\n## Behaviour notes\n- In this build, pressing Escape on a MUI Select doesn't always close the menu, and a click while it's still open selects an option. Watch for this when testing.\n- A closed Select's options are only rendered while it's open. Appointment Type options depend on which types are enabled above.\n\n## To capture\n- [ ] Save Changes result (success toast and validation) \u2014 would change real data, so it needs your OK\n- [ ] Unchecking Ongoing (End Date field?)\n- [ ] Set as Default / disable the default type (error when none is default)\n- [ ] Remove a chip, remove a workforce allocation, delete the logo (confirm popup?)\n- [ ] \"Practice Onboard Setup Method\" page (breadcrumb)\n- [ ] An incomplete practice's profile (which fields are flagged)\n- [x] Archive practice flow: read from code, not reachable on screen. See `docs/practice/09-confirmation-popups.md`\n"}, {"id": "super-admin/05-roles-and-permissions", "title": "Role and Permissions (HUB)", "md": "# Super-admin \u00b7 Role and Permissions (HUB)\n\nCaptured 2026-10-27. Nothing was created, edited or deleted.\nSidebar: HUB \u2192 Role and Permissions \u2192 `/verticals/public/roles`\n\n## 1. Roles List \u2014 `/verticals/public/roles`\n\n### Layout\n- Breadcrumb: `Roles & Permissions / Roles List` (first crumb is a link).\n- `ModulePageHeader`: white circle tile with a shield icon, **Roles & Permissions** / \"Roles List\". On the right, **\u2295 Add New Role** (teal pill).\n- An inner grey panel holds the filter bar and a white rounded table card. This is one more level of nesting than the Practice Management page.\n- Filter bar:\n  - `Search by role name`: a white filled input with no label (placeholder only)\n  - `\u2715 Clear filters`: teal text button\n  - `\u21bb Refresh`: outlined pill\n\n### Table\n| Column | Sortable | Notes |\n|---|---|---|\n| Role Name | | |\n| Assigned Users | | count |\n| Date Created | \u2713 (default \u2193) | **`MM/DD/YYYY`** |\n| Last Modified Date | | `MM/DD/YYYY` |\n| Actions | | \ud83d\udc41 **View** \u00b7 \ud83d\udc65 **View Users** \u00b7 \ud83d\uddd1 **Delete** (red); each icon has a tooltip with the same text |\n\nData (5 roles):\n| Role | Users | Created | Modified |\n|---|---|---|---|\n| HR | 1 | 09/18/2026 | 10/27/2026 |\n| Care navigator | 1 | 09/14/2026 | 10/27/2026 |\n| Nurse | 2 | 08/27/2026 | 10/27/2026 |\n| Practice Manager | 49 | 08/27/2026 | 10/27/2026 |\n| Clinician | 45 | 05/18/2026 | 08/27/2026 |\n\n- Row hover: light grey background.\n- Pagination: `Rows per page: 10 \u25be` \u00b7 **`Showing 1 to 5 of 5 roles`**. The wording differs from Practice Management's MUI default `1\u201310 of 155`.\n- API: `GET /api/crm/api/users/sub-apps/{subAppId}/roles?page=1&page_size=10` (note: no `/v1/` in this path).\n\n### Delete role (read from the app code; the popup wasn't opened)\n- Dialog title **Delete Role**: \"Are you sure you want to delete the role {name}?\"\n- While the role's users are checked, it shows \"Checking associated users...\".\n- If users are assigned: \"Warning: Please reassign these users to another role before deleting.\"\n- Success toast: \"Role deleted successfully\".\n- Error toasts: \"Validation failed. Please ensure all users have been reassigned.\" \u00b7 \"You do not have permission to delete this role.\" \u00b7 \"This role was not found. It may have been deleted.\" \u00b7 \"Server error. Please try again later.\" \u00b7 \"You are not authenticated. Please log in.\"\n\n## 2. Associated Users \u2014 `/verticals/public/roles/{roleId}/users`\nOpened with \ud83d\udc65 View Users.\n- Breadcrumb `Roles & Permissions / Associated Users List`; subtitle \"Associated Users List\"; `\u2039 Go Back` inside the panel.\n- Filters:\n  - `Search`: labelled field, placeholder \"Search by name or email...\"\n  - `Practice`: select, default **All**, options from `GET .../practices?page_size=1000`\n  - `\u2715 Clear filters`\n  - `\u21bb Refresh`\n- Table:\n  | Column | Content |\n  |---|---|\n  | Staff Name | name (bold) + email (grey) |\n  | Practice | comma-separated list, truncated with `\u2026` (e.g. \"Chainbridge Medical Partnership, gege 1, NHA\") |\n  | Role | role name |\n  | Status | pill chip (28px high, fully rounded) |\n  | Actions | \ud83d\udc41 view staff |\n- Status chips:\n  | Status | Bg | Text |\n  |---|---|---|\n  | \u2014 (none) | `#F3F4F6` | `rgba(0,0,0,0.55)` |\n  | Pending Invite | `#F3F4F6` | `rgba(0,0,0,0.55)` |\n  | Active | `rgba(22,163,74,0.15)` | `#16A34A` |\n- Pagination: `Showing 1 to 10 of 49 users`.\n- API: `GET /api/crm/api/users/sub-apps/{subAppId}/roles/{roleId}/users?page=1&page_size=10`\n- Errors: \"Failed to load associated users\", \"You do not have permission to view this role's users.\"\n\n## 3. Role Detail \u2014 `/verticals/public/roles/{roleId}`\nOpened with \ud83d\udc41 View (captured: Nurse).\n- Breadcrumb `Roles & Permissions / Role Detail`. Narrower centred column (about 540px of content).\n- Header: shield icon, **Role Detail** / role name (grey). On the right, **\u270e Edit**, a **cyan `#5CE1E6`** pill with white text. This is a different colour from the teal primary buttons elsewhere.\n- **Role Details** card (collapsible):\n  - `Role Name *`: read-only, grey filled\n  - `Role Description`: read-only multiline, counter **`40 / 100`**. The format differs from the practice form's \"0/500 characters\".\n- **Permissions** card. Header has a `Search` field (rounded pill, \ud83d\udd0d icon, placeholder \"Search permissions\").\n  - One grey accordion row per module: `\u203a` chevron, **Module name** (bold), `N / M permissions selected` and a `\u2304` icon. The count turns **green** when more than 0 are selected.\n  - Expanded: white rows with a checkbox and the permission description. Child permissions are **indented** under their parent. On the right, a \u2705 green check if granted or \u274c red cross if not.\n  - In view mode, checkboxes are pale blue and disabled.\n- APIs:\n  - `GET .../users/sub-apps/{subAppId}/roles/{roleId}`\n  - `GET .../users/sub-apps/{subAppId}/roles/{roleId}/permissions`\n  - `GET .../users/v1/permissions?sub_app_id={subAppId}` (catalog)\n\n### Edit mode (same URL)\n- Breadcrumb becomes `Roles & Permissions / Edit Role`. Title **Editing role details** (no subtitle).\n- Buttons: **Cancel** (white outlined pill) and **Save Changes** (`type=submit`, **disabled grey until something changes**).\n- Fields become editable and checkboxes become active (teal-blue).\n- Each expanded module ends with a **\"Select all N permissions\"** checkbox (indeterminate \u25ac when some are selected).\n- Cancel goes straight back to view mode, with **no \"discard changes?\" confirmation**.\n- Errors: \"Failed to update role\", \"Invalid data. Please check the role details and try again.\"

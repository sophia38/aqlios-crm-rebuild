 | green |\n| Pending I\u2026 (Pending Invitations) | 34 | orange |\n\n### Filters\n- `Search` \"Search by name or email\"\n- `Status`: All, Active, Inactive, Locked, Pending Invite, Invitation Expired, Resent Invite, Pending Profile, Pending Approval, Rejected\n- `Staff Type`: All, GP, ACP, FCP, Physiotherapist, ME, Nurse, NP, ANP, Pharmacist, Pharmacist technician, Prescription clerk, Reception, Administrative, MDT, Duty Team\n- `\u2715 Clear filters` (teal text) \u00b7 `\u21bb Refresh` (outlined pill)\n\n### Table\n| Column | Content |\n|---|---|\n| Staff Name | name, email, phone (3 lines; name missing for some invites, so email shows first) |\n| Staff Type | GP / ANP \u2026 |\n| Practice | practice name (wraps) |\n| Status | pill with tint: **Active** (green `#16A34A` on 15% green, \u2713 icon) \u00b7 **Resent invite** / **Invitation Expired** (red `#DC2626` on 15% red, \u21bb icon, **underlined**: looks clickable, probably resends the invite) |\n| Invited Date | `DD/MM/YYYY`, sortable \u2193 |\n| Actions | \ud83d\udc41 **View staff** \u00b7 \ud83d\uddc4 **Archive staff** \u00b7 \ud83d\udd12 **Lock user** |\n\nPagination `1\u201310 of 55`.\n\n## 2. Sent Invitations tab\n- Title \"Sent invitations\" + **Invite Staff** button. Filters: Search, Staff Type (no Status), Clear filters, Refresh.\n- Same table, showing invite rows only (Resent invite / Invitation Expired / \u2026).\n- API: `.../practices/{orgId}/staff?page=1&page_size=10&status=PENDING_INVITE`\n\n## 3. Archived Users tab\n- Title \"Archived Staff\". Filters: Search, Status, Staff Type.\n- Empty state: **\"No archived staff. Adjust your filters or search term.\"** Pagination `0\u20130 of 0`.\n- API: `...staff?status=INACTIVE`\n\n## 4. Send Invite popup (\u2295 Invite Staff)\n- Centred dialog (~460px, 18px radius). Title **Send Invite** + \u2715. Subtitle \"Invitation will be sent on the email to join the team.\"\n- Fields: First Name | Last Name \u00b7 Email \u00b7 `Role *` (Select role) \u00b7 `Staff Type *` (Select staff type).\n- Footer: **Cancel** (outlined) \u00b7 **\u27a4 Sync with Clinical System** (dark teal, primary submit) \u26a0 The label doesn't describe sending an invite.\n\n## 5. Bulk Import Staff popup\n- Dialog (~530px). Title **Bulk Import Staff** + \u2715. Intro: \"Import existing staff accounts in one go. After the import is complete, each staff member will receive an invitation to activate their account.\"\n- **Step 1: Get the template** card: file icon, **aqlios_staff_import_template.xlsx**, \"Includes column guidance, sample rows and the list of valid roles.\" and a **\u21e9 Download Template** (outlined pill).\n- **Step 2: Upload your completed file \\***: dashed drop zone with an upload icon, \"Drag and drop your Excel file here, or **Browse**\", \"Supported format: .xlsx\".\n- Info alert (blue): \"This import creates basic staff accounts only. Compliance documents (DBS, Right to Work, training) are added later by staff or HR.\"\n- Footer: **Cancel** \u00b7 **\u2713 Import Staff** (disabled until a file is chosen).\n- API on open: `GET .../practices/{practiceId}/staff/bulk-import/`\n\n## 6. Staff Member Details \u2014 `/staff/{staffId}`\n- `\u2039 Back` \u00b7 **Staff Member Details**.\n- **Tabs**: Account Details \u00b7 Leave Management \u00b7 Compliance \u00b7 Competencies \u00b7 Payroll.\n- Profile strip: avatar initials **MA**, **Muhammad Ali**, practice name, chip **No Rota Group**, and **Save Changes** (top right on every tab).\n\n### Account Details (collapsible cards)\n| Card | Fields |\n|---|---|\n| Personal Details | First Name* \u00b7 Last Name* \u00b7 Email* \u00b7 Phone number* \u00b7 Date of Birth* \u00b7 Spoken Language |\n| Professional Registration | National Performers List Number* (+ \"Verification Status: Not Verified\") \u00b7 Registration number* (+ Not Verified) \u00b7 PPA ID* \u00b7 Smartcard Status* (**Waiting for Smartcard / Already Have Smartcard**) \u00b7 Smartcard Number |\n| Background & Identity Verification | National Insurance Number \u00b7 DBS Certificate* (**Waiting for DBS / Already Have DBS**) \u00b7 DBS Certificate Number (+ status \"Awaiting DBS\", \"This staff member has not added a DBS certificate number yet.\") \u00b7 DBS Certificate Issue Date \u00b7 DBS Level* (**Standard / Enhanced**) \u00b7 DBS Update Service (**Yes / No**) |\n| Address | Address Line 1* \u00b7 Address Line 2 \u00b7 City* \u00b7 Postcode* |\n| Emergency Contact | **Add Emergency Contact**; \"Person 1 (Optional)\": Name \u00b7 Relationship \u00b7 Phone number |\n| Rota groups (Optional) | \"Select one or more rota groups to associate with.\" multi-select |\n| Contract Details | Start Date* (\"Cannot be earlier than 20 years from today\") \u00b7 End Date (\"Must be greater than Start Date and a future date\"; disabled while **On Going SLA** \u2611) \u00b7 Contract Type* (**Locum Staff / Salaried Staff**) \u00b7 grey sub-box \"Locum Staff\" with Duty Types* multi-select |\n| Availability | Info alert: \"Your work hours have been set by your practice administrator based on your role. Please note that break time is unpaid and does not count towards your paid working hours.\" \u00b7 chip \"\ud83d\udd58 Weekly Hours: 0 hrs\" \u00b7 Sunday\u2192Saturday rows with switch (Closed) |\n| Employment Record | Start Date \u00b7 End Date \u00b7 Leaving Reason (select, no options loaded) \u00b7 helper \"Used for HR Analytics headcount and turnover.\" |\n\n### Leave Management tab\n- **Annual Leave Entitlement**: Leave Type* \u00b7 Duration* \u00b7 Duration Type* (Weeks)\n- **Sick Leave Entitlement**: Duration* \u00b7 Duration Type* (Days)\n- **Other Leaves Entitlement** (\"No Fixed Entitlement\"): 4 repeating rows of Leave Type \u00b7 Duration \u00b7 Unit (Weeks)\n\n### Compliance tab\n- **Compliance Verification** counters: Pending Verification 00 \u00b7 Verified 00 \u00b7 Rejected 00 \u00b7 **Pending Upload 38** \u00b7 Expired 00 (colours = `payrollStatus` tokens).\n- Each document row shows: name (\\* = required) \u00b7 Uploaded Document \u00b7 Date Added \u00b7 Issue Date \u00b7 (Re-verification Due) \u00b7 Status chip (Pending Upload).\n- Document groups:\n  - **Identity & Personal Documents:** Proof of address 1\\*, Proof of address 2\\*, Proof of Identity\\* (with a \"Choose Document\" select)\n  - **CV & Employment History and References:** CV (10-year history with gap explanations), Reference 1 (Employment)\\*, Reference 2 (Clinical)\\*\n  - **Qualifications:** Medical Qualifications (degree certificates), Certificate of Training (CCT/CEGPR/Foundation), Registration Certificate\\* (re-verification), National Performers List Confirmation\\* (re-verification)\n  - **DBS and Compliance:** DBS Certificate\\*, DBS Update Service Confirmation\n  - **Indemnity & Insurance:** Indemnity Certificate (Expiry Date)\n  - **Occupational Health:** Immunisation Record (Hep B, MMR, Varicella, BCG, HIV, Hep C)\n  - **Mandatory Clinical Training Certificates** (each with Expiry Date): BLS / CPR & AED \u00b7 Safeguarding Children \u2013 Level 3 \u00b7 Safeguarding Adults \u2013 Level 3 \u00b7 Infection Prevention & Control \u00b7 Fire Safety Awareness \u00b7 Health & Safety / Risk Assessment \u00b7 Information Governance \u00b7 Equality, Diversity & Human Rights \u00b7 Manual Handling \u00b7 Conflict Resolution / De-escalation \u00b7 Mental Capacity Act & DOLS \u00b7 Prevent \u00b7 Lone Working / Personal Safety\n  - **Recommended Clinical Training Certificates:** Anaphylaxis & Emergency Drugs \u00b7 Vaccination & Immunisation Updates \u00b7 Phlebotomy & Venepuncture \u00b7 Chronic Disease Management \u00b7 Wound Care & Dressings \u00b7 Prescribing Governance / Medicines Management \u00b7 Chaperone Training \u00b7 Sepsis Recognition & Management \u00b7 Mental Health Awareness / Suicide Prevention \u00b7 Resilience & Stress Management \u00b7 Cervical Screening Programme\n\n### Competencies tab\n- **Consultation Details**: `Inbox` select (Clinician) \u00b7 `Staff Type` (GP) \u00b7 **Age Groups** \"Which age groups the staff members can see\" checkboxes: 0-12 \u00b7 13-16 \u00b7 Above 16 \u00b7 16-45 \u00b7 45+ \u26a0 overlapping ranges.\n- **Competency Mapping**: Search; warning text \"Please ensure to discuss your competency mapping with your clinical leadership. The copy of the competency map will be sent to clinician, practice manager and clinical leadership team.\"; \u2610 Select All.\n- One row per competency (from Settings \u2192 Competency): \"Respiratory (1 Subtype)\" \u00b7 slot \"12 min\" \u00b7 `Date Completed` date \u00b7 sub-type checkboxes (e.g. \"asthama\" \u26a0 typo in data).\n\n### Payroll tab (per staff; the Payroll module itself is \"coming soon\")\n- **Payroll Documents** \"(Supported formats: PDF, JPG, PNG, DOC, DOCX | Maximum file size: 10MB)\". Table: Document Type \u00b7 Uploaded Document \u00b7 Date Added \u00b7 Verified Date \u00b7 Added By \u00b7 Status \u00b7 Action. Rows: **P45**, **HMRC Starter Checklist**, **Tax Code Update**, each \"Pending Upload\" with an **Upload** action.\n- **Pension Enrolment** (radio-style options): No Pension \u00b7 NHS Pension \u00b7 GP Salaried Pension \u00b7 NEST Pension.\n- **Payroll Updates**: Deduction Amount\\* (\u00a3) \u00b7 Reason\\* \u00b7 End Date\\* (\"For how long these deductions should be made in future\") \u00b7 Additional Payment Amount\\* (\u00a3) \u00b7 Reason\\* \u00b7 End Date\\*.\n\n## Issues found\n- **Invite submit button says \"Sync with Clinical System\"** instead of \"Send Invite\".\n- The Email field in Send Invite has **no required marker**, yet an invite can't be sent without one.\n- **Stat card labels are cut off** (\"Active St\u2026\", \"Pending I\u2026\").\n- **Underlined status chips** look like links (likely resend), with no tooltip to say so.\n- **Age group ranges overlap** (13-16, Above 16, 16-45).\n- **Practice IDs differ** between calls: the staff list uses `c5832a86\u2026` (organisation ID) while bulk import uses `583f435c\u2026` (practice ID) for the same practice.\n- Active tab colour is dark teal here; most other practice-level tabs use cyan.\n- Archived Users loads `status=INACTIVE`, so \"archived\" and \"inactive\" appear to be the same state.\n- Test data in dev (\"claude-debug-invite-\u2026\", \"Qa Fullsuccess\").\n\n## Not opened (change data or need your OK)\nArchive / Lock user \u00b7 clicking a resend chip \u00b7 Save Changes on any tab \u00b7 Upload actions \u00b7 Download Template \u00b7 actually sending an invite or importing.\n"}, {"id": "practice/06-rota-management", "title": "HRM \u2192 ROTA Management (and Activity Tracker)", "md": "# Practice \u00b7 HRM \u2192 ROTA Management (and Activity Tracker)\n\nCaptured 2026-10-27 in **Main Practice - Surgery** as super-admin. Nothing was assigned, edited, published or bid on; the Edit Assignment drawer was cancelled.\nRoute: `/verticals/public/practices/{slug}/rota`. Tabs **are in the URL** here: `?module=shiftBidding`, `?module=activityTracker` (the vertical-level ROTA tabs are not).\nThe sidebar items \"ROTA Management\" and \"Activity Tracker\" both open this page; Activity Tracker opens its tab.\n\nThe layout reuses the vertical ROTA (`docs/super-admin/06-rota-management.md`). Only the differences and the new parts are listed here.\n\n## Tabs\nPill container with **Staff Rota** \u00b7 **Shift Bidding** \u00b7 **Activity Tracker**. The active tab is dark teal filled. (Vertical level has Rota Management \u00b7 Rota Groups \u00b7 Activity Tracker; at practice level **Rota Groups is replaced by Shift Bidding**.)\n\n## 1. Staff Rota\n- Header: **ROTA Management** / \"Practice View\" or \"Staff View\". Same `Practice View | Staff View` switch and the same Download Rota / Apply Rota Template / Create Rota Template buttons.\n- Filters: Staff \u00b7 Staff Type \u00b7 Duty Type \u00b7 Roles \u00b7 Rota Group \u00b7 Show \u00b7 Date. **There's no Practice filter** (the practice is already selected).\n- Same legend (session type, duty type, gaps).\n- **No left side panel** of practices; the grid takes the full width.\n\n### Shift block \u2b50 (first time seen with data)\nWhite card, **6px radius, 12px solid left bar in the session colour** (`#0EA5E9` = AM), no shadow, full height of the shift span. Content, top to bottom:\n1. **Staff name** (bold, truncated \"Appointm\u2026\") with hours **\"8h 0m\"** on the right\n2. Role chip **Clinician** (teal outline, mint fill)\n3. Contract chip **Salaried** (grey fill)\n4. Practice chip **Main Practice - Surgery** (rust outline, peach fill)\n5. \ud83d\udd58 **09:00 - 17:00**\n\n- Several staff on the same day sit **side by side** as columns within the day.\n- Each day has a thin column of **\uff0b buttons** (one per 30-minute slot, cyan \"+\"), the \"Assign Staff\" targets. No tooltip on hover.\n- No hover tooltip on shift cards.\n- Data this week: \"Appointments Example - 6500\" and \"Appointments Example Two - 1413\", Clinician, Salaried, 09:00\u201317:00, Mon\u2013Fri.\n\n### Edit Assignment drawer (click a shift) \u2b50\nRight drawer, **480px**, white header with \u2715, sticky footer.\n- Header: **Edit Assignment** \u00b7 date chip \"\ud83d\udcc5 Mon, 5 Oct\" \u26a0 (the clicked shift was Mon 26 Oct; it appears to show the series start date, in an unexpected format).\n- **ASSIGNED STAFF (1)** (uppercase label): mint card with name, role chip, \ud83d\uddd1 remove, \"09:00 - 17:00\", \u2303 collapse. **Weekly Capacity** bar: \"0h remaining\", \"40h assigned\", \"40h total\".\n- Grey sub-card **Main Practice - Surgery**:\n  - Scope radios: \u25c9 **Current Assignment** \u00b7 \u25cb Current and Following Assignment \u00b7 \u25cb All Assignments\n  - `Assignment Type *` segmented: **Once** | **Recurring** (both disabled when editing; Recurring is selected)\n  - `Start Date *` 26/10/2026 \u00b7 `End Date *` 05/11/2026 (disabled)\n  - **Repeat every week**: day circles M T W T F (teal filled = selected) and S S (outlined = off)\n  - `Number of hours to assign for this shift *` \u00b7 **Flexible Hrs.** switch \u00b7 `8` \u00b7 `09:00` \ud83d\udd58 to `17:00` \ud83d\udd58 \u00b7 **\uff0b** (Add shift slot)\n  - `Duty Type for this shift *` (Select duty type)\n  - `Appointment Type *` (multi: \"Written Including Online, Face To Face Surgery\") \u00b7 `Routine / Urgent *` (multi: \"Routine (1 week), Urgent\")\n  - `Enter break hours`: HH:mm to HH:mm\n- Footer buttons: **Save changes** (teal) \u00b7 **Cancel** (outlined).\n\n## 2. Shift Bidding (new at practice level)\n- Header **ROTA Management** / \"Shift Bidding\".\n- Empty state, centred grey text: **\"No shifts open for bidding right now.\"**\n- Permission link: ROTA \u203a \"Publish Slot, Accept or Reject Bidding\" and \"Bid for a ROTA Slot\". Published slots and bids show up here.\n\n## 3. Activity Tracker\nSame as the vertical tab (stats Active Now 00 / Inactive 02 / On Leave 00, staff activity cards), except:\n- Filters: Staff \u00b7 **Duty Type** (new) \u00b7 Status \u00b7 Date \u00b7 Search. **No Practice filter.**\n- The cards omit the \"Practice Name\" row.\n\n## Issues found\n- **Edit Assignment date chip** shows \"Mon, 5 Oct\" for a 26 Oct shift.\n- **Duty Type is empty** on an existing assignment, though it's required (`*`), so saving this record may fail validation.\n- **Mixed session colour:** a full-day 09:00\u201317:00 shift uses the AM colour.\n- The **\uff0b slot buttons** have no label or tooltip (the accessible name is just \"icon\").\n- Two sidebar items point to one page; at least they open different tabs here.\n- Activity Tracker still shows a \"Standard\" duty type and 12-hour times (same as vertical level).\n\n## Not opened (change data or need your OK)\n\uff0b Assign Staff \u00b7 Save changes \u00b7 remove staff \ud83d\uddd1 \u00b7 Create / Apply Rota Template \u00b7 Download Rota \u00b7 Day view \u00b7 Staff View with data.\n"}, {"id": "practice/07-leaves-and-leaves-rota", "title": "HRM \u2192 Leaves, and Leaves and ROTA", "md": "# Practice \u00b7 HRM \u2192 Leaves, and Leaves and ROTA\n\nCaptured 2026-10-27 in **Main Practice - Surgery** as super-admin. No leave was approved, rejected or requested.\n\n## 1. Leaves (Leave Management): manager view\nRoute `/leave-management`. Top bar \"\u2192 Leave Management\". Breadcrumb `Dashboard / Leave Management`. Title **Leave Management** (bold ~22px). Tabs don't change the URL.\n\n**Tabs** (pill container; active is dark teal filled): **Leave Requests** \u00b7 **Leaves History**\n\n### Leave Requests\n- Filter card: `\u2630 Filters:` with stacked selects on the left and search on the right:\n  - `Staff`: All Staff (searchable, \"Search staff...\")\n  - `Role`: All Roles, Care navigator, Clinician, HR, Nurse, Practice Manager\n  - `Leave Type`: All Types, Annual Leave, Sick Leave, Maternity Leave, Paternity Leave, Bereavement Leave, Emergency Leave, Compassionate Leave, TOIL Leave (Time Off in Lieu)\n  - Search \"Search by staff name and role\" (\ud83d\udd0d) \u00b7 `\u2715 Clear filters`\n- Table: **Staff Name** (bold) \u00b7 Role \u00b7 Leave Type \u00b7 Balance \u00b7 Start Date \u00b7 End Date \u00b7 Duration \u00b7 Notes \u00b7 Warnings \u00b7 **Action**\n- Actions are three **outlined pill buttons**, 100px radius, 50% tinted borders:\n  - **View** (teal `#2C7A7B`)\n  - **Approve** (green `#16A34A`)\n  - **Reject** (red `#DC2626`)\n- Rows per page options: **5, 10, 25**. Data: 2 pending requests (\"aqlios admin\", super-admin, Annual Leave, Balance N/A, 09/09\u219216/09 and 01/09\u219208/09, **16 Hrs** each, notes \"Testing notes\", warnings \"\u2014\").\n\n### Leave Request Details popup (View)\nCentred dialog (~450px, 18px radius). **Leave Request Details** + \u2715; subtitle \"aqlios admin \u2014 Annual Leave\". Label/value rows (label left, value right-aligned): Staff Name \u00b7 Role \u00b7 Leave Type \u00b7 Balance \u00b7 Start Date \u00b7 End Date \u00b7 Duration \u00b7 Notes. Read-only, with no buttons except \u2715.\n\n### Leaves History\n- Filters: Staff \u00b7 **Roles** \u00b7 **Status** (All Statuses, **Approved, Rejected**) \u00b7 search \u00b7 Clear filters.\n- Table: Staff Name \u00b7 Role \u00b7 Leave Type \u00b7 Start Date \u00b7 End Date \u00b7 Duration \u00b7 Status.\n- Empty: \"No leave history found.\" `0\u20130 of 0`.\n\n## 2. Leaves and ROTA: \"my leave\" (the signed-in user's own)\nRoute `/leave-and-rota`. Breadcrumb `Dashboard / Leaves and ROTA`. Title **Leaves and ROTA**.\n- Card **Leave History** / \"Manage your leave requests here.\"\n- **6 balance cards** (2 columns; grey rounded pill cards: icon in a white circle, label, big coloured value, \"Approval Required\"):\n  | Leave | Value | Colour / icon |\n  |---|---|---|\n  | Annual Leave | 0w | teal, beach umbrella |\n  | Sick Leave | 0h | red, medical cross |\n  | TOIL Leave (Time Off in Lieu) | 0h | teal, clock |\n  | Bereavement Leave | 0d | grey, heart |\n  | Compassionate Leave | 0d | orange, hand-heart |\n  | Maternity Leave | 0d | purple, baby |\n  Units vary by type: **w / h / d**.\n- Filters: `From` \ud83d\udcc5 \u00b7 `To` \ud83d\udcc5 \u00b7 `Leave Type` \u00b7 `Status` (All Statuses, Pending Approval, Approved, Rejected).\n- Table: Leave Type \u00b7 Start Date \u00b7 End Date \u00b7 Duration \u00b7 Reason \u00b7 Requested Date \u00b7 Last Updated \u00b7 **Status** (outlined orange pill \"Pending Approval\" `#F97316`) \u00b7 Action (\ud83d\udc41 View).\n- **No \"Request leave\" button** on this page, and **no ROTA content** despite the name.\n\n## Issues found\n- **Duration vs dates:** 7 days of annual leave (09/09\u201316/09) shows \"16 Hrs\", and the balance is \"N/A\".\n- **\"Leaves and ROTA\" shows no ROTA** and no way to request leave from the page.\n- **Units are mixed** on balance cards (weeks / hours / days) with no total.\n- **Filter labels differ** between tabs: \"Role\" (Requests) vs \"Roles\" (History).\n- **Rows-per-page options differ** from other tables (5/10/25 here).\n- **Status chips:** outlined here, tinted elsewhere.\n- The leave approver can see and approve **their own** requests (super-admin on both sides).\n"}, {"id": "practice/08-hr-policies-and-settings", "title": "HR Policies, and practice Settings", "md": "# Practice \u00b7 HR Policies, and practice Settings\n\nCaptured 2026-10-27 in **Main Practice - Surgery** as super-admin. Nothing was uploaded, asked or saved.\n\n## 1. HR Policies\nRoutes: `/hr-policies/ask` (default) and `/hr-policies/library`. **Tabs are real routes.**\nBreadcrumb `HRM / HR Policies / Ask HR` (or `/ Policy library`). Tab pills with icons: **Ask HR** \u00b7 **Policy library** (active is dark teal).\n\n### Ask HR (AI assistant)\n- Card **Ask HR** / \"Ask a question and get an answer from your practice's own policies, with sources.\"\n- Empty state (no policies): sparkle icon in a grey circle \u00b7 **Ask about your practice's HR policies** \u00b7 \"Your practice has no policies yet. Upload the staff handbook and HR policies so staff can ask questions here.\" \u00b7 **\u2601 Upload a policy** (dark teal pill).\n- **Suggested question chips** (outlined pills): \"How much annual leave do I get?\" \u00b7 \"What is the sickness reporting procedure?\" \u00b7 \"How do I raise a grievance?\" \u00b7 \"What is the expenses policy?\"\n- Composer: multiline \"Ask a question about your policies\" \u00b7 helper \"Enter to send, Shift+Enter for a new line\" \u00b7 counter `0/1000` \u00b7 **\u25b7 Send** (disabled while empty).\n- Permission link: HR Policies \u203a View Policies (ask) \u203a Manage Policies (upload).\n\n### Policy library\n- Header button **\u2601 Upload policy** (top right, dark teal).\n- Card **Policy library** / \"The staff handbook and HR policies the assistant answers from.\"\n- **Category filter chips** (single-select pills; active is mint with a teal border): All \u00b7 Staff handbook \u00b7 Leave \u00b7 Sickness \u00b7 Family leave \u00b7 Expenses \u00b7 Conduct & disciplinary \u00b7 Grievance \u00b7 Health & safety \u00b7 Equality \u00b7 Other.\n- Empty state: document icon \u00b7 **No policies yet** \u00b7 \"Upload your staff handbook and HR policies. Staff can then ask questions and get answers with the exact clause cited.\" \u00b7 **Upload policy**.\n\n### Upload policy popup\nCentred dialog (~450px, 18px radius). **Upload policy** + \u2715 (grey circle). \"Add a PDF or Word document. The assistant can answer from it once it is ready.\"\n- `Title *` \u00b7 `Category *` (select; same list as the chips) \u00b7 `Owner` (select, helper \"Keeps this policy up to date.\") \u00b7 `Effective date` (**native browser date input** \"dd/mm/yyyy\") \u00b7 `Description` (textarea)\n- Dashed drop zone: \u2601 \"Drop a file here or **browse**\", \"PDF or Word (.docx), max 10 MB\".\n- Footer: **Cancel** (outlined) \u00b7 **Upload** (dark teal, **enabled even when the form is empty**).\n\n## 2. Practice Settings\nRoute `/settings` \u2192 **defaults to Competency**. Sections are **path routes** (`/settings/{section}`), unlike vertical Settings, which uses `?section=`.\n- No page header, breadcrumb or \u2699 title (the vertical Settings has them). Top bar \"\u2699 Settings\".\n- Left nav card (white, floating shadow): Appointment Configuration \u00b7 Competency \u00b7 Pathway Configuration \u00b7 Practice Profile \u00b7 Templates. The active item is a bold pill with a light border.\n\n| Section | Route | What's there |\n|---|---|---|\n| Appointment Configuration | `settings/appointment-configuration` | Same form as vertical \"Global Appointment Configuration\" (`docs/super-admin/09-settings.md`), with practice values: open slots within **2 hours**; SMS **No reminder** (helper \"No SMS reminder is sent to patients.\"); Email **Before 2 Hours**; Same Day Booking **Allowed**; Urgent/Routine \"Admin Staff\"; Urgent Capacity Threshold days; Extra Appointment. Subtitle \"Manage Appointment settings here.\" Cancel / Save Changes. |\n| Competency | `settings/competency` | Same as vertical Competency (table + Add Competency drawer). Practice data has 6 types incl. \"test practice 2 comptenecy\", \"Respiratory\" (\"asthama\"), \"practice level\", with roles like \"EMIS Clinician\", \"Furqan Nurse\". |\n| Pathway Configuration | `settings/pathway-configuration` | Same as vertical, plus a **Source** column: **Same as Hub** / **Custom** (practice override of a hub pathway). Counts differ from hub (e.g. Administrative 3 of 5 active, Men's Health 1 of 1). |\n| Practice Profile | `settings/practice-profile` | **Placeholder**: \"We are currently building the public practice profile management system. Soon you will be able to view and manage your practice profile details here.\" COMING SOON |\n| Templates | `settings/templates` | Same Template Library UI as vertical (`docs/super-admin/10-template-library.md`). Shows **the same 27 templates** as the hub. |\n\n## Issues found\n- **Practice Settings opens on Competency**, the second nav item, not the first.\n- **Different routing schemes** for Settings: `?section=` (vertical) vs `/settings/{section}` (practice).\n- **Practice Profile** is a placeholder although each practice already has a profile form at vertical level.\n- **Templates at practice level show all hub templates**, with no visible practice scoping.\n- **Upload policy** uses a native date input and its Upload button is enabled with empty required fields.\n- **Data typos** in dev competencies (\"comptenecy\", \"asthama\").\n- **Copy:** \"Manage Appointment settings here.\" (capital A).\n"}, {"id": "practice/09-confirmation-popups", "title": "Confirmation popups (vertical and practice level)", "md": "# Confirmation popups (vertical and practice level)\n\nCaptured 2026-10-27 as super-admin. Each popup was opened and then closed with **Cancel / Go Back**. A page-level guard blocked every non-GET request during the session; it recorded **zero** blocked writes, and the network log shows only GET calls. Popups that couldn't be reached on screen were read from the app code and are marked **(code)**.\n\n## The five dialog designs in use\nThe app has no single confirm component. Five designs are in use:\n\n| # | Design | Used by | Width | Radius | Buttons |\n|---|---|---|---|---|---|\n| A | **Shared `ConfirmDialog`** (practice level): tinted icon tile + title + auto subtitle, \u2715 in a grey square, body, optional warning/alternative callouts, footer with right-aligned buttons | Archive patient, Delete Rota Template, Delete Assignment, Claim/Decline Shift, Delete policy | 520px | 24px | Outlined Cancel (white, r24) + filled confirm (r24) |\n| B | **Delete Role** dialog: red \u24d8 circle + title + question, pink warning box, per-user reassign card | Delete Role | ~580px | 36px | Full-width pair: outlined Cancel (r360, dark border) + Delete Role (grey while disabled) |\n| C | **Template action dialog**: title + text only, no \u2715, no icon | Delete Template, Mark as Inactive, Activate Template | 600px | 18px | Full-width pair, r18: outlined Cancel + red / cyan confirm |\n| D | **Settings dialog** (`G.ED` kit): title + \u2715, text, left/right buttons | Delete Competency | 640px | 14px, 40px padding | Outlined Cancel (r100) left, red \"\ud83d\uddd1 Delete Competency\" right |\n| E | **Feature one-offs**: their own layouts | Leave Approve/Reject (600/24), Cancel/Reschedule Appointment (600/24), Mark as Completed/DNA (code), Lock User (636/16), Cancel Leave (code), Archive Practice (code), Move to Standard (900/18) | \u2014 | \u2014 | \u2014 |\n\n### A. Shared `ConfirmDialog` (practice level)\nProps (code): `open, title, message, warning, alternative, subtitle, onClose, onConfirm, confirmButtonText=\"Confirm\", cancelButtonText=\"Cancel\", confirmButtonDisabled, confirmButtonVariant=\"error\" | \"warning\" | \"success\" | \"primary\", confirmButtonLoading, zIndex`.\n- **Header row:** 36px tinted square icon tile (error/warning: `error-warning-line`; success: `checkbox-circle-line`; primary: `question-line`), **title** (bold ~18px) and, under it, a small grey subtitle. If the variant is `error` and the confirm text starts with \"Delete\" or \"Remove\", the subtitle is filled in automatically: **\"This can't be undone.\"** The \u2715 is a 32px grey square (`#F0F1F3`, 16px radius, navy icon), `aria-label=\"Close\"`.\n- **Body:** message text. Optional **warning** callout (tinted box with \u26a0 icon, warning or error tone) and **alternative** callout (archive icon, primary tone).\n- **Footer:** divider above, buttons right-aligned. Cancel is outlined white with a dark border (radius 24px). Confirm is filled in the variant colour (error `#D32F2F`, warning `#F97316`, success, primary), radius 24px, with an icon.\n- **Behaviour:** the **confirm button gets focus 50ms after opening**, and **Enter anywhere confirms** (except in inputs, on Cancel or on \u2715). While `confirmButtonLoading`, backdrop and \u2715 can't close it.\n- `aria-labelledby` (title) and `aria-describedby` (message) are set.\n\n## Vertical level (super-admin)\n\n### Delete Role: `/verticals/public/roles`, trash icon on a row\nDesign B. Captured for **HR** (1 user assigned).\n- Red outlined \u24d8 in a pink circle \u00b7 **Delete Role** \u00b7 \"Are you sure you want to delete the role **\"HR\"**?\"\n- Pink warning box (`#FEF2F2`-ish, red text): \u24d8 \"Warning: **1 user(s)** are assigned to this role.\" / \"Please reassign these users to another role before deleting.\"\n- One grey card per assigned user: **name** (bold) \u00b7 email \u00b7 **`Reassign User To Role *`** autocomplete. Options are the other roles: Care navigator, Clinician, Nurse, Practice Manager (the role being deleted is excluded).\n- Footer: **Cancel** (outlined, dark `#1F2933` border, pill) \u00b7 **Delete Role** (`#D1D5DB` grey with white text while disabled; it stays disabled until every user is reassigned).\n- \u2715 top right (40px round icon button, `aria-label=\"Close\"`). **Esc closes the whole dialog**, even from inside the open autocomplete.\n- Copy from code: loading \"Checking associated users...\", success toast \"Role deleted successfully\", errors listed in `docs/super-admin/05-roles-and-permissions.md`.\n\n### Template Library: `/verticals/public/templates`, \u22ee menu on a card\nMenu items depend on scope and status:\n- Standard, Active: View Details \u00b7 Edit Template \u00b7 **Mark as Inactive** \u00b7 **Delete Template**\n- Standard, Inactive: View Details \u00b7 Edit Template \u00b7 **Activate Template** \u00b7 Delete Template\n- Staff-created: View Details \u00b7 **Move to Standard** \u00b7 Delete Template\n\nDesign C, 600px, 18px radius, no \u2715, no icon:\n\n| Popup | Title | Body | Extra | Buttons |\n|---|---|---|---|---|\n| Delete | **Delete Template** | \"This action cannot be undone. \"{name}\" will be permanently deleted.\" | \u2014 | Cancel \u00b7 **Delete Permanently** (`#DC2626`) |\n| Deactivate | **Mark Template as Inactive** | \"\"{name}\" will be moved to inactive status. Staff will no longer be able to use this template.\" | Amber callout (`#FFF4E5` bg, `#8A5300` text, 18px radius, \u26a0): \"You can reactivate this template anytime from the Template Library.\" | Cancel \u00b7 **Mark as Inactive** (red) |\n| Activate | **Activate Template** | \"\"{name}\" will be activated and made available to staff.\" | \u2014 | Cancel \u00b7 **Activate** (cyan `#5CE1E6`, dark-teal text `#255A5C`) |\n\nSuccess toast after moving: \"Template moved to Standard Templates successfully.\"; error \"Failed to move template to Standard Templates.\"\n\n**Move to Standard Templates** (a review form, not a plain confirm): 900px (`maxWidth: md`), 18px radius.\n- Title \"Move to Standard Templates\" \u00b7 \"Review and refine this staff-created template before making it available across the vertical.\"\n- Grey **Original template** box: Author, Category, Type, Subject, Body (placeholders like `{{patient_name}}` shown in blue).\n- **Standard template details:** `Template Name *` \u00b7 `Category *` (select) \u00b7 `Subject *` (email only) \u00b7 `Template Body *` with \"Character limit: 68/1000\".\n- Footer (divider above, right-aligned): **Cancel** (outlined pill) \u00b7 **Move to Standard** (cyan pill).\n\n### Settings \u2192 Competency: `/verticals/public/settings?section=competency`, red trash on a row\nDesign D. **Delete Competency** + \u2715 \u00b7 \"Are you sure you want to delete **\"{name}\"**? This action cannot be undone.\" \u00b7 Cancel (outlined pill, left) \u00b7 **\ud83d\uddd1 Delete Competency** (red pill, right). 640px wide, 14px radius, 40px padding. \u2715 and Cancel are disabled while deleting.\n- Row tooltips: \"Edit\" / \"Delete\", or **\"Can be edited via vertical settings\"** / **\"Can be deleted via vertical settings\"** when a practice-level row was defined by the vertical (buttons disabled).\n\n### Settings \u2192 Pathway Configuration\nNo confirmations. The only row action is **Configure {pathway}**, which opens the pathway page.\n\n### Archive Practice **(code; not reachable on screen)**\n`ArchiveConfirmModal` exists, but the practice list passes `onArchivePractice: undefined` and `showArchivedTab: false`, so there's no Archive button anywhere.\n- 24px radius, white, padding 32px (24 on mobile), `maxWidth: sm`. **Backdrop click and Esc are both disabled.**\n- 56px orange-tint circle (`rgba(239,108,0,.08)`) with `/archive_icon.svg`.\n- **Reason Of Archiving** (h2, 24px, bold).\n- Bullets: \"The practice **{name}** will be moved to **archived status** immediately.\" \u00b7 \"You will retain **read-only access** to its historical data.\" \u00b7 \"You can **restore the practice** at any time from the Practice settings section.\"\n- **Will you help us learn why?** (20px bold) and a radio group (cyan `#5CE1E6` radios): \"The practice is no longer operational.\" (default) \u00b7 \"The data is no longer needed actively.\" \u00b7 \"We've merged with another practice.\" \u00b7 \"Other\". **Other** reveals `Reason` (textarea, \"Tell us why\", max 500, helper \"{n}/500 characters\").\n- Footer: full-width **Cancel** (outlined) + **Archive Practice** (contained).\n- Confirm only hides the row on the client (`clientArchivedIds`) and refetches. **No archive API call is made**, and the reason isn't sent anywhere.\n\n## Practice level (Main Practice - Surgery)\n\n### Leaves: Approve / Reject (`/leave-management`, Leave Requests row)\nDesign E, 600px, 24px radius. Title (h6 bold) + subtitle \"{staff} \u2014 {leave type}\" + \u2715 (**no aria-label**).\n- **Approve Leave Request:** \"Approve a pending leave request.\" \u00b7 Cancel (outlined pill) \u00b7 **\u2713 Approve** (green `#16A34A`).\n- **Reject Leave Request:** `Reason (Optional)` textarea (placeholder \"State reason of rejection here...\", max 300, counter `0/300`) \u00b7 Cancel \u00b7 **\u2715 Reject** (red `#DC2626`).\n- Buttons sit at opposite ends (space-between); on mobile they stack with Cancel underneath.\n\n### Leaves and ROTA: Cancel leave request **(code; no pending request of your own)**\nTitle \"Cancel Request\". Icon, **Cancel this leave request?**, \"This will withdraw your pending request. Your manager will no longer be able to approve or reject it. This action cannot be undone.\" A summary box shows type and \"{start} \u2013 {end} \u00b7 {duration}\". Buttons: **Keep Request** \u00b7 **Cancel Leave** (red). Toasts: \"Leave request cancelled.\" / \"Unable to cancel leave request. Please try again.\"\n\n### Patients: Archive patient (`/patient-management`, row \"Archive {name}\")\nDesign A, `warning` variant. **Archive patient** \u00b7 \"Archive {name}? They will be moved out of the active patient list.\" \u00b7 warning callout \"Archived patients can no longer be managed from this list.\" \u00b7 Cancel \u00b7 **Archive** (orange `#F97316`). Focus lands on **Archive**. Toasts: \"Patient archived.\" / \"Failed to archive the patient\".\n\n### Appointment (`/appointment`, appointment detail popup)\nThe detail popup (opened with \ud83d\udc41) has **Join Appointment \u00b7 Reschedule \u00b7 Cancel Appointment**. Each opens a second dialog on top (600px, 24px radius), with an icon tile top-left and \u2715 top-right:\n- **Cancel Appointment:** red \u24d8 \u00b7 \"Are you sure you want to cancel this appointment?\" \u00b7 **`Reason *`** textarea (placeholder \"Type description here\", 4 rows) \u00b7 \"Character limit: 300\" \u00b7 full-width **Go Back** (outlined pill) + **Yes Cancel** (grey/disabled until a reason is typed, then red).\n- **Reschedule Appointment:** \"Are you sure you want to reschedule this appointment? The patient will be asked to choose a new time.\" \u00b7 **Go Back** \u00b7 **Yes Reschedule** (cyan `#5CE1E6`, dark-teal text).\n- **(code)** status confirms on booked appointments:\n  - **Mark as Completed:** \"Are you sure you want to mark this appointment as **Completed**?\" + \"This confirms that the patient attended and the appointment took place. The appointment status will be updated and any associated workflows (such as clinical notes, follow-up, or reporting) will be triggered.\" \u2192 **Yes, Mark as Completed**\n  - **Mark as Do Not Appear (DNA):** \"\u2026did not attend the appointment\u2026 may be affected.\" \u2192 **Yes, Mark as DNA**\n\n### Staff on-boarding (`/staff`, Staff List row actions)\n- **Lock User Profile** (Lock user \ud83d\udd12; only on Active rows): 636px, 16px radius, **blurred backdrop** (the only blurred one). Red lock icon tile \u00b7 title \u00b7 grey user card (initials avatar, name, \"{role} \u2022 {practice}\", email) \u00b7 three lines: \"Are you sure you want to lock this user's profile?\" / \"Locking this user will immediately revoke their access to the platform.\" / \"They will no longer be able to access this business until their access is restored.\" \u00b7 blue info callout \"This action can be reversed by unlocking the user at any time.\" \u00b7 full-width **Cancel** (outlined pill) + **Lock User** (`#D32F2F`).\n- **Archive staff:** the button is **hard-coded `disabled`** in the code, so there's no popup.\n- Pending rows show **Approve / Reject** outlined buttons. Resend invite (sent invitations) acts straight away with no confirm.\n\n### ROTA Management (`/rota`)\n- **Delete Rota Template** (Apply Rota Template \u2192 Choose Rota Template popup \u2192 \ud83d\uddd1 on a template): Design A, error. Subtitle \"This can't be undone.\" **and** body \"Are you sure you want to delete this rota template? This action cannot be undone.\" (the same sentence twice). Cancel \u00b7 **\ud83d\uddd1 Delete** (`#D32F2F`). Focus lands on Delete. Opens above the template popup (`zIndex 1400`).\n- **Delete Assignment** (open a shift \u2192 Edit Assignment drawer \u2192 red \ud83d\uddd1 next to the assigned staff): Design A, error. \"Are you sure you want to delete this assignment? This action cannot be undone.\" \u00b7 Cancel \u00b7 **\ud83d\uddd1 Delete**.\n- **Shift Bidding (code; no open shifts):** \"Claim Shift\" (\"Are you sure you want to claim this shift?\" \u2192 **Claim**, primary) \u00b7 \"Decline Shift\" (\"Are you sure you want to decline this shift opportunity?\" \u2192 **Decline**, error) \u00b7 \"Accept Bid\" (`maxWidth: xs`): \"Are you sure you want to accept this bid from {staff} at \u00a3{amount}? This will assign the slot to them.\" \u2192 **Accept Bid** (green).\n- **Apply template (code):** checkbox \"Clear existing shifts before applying template\", with a tooltip warning that all shifts in the date range will be deleted. There is no separate confirm step.\n\n### HR Policies: Delete policy **(code; library is empty)**\nDesign A, error. **Delete policy?** \u00b7 \"\"{title}\" and all its versions will be removed from the library, and the assistant will stop answering from it.\" \u00b7 **Delete**. Toasts: \"Policy deleted.\" / \"We couldn't delete this policy.\"\n\n## Issues found\n- **Five different confirm-dialog designs.** Radii are 14 / 18 / 24 / 36px, widths 520\u2013640px, and buttons are full-width in some and right-aligned in others. Rebuild them as one `ConfirmDialog`.\n- **The shared ConfirmDialog focuses the destructive button, and Enter confirms.** One accidental Enter archives a patient or deletes an assignment. Focus should start on Cancel.\n- **\"This can't be undone.\" appears twice** on Delete Rota Template and Delete Assignment (auto subtitle plus body text).\n- **Archive Practice is unreachable** (no archive action is passed), and its confirm makes **no API call**: the row is only hidden on the client.\n- **Archive staff is permanently disabled** (hard-coded), and the icon gives no reason or tooltip.\n- **The Leave Approve/Reject \u2715 has no `aria-label`.** Rota template edit and delete icons have no labels either.\n- **The Choose Rota Template popup shows the browser's amber focus outline** around the whole dialog.\n- **Rota templates listed in Main Practice belong to \"Friary House Surgery\"**, so templates aren't scoped to the current practice.\n- **Edit Assignment loads the wrong date:** clicking Tue 27 Oct requests `date=2026-10-05` (confirms the \"Mon, 5 Oct\" bug).\n- **Different cancel wording:** \"Cancel\", \"Go Back\", \"Keep Request\".\n- **Different confirm wording:** \"Yes Cancel\" / \"Yes Reschedule\" (no comma) vs \"Yes, Mark as Completed\" (comma).\n- **The appointment Cancel reason is required, but leave Reject reason is optional.** Their limits are both 300.\n- **Lock User** is the only dialog with a blurred backdrop.\n- **Delete Role:** Esc closes the whole dialog even when only the autocomplete is open, so any reassignments already picked are lost.\n- **Mark as Inactive** uses a red (destructive) button although the action can be undone.\n"}, {"id": "practice-user/00-practice-user-role", "title": "Role overview and module differences", "md": "# Practice user \u00b7 Role overview and module differences\n\nCaptured 2026-10-27, signed in as **Aliii Emis** (staff record \"Ali Emis - 201\", GP, Clinician inbox) in **Public Primary Care \u2192 Main Practice - Surgery**. `/api/auth/me` returns `isAdmin: false` with an **empty `role`**.\nEvery module in this role's sidebar was opened read-only. A page guard blocked all writes except the app's own practice-select call (see \"Entry flow\"). Screens that look the same as the super-admin capture link to the existing doc; this page records **only what differs**.\n\n## Entry flow\n1. Login \u2192 `/verticals` \u2192 **Public Primary Care** \u2192 `/verticals/public/practices`.\n2. **Practice grid:** only the practices this user belongs to (**2**: Abbey Medical Centre, Main Practice - Surgery; `1\u20132 of 2`).\n   - Header pill: logo and vertical name in the centre, \ud83d\udd14, user pill **\"Aliii Emis / Actions\"** (subtitle \"Actions\" where super-admin shows \"super-admin\").\n   - **No \u2630 hub menu and no \"Back to Verticals\"** button.\n   - Hub routes (`/compliance-dashboard`, `/roles`, `/templates`, `/settings` \u2026) **redirect** back to the grid.\n3. Clicking a practice sends:\n   - `PATCH /api/crm/api/users/v1/sub-apps/{subAppId}/users/{userId}/user-businesses/{practiceId}/select`, which stores the current practice on the server.\n   - `POST /api/crm/api/activity/v1/sub-apps/{subAppId}/user-sessions` (activity tracking).\n   - Super-admin sends neither: it keeps the practice in client state only.\n4. If the select call fails, the grid shows a **raw red MUI Alert with the bare error message** (seen as \"blocked by capture guard\") and stays on the grid.\n\n## Shell differences\n| | Super-admin | Practice user |\n|---|---|---|\n| Sidebar extra item | \u2014 | **Profile** (`/profile`, under Dashboard, same icon as the top bar) |\n| HR Policies | \u2713 | **Not in the menu** |\n| Sidebar user card | \"Aqlios Admin \u00b7 super-admin\" | **\"Aliii Emis\"** only, with no role line |\n| \ud83d\udd14 top bar | plain | **red unread dot** |\n| Dashboard banner | \"Welcome, Aqlios!\" | \"Welcome, **Aliii**!\" / \"You are in Public Primary Care\" |\n\nEvery other item, including the 12 `coming-soon/*` pages and the 4 practice placeholders (Recruitment, Performance, Support, Notifications), matches `docs/practice/00-practice-shell-and-module-map.md` and `04-documents-and-placeholders.md`. **CQC Compliance** is `coming-soon/cqc-compliance` here as well. Documents doesn't appear in this role's menu.\n\n## Module by module\n| Module | Same as super-admin? | Differences |\n|---|---|---|\n| Dashboard | Yes | Name only |\n| **Profile** | **New** | See below |\n| Patients | Yes (`01-patients.md`) | View and Archive are both available |\n| Tickets | Yes (`02-tickets.md`) | Same care-navigator table and actions (View consultation, Approve recommended staff, Assign to Alternative Staff) |\n| Appointment | Yes (`03-appointment.md`) | Calendar empty for this week. **Clear filters is disabled** when no filter is set (it was enabled for super-admin) |\n| Staff on-boarding | Yes (`05-staff-onboarding.md`) | Bulk Import Staff and Invite Staff are available. Lock user is enabled on active rows; Archive staff is disabled as everywhere. Counts at capture: 56 total, 20 active, 35 pending |\n| ROTA Management | Yes (`06-rota-management.md`) | Same tabs and buttons (Create and Apply Rota Template are available) |\n| Leaves | Yes (`07-\u2026`) | **Can Approve and Reject** the super-admin's leave requests |\n| **Leaves and ROTA** | **Differs** | Real balances and **Apply For Leave**. See below |\n| Settings | Mostly | Competency rows defined at vertical level are locked. Template actions include Edit, Mark as Inactive and Delete on **standard (hub) templates**. See below |\n\n### Profile: `/profile` (the user's own staff record)\nSame page as **Staff Member Details** in Staff on-boarding (`05-staff-onboarding.md`), opened for the signed-in user:\n- Header: `\u2039 Back` \u00b7 **Staff Member Details** \u00b7 Save Changes (top right, disabled until something changes).\n- Identity card: initials avatar, \"Ali Emis - 201\", practice, \"Rota Group: Croft Hall Rota Group, Primary Rota Group\".\n- Tabs: Account Details \u00b7 Leave Management \u00b7 Compliance \u00b7 Competencies \u00b7 Payroll \u00b7 **Security** (the extra tab).\n- **Security** card: \ud83d\udd12 tile, \"Security\" / \"Manage your password and account protection settings.\" Fields:\n  - `Current Password *`, `New Password *` (helper \"Password must be at least 12 characters and include an uppercase letter, a lowercase letter, a number, and a special character.\"), `Confirm New Password *`.\n  - Each field has a \ud83d\udc41 toggle (\"Show current password\" and so on).\n  - Saved with the page-level **Save Changes**.\n- **Leave Management tab** (read-only for self):\n  - Annual Leave Entitlement: **48.37 Hours \u2022 7.33 Days**, Duration Type Weeks, \"Annual Leave Balance: 4.1 weeks\", with the note \"\u2026automatically calculated based on the joining date (01 Apr 2026) for the current leave year: 4.1 weeks.\"\n  - Sick Leave Entitlement: \"40 Hours \u2022 1 Week\", \"Sick Leave Balance: 1.21 weeks\".\n  - Other Leaves Entitlement: \"No Fixed Entitlement\".\n- **Compliance tab:** the user's own documents, with **Upload / Re-upload** enabled on non-verified items and disabled on verified ones.\n- **Competencies tab:** Consultation Details (Inbox, Staff Type), Age Groups (0-12, 13-16, Above 16, 16-45, 45+), Competency Mapping with \"Date Completed\" pickers disabled.\n- **Payroll tab:** Payroll Documents table with Download/Upload, Pension Enrolment radios (No Pension, NHS Pension, GP Salaried Pension, NEST Pension), Payroll Updates (Deduction / Additional Payment, with amount, reason and end date).\n\n### Leaves and ROTA: `/leave-and-rota` (self-service leave)\n- Card **Leave History** / \"Manage your leave requests here.\" \u00b7 **Apply For Leave** button (top right, dark teal). It isn't shown for super-admin: the code shows it only to non-admin users with `APPLY_FOR_LEAVE`.\n- Balance cards now show real values:\n  - **Remaining Annual Leave 4.1w** \"Out of 4.1 Weeks\"\n  - **Remaining Sick Leave 40h** \"Out of 40 Hours\"\n  - TOIL 0h, Bereavement 0d, Compassionate 0d and Maternity 0d, each \"Approval Required\"\n- Table empty: **\"No leave records found.\"** (Leaves History in Leave Management says \"No leave history found.\")\n\n**Apply For Leave drawer** (right drawer, 480px, 18px radius; opened and cancelled):\n- Title **Apply For Leave** + \u2715 (**no aria-label**) \u00b7 \"Fill the form below to apply for leave.\"\n- `Leave Type *` (default Annual Leave): Annual, Sick, Maternity, Paternity, Bereavement, Emergency, Compassionate, TOIL Leave (Time Off in Lieu).\n- Grey balance pill under the type: **\"Annual Leave Balance: 135.44 Hours\"**.\n- `Start Date *` \u00b7 `End Date *` (date pickers, side by side) \u00b7 `Duration *` \u00b7 `Duration Type`: **Hours / Day**.\n- `Note` textarea (placeholder \"Write your message here (Optional)\", `0/300`).\n- Footer: **Cancel** (outlined pill) \u00b7 **Apply Leave** (dark teal pill, enabled while empty).\n- Cancelling a pending request uses the \"Cancel this leave request?\" dialog (`docs/practice/09-confirmation-popups.md`).\n\n### Settings (practice)\n| Section | Practice user |\n|---|---|\n| Appointment Configuration | Same form. Cancel and Save Changes are **disabled until a change is made**; 4 of 36 inputs are disabled |\n| Competency | Add Competency available. Rows defined by the vertical have **disabled \u270e/\ud83d\uddd1** with tooltips \"Can be edited via vertical settings\" / \"Can be deleted via vertical settings\" (3 of 6 rows locked) |\n| Pathway Configuration | Same; practice counts (e.g. Administrative 3 of 5, Cardiovascular 2 of 7, Men's Health 1 of 1) |\n| Practice Profile | Placeholder (same) |\n| Templates | Same 27 templates. \u22ee menus: standard: View Details \u00b7 **Edit Template \u00b7 Mark as Inactive/Activate \u00b7 Delete Template**; staff-created: View Details \u00b7 Edit Template \u00b7 Move to Standard \u00b7 **Mark as Inactive** \u00b7 Delete Template |\n\n## Issues found\n- **The practice user can edit, deactivate and delete standard (hub) templates** from practice Settings. Those templates are shared across the vertical, so one practice can remove them for every practice.\n- **The practice user can approve or reject a super-admin's leave**, and the Leaves approver list isn't limited to the user's own team.\n- **Leave balance units disagree across three screens:**\n  - Annual leave: the card says 4.1w, the drawer says 135.44 Hours, and the profile says entitlement 48.37 Hours \u2022 7.33 Days. 4.1 weeks is not 48 hours.\n  - Sick leave: the card says 40h, the profile says \"1.21 weeks\" balance and \"40 Hours \u2022 1 Week\" entitlement.\n- **Duration Type options mix plural and singular:** \"Hours / Day\".\n- **Apply Leave is enabled with an empty form**, and the drawer's \u2715 has no aria-label.\n- **`/api/auth/me` returns an empty `role`** for this user, so the UI shows \"Actions\" in the user pill and no role on the sidebar card.\n- **A failed practice-select call shows a raw error string** in a red alert on the grid.\n- **Empty-state wording differs:** \"No leave records found.\" vs \"No leave history found.\"\n- **Hub routes silently redirect** non-admins to the grid. There's no \"no access\" message.\n- **HR Policies is missing for this role**, although it's a staff-facing feature (Ask HR is meant for staff).\n"}]</script>
<script>
const DOCS = JSON.parse(document.getElementById('docs').textContent);
const GROUPS = [
  ['Foundations', d => !d.id.includes('/')],
  ['Vertical level (super-admin)', d => d.id.startsWith('super-admin/')],
  ['Practice level', d => d.id.startsWith('practice/')],
  ['Practice user role', d => d.id.startsWith('practice-user/')],
];
const nav = document.getElementById('nav'), view = document.getElementById('view');
function btn(id, label){const b=document.createElement('button');b.type='button';b.textContent=label;b.dataset.id=id;b.onclick=()=>go(id);return b}
nav.append(btn('overview','Overview'));
for (const [g,f] of GROUPS){const h=document.createElement('div');h.className='grp';h.textContent=g;nav.append(h);DOCS.filter(f).forEach(d=>nav.append(btn(d.id,d.title)))}

const SW = [['Primary teal','#2C7A7B'],['Teal dark','#255A5C'],['Brand cyan','#5CE1E6'],['Teal light','#E0F2F1'],['Sidebar hover','#EFFCFC'],['Error','#DC2626'],['Asterisk','#D32F2F'],['Success','#16A34A'],['Warning','#F97316'],['Canvas','#F5F5F5'],['Ink','#112744']];
function overview(){
  const s = window.STATS;
  view.innerHTML = `<div class="overview">
   <h1>What has been captured so far</h1>
   <p class="lead">Every screen below was recorded from the live dev app (crm.dev.aqlios.31g.co.uk) as Vertical Admin / super-admin in Public Primary Care, plus a non-admin practice user. These are the specs the rebuild will follow; no app code has been written yet.</p>
   <div class="note">This is a reference library, not the rebuilt app. Once you approve the stack and the first module plan, a clickable preview of the rebuilt screens will replace this.</div>
   <div class="stats">
     <div class="stat t"><span class="n">${s.docs}</span><span class="l">documents captured</span></div>
     <div class="stat ok"><span class="n">7</span><span class="l">vertical modules built</span></div>
     <div class="stat ok"><span class="n">9</span><span class="l">practice modules built</span></div>
     <div class="stat warn"><span class="n">26</span><span class="l">placeholder / coming-soon pages</span></div>
     <div class="stat err"><span class="n">${s.issues}</span><span class="l">issues flagged in the docs</span></div>
   </div>
   <h2 class="sec">Design tokens in use</h2>
   <div class="swatches">${SW.map(([n,h])=>`<div class="sw"><i style="background:${h}"></i><div><span>${n}</span><code>${h}</code></div></div>`).join('')}</div>
   <h2 class="sec">Jump to a document</h2>
   <div class="chips">${DOCS.map(d=>`<button class="chip" type="button" data-id="${d.id}">${d.title}</button>`).join('')}</div>
  </div>`;
  view.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(c.dataset.id));
}
function render(d){
  const html = marked.parse(d.md, {gfm:true});
  view.innerHTML = `<div class="crumb">${d.id}</div><div class="md">${html}</div>`;
  view.querySelectorAll('.md table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.append(t)});
}
function go(id){
  nav.querySelectorAll('button').forEach(b=>b.toggleAttribute('aria-current',false));
  const b = nav.querySelector(`button[data-id="${CSS.escape(id)}"]`); if(b) b.setAttribute('aria-current','page');
  const d = DOCS.find(x=>x.id===id); d ? render(d) : overview();
  try{ history.replaceState(null,'','#'+(d?id.replace(/[^A-Za-z0-9._~-]/g,'-'):'overview')) }catch(e){}
  window.scrollTo(0,0);
}
const h = (location.hash||'').slice(1); const start = DOCS.find(d=>d.id.replace(/[^A-Za-z0-9._~-]/g,'-')===h);
go(start ? start.id : 'overview');
</script>
